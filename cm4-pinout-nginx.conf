# CM4 2x100 pinout (cm4_pinout.html) on a dedicated plain-HTTP port, no TLS.
# Installed as /etc/nginx/sites-available/cm4-pinout; document root is a
# symlink directory pointing at this repository checkout.
server {
	listen 8088;
	listen [::]:8088;
	server_name _;

	root /var/www/cm4-pinout;
	index cm4_pinout.html;

	location / {
		try_files $uri $uri/ =404;
	}
}
