<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseboard CM4 — pinout 2×100</title>
<style>
:root{
  --font:system-ui,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --fg:#0d0d0d;--fg2:#525252;--bg:#f5f5f5;--bg2:#ebebeb;--bg3:#d9d9d9;
  --bd:#1a1a1a;--bd2:#737373;--bd3:#a3a3a3;--sel:#0d0d0d;
  --r:10px;--focus:0 0 0 2px var(--bg),0 0 0 4px #404040;
}
@media (prefers-color-scheme:dark){:root{
  --fg:#f0f0f0;--fg2:#a3a3a3;--bg:#141414;--bg2:#1f1f1f;--bg3:#2a2a2a;
  --bd:#e5e5e5;--bd2:#737373;--bd3:#404040;--sel:#ffffff;--focus:0 0 0 2px #141414,0 0 0 4px #a3a3a3;
}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:1rem clamp(16px,3vw,24px) 2rem;font-family:var(--font);color:var(--fg);background:var(--bg);line-height:1.45}
.w{max-width:1360px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{margin:0;font-size:clamp(1.05rem,2.5vw,1.3rem);font-weight:600;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--fg2)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--bd3);border-radius:20px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:5px 12px;border:0;background:transparent;color:var(--fg2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:none;box-shadow:var(--focus)}
#q{font:inherit;font-size:13px;padding:5px 10px;border:1.5px solid var(--bd3);border-radius:20px;background:var(--bg2);color:var(--fg);min-width:220px;max-width:100%}
#q:focus-visible{outline:none;box-shadow:var(--focus)}
.legend{display:flex;flex-wrap:wrap;gap:5px 8px;margin-bottom:12px}
.lg{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;color:var(--fg2);background:var(--bg2)}
.lg:hover{border-color:var(--bd2)}.lg:focus-visible{outline:none;box-shadow:var(--focus)}
.lg[aria-pressed="true"]{border-color:var(--bd);background:var(--bg3);color:var(--fg)}
.lg .d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1000px){.main{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.board-wrap{overflow-x:auto;border:1px solid var(--bd3);border-radius:var(--r);background:var(--bg2)}
#board{display:block;min-width:900px;width:100%;height:auto}
.pad{cursor:pointer}
.pad rect{stroke:transparent;stroke-width:2;transition:opacity .12s}
.pad text{font-family:var(--mono);font-size:7px;fill:#fff;text-anchor:middle;pointer-events:none;user-select:none}
.pad.dim rect,.pad.dim text{opacity:.15}
.pad.sel rect{stroke:var(--sel);stroke-width:3}
.pad.mate rect{stroke:var(--sel);stroke-width:2;stroke-dasharray:3 2}
.pad:focus-visible{outline:none}.pad:focus-visible rect{stroke:var(--sel);stroke-width:3}
.pad.dnc rect{stroke:#c33}
.pad.opt rect{stroke:var(--fg2);stroke-dasharray:2 2}
.lbl{font-family:var(--font);font-size:11px;fill:var(--fg2)}.lbl.b{fill:var(--fg);font-weight:600}
.outline{fill:none;stroke:var(--bd3);stroke-width:1.5}
.hole{fill:none;stroke:var(--bd3)}.soc{fill:var(--bg3);stroke:var(--bd3)}
.ant{fill:none;stroke:var(--bd2);stroke-dasharray:4 3}
.panel{background:var(--bg2);border:1px solid var(--bd3);border-radius:var(--r);padding:12px 14px;font-size:13px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.panel .ph{color:var(--fg2)}
.panel h2{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel ul{padding-left:0;list-style:none;margin:6px 0}.panel li{margin:3px 0}
.pn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;color:#fff;font-size:12px;font-weight:600}
.muted{color:var(--fg2);font-weight:400;font-size:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin:8px 0}
.kv dt{color:var(--fg2)}.kv dd{margin:0}code{font-family:var(--mono);font-size:12px}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;color:#fff;font-size:11px;font-weight:500}
.dsq{margin:6px 0;padding:8px 10px;border-left:3px solid var(--bd3);background:var(--bg);font-size:12px;color:var(--fg2)}
.alt{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
.alt th,.alt td{border:1px solid var(--bd3);padding:2px 5px;text-align:left;font-family:var(--mono)}
.alt th{font-family:var(--font);color:var(--fg2);font-weight:500}
.alt td.on{background:var(--bg3);font-weight:700}
.linkbtn{font:inherit;font-size:12px;border:1px solid var(--bd3);background:var(--bg);color:var(--fg);border-radius:6px;padding:1px 7px;cursor:pointer}
.panel .close{display:none;margin-left:auto}
.tbl-sec{margin-top:16px}
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px;color:var(--fg2)}
#csv{font:inherit;font-size:12px;padding:4px 10px;border:1.5px solid var(--bd3);border-radius:20px;background:var(--bg2);color:var(--fg);cursor:pointer}
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd3);border-radius:var(--r);max-height:70vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 8px;border-bottom:1px solid var(--bd3);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--bg2);color:var(--fg2);font-weight:500;white-space:nowrap;z-index:1}
td.mono{font-family:var(--mono);white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg2)}tr.row.sel{background:var(--bg3)}
tr.row[hidden]{display:none}
td.txt{min-width:280px;color:var(--fg2)}
body.layer-ds .prj{display:none}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.facts{margin-top:16px;font-size:13px}.facts summary{cursor:pointer;font-weight:600}
.facts ul{padding-left:20px;margin:8px 0}.facts li{margin:4px 0}
dialog{border:1px solid var(--bd3);border-radius:var(--r);background:var(--bg);color:var(--fg);max-width:min(90vw,700px)}
dialog textarea{width:100%;height:50vh;font-family:var(--mono);font-size:11px}
@media (max-width:999px){
  body.has-sel .panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:45vh;border-radius:var(--r) var(--r) 0 0;z-index:10;box-shadow:0 -4px 16px rgba(0,0,0,.25)}
  body.has-sel .panel .close{display:inline-block}
}
</style>
</head>

я rpiboot нужен прямой путь USB CM4 ↔ ПК в device-режиме: переключатель/джампер между upstream хаба и сервисным портом — решение схемотехника."},"103":{"net":"USB_DN","dev":"USB","note":"USB 2.0 D−, 90 Ω, ±0.15 мм в паре. → upstream хаба USB 2.0 (2 внешних порта, LTE-модем, резерв) / сервисный порт rpiboot. В ОС: otg_mode=1."},"105":{"net":"USB_DP","dev":"USB","note":"USB 2.0 D+, 90 Ω."},"102":{"net":"PCIE_CLKREQ_N","dev":"PCIE","note":"→ M.2 CLKREQ#. Обязателен: без него CM4 не выдаёт REFCLK. Pull-up внутри."},"109":{"net":"PCIE_RST_N","dev":"PCIE","note":"→ M.2 PERST#. Обязателен для корректного сброса SSD."},"110":{"net":"PCIE_REFCLK_P","dev":"PCIE","note":"→ M.2 REFCLK+, 100 МГц, 90 Ω, ±0.1 мм в паре. AC-конденсатор уже на CM4."},"112":{"net":"PCIE_REFCLK_N","dev":"PCIE","note":"→ M.2 REFCLK−."},"116":{"net":"PCIE_RX_P","dev":"PCIE","note":"← M.2 PETp0 (передатчик SSD). 90 Ω. AC-конденсаторы — на стороне SSD (на NVMe-карте уже есть)."},"118":{"net":"PCIE_RX_N","dev":"PCIE","note":"← M.2 PETn0."},"122":{"net":"PCIE_TX_P","dev":"PCIE","note":"→ M.2 PERp0. 90 Ω. AC-конденсатор уже на CM4."},"124":{"net":"PCIE_TX_N","dev":"PCIE","note":"→ M.2 PERn0."},"128":{"net":"CSI0_D0_N","dev":"CSI0","note":"→ FFC камеры (CSI0, 2 lane), 100 Ω. CM4IO: 22-pin 0.5 мм; камеры RPi: 15-pin 1.0 мм (переходной шлейф)."},"130":{"net":"CSI0_D0_P","dev":"CSI0","note":"→ FFC камеры, 100 Ω."},"134":{"net":"CSI0_D1_N","dev":"CSI0","note":"→ FFC камеры, 100 Ω."},"136":{"net":"CSI0_D1_P","dev":"CSI0","note":"→ FFC камеры, 100 Ω."},"140":{"net":"CSI0_CLK_N","dev":"CSI0","note":"→ FFC камеры, 100 Ω."},"142":{"net":"CSI0_CLK_P","dev":"CSI0","note":"→ FFC камеры, 100 Ω."},"115":{"net":"CSI1_D0_N","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI (RAA278842 — 4 lane; XS9915; ML86112 — 1 lane). 100 Ω. Вывести на площадки/разъём."},"117":{"net":"CSI1_D0_P","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI, 100 Ω."},"121":{"net":"CSI1_D1_N","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI, 100 Ω."},"123":{"net":"CSI1_D1_P","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI, 100 Ω."},"127":{"net":"CSI1_CLK_N","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI, 100 Ω."},"129":{"net":"CSI1_CLK_P","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI, 100 Ω."},"133":{"net":"CSI1_D2_N","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI, 100 Ω."},"135":{"net":"CSI1_D2_P","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI, 100 Ω."},"139":{"net":"CSI1_D3_N","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI, 100 Ω."},"141":{"net":"CSI1_D3_P","dev":"CSI1","status":"opt","note":"Резерв под analog→MIPI, 100 Ω."}},"ds_notes":{"GND":"Все GND подключить.","PWR5":"Главный вход 4.75–5.25 В, монотонный рост; соединить все пины +5V.","PWR33":"Выход регулятора CM4: ≤300 мА/пин, ≤600 мА суммарно; пропадает при GLOBAL_EN=0.","PWR18":"Выход регулятора CM4: ≤300 мА/пин, ≤600 мА суммарно; при пропадании +5V нагрузка должна обнулиться.","GPIO":"3.3 В при GPIO_VREF=CM4_3.3V; суммарно ≤50 мА на все 28 GPIO; drive strength и slew — минимальные (EMC).","ETH":"100 Ω дифф-пары, в паре ±0.15 мм, между парами ≤50 мм; MagJack 1:1; LED активные низким, 8 мА.","SD":"Только CM4 Lite.","USB":"USB 2.0 480 Мбит/с, 90 Ω, в паре ±0.15 мм.","PCIE":"PCIe Gen2 x1, 90 Ω, в паре ±0.1 мм; между парами согласование не нужно.","CSI0":"MIPI CSI-2, 2 lane, 100 Ω, в паре ±0.15 мм.","CSI1":"MIPI CSI-2, 4 lane, 100 Ω, в паре ±0.15 мм.","HDMI0":"100 Ω; между парами ≤25 мм.","HDMI1":"100 Ω; между парами ≤25 мм.","DSI0":"MIPI DSI, 100 Ω.","DSI1":"MIPI DSI, 100 Ω.","I2C0":"I2C камеры/дисплея (BCM GPIO44/45), 1.8k pull-up на CM4.","RSV":"Не подключать.","VDAC":"Композитный видеовыход.","ANALOG":"Аналоговые входы MXL7704 (CC Type-C).","CTRL":"Служебные сигналы загрузки, сброса, LED — уровни CM4_3.3V."},"facts":["Ответные разъёмы: DF40C-100DS-0.4V (высота стека 1.5 мм) или DF40HC(3.0)-100DS-0.4V (3.0 мм). Модуль 55×40 мм, толщина 1.2 мм, 4× M2.5 с отступом 3.5 мм от края (§3.1).","Все GND подключить. Второй разъём (101–200) можно не ставить только если ни один его сигнал не нужен — у нас нужны PCIe, USB, CSI (§4).","GPIO_VREF (78) → CM4_3.3V (84/86); в воздухе или на GND нельзя. Напряжение на GPIO0–27 не выше CM4_3.3V (§4).","Суммарная нагрузка всех 28 GPIO ≤ 50 мА; GPIO2/3 имеют 1.8k pull-up на CM4; drive strength и slew rate ставить минимальные (§2.5).","CM4_3.3V и CM4_1.8V: ≤300 мА/пин, ≤600 мА на шину; при внезапном пропадании +5V нагрузка на 1.8V должна обнулиться, а 3.3V не должна падать ниже 1.8V (§4, §5.4).","+5V: 4.75–5.25 В, монотонный рост, все шесть пинов; ток 400 мА idle, ~1.4 А typ. Проверка запаса: при GLOBAL_EN=0 внешняя нагрузка 2 А не должна просаживать шину (§5, §6).","До появления +5V и при выключенном CM4 ни на один пин нельзя подавать напряжение — обратное питание блокирует старт (§4, §5.1).","Дифф-пары 100 Ω: Ethernet, CSI, HDMI, DSI; 90 Ω: PCIe, USB. В паре согласование ±0.15 мм (PCIe ±0.1 мм). Между парами: PCIe/USB не требуется, Ethernet ≤50 мм, HDMI ≤25 мм. Разбег дорожек на самом CM4 — в панели пина (табл. 7–8).","PCIe: AC-конденсаторы на CLK и TX уже на CM4; на RX — на стороне устройства (на NVMe-карте есть). PCIe_CLK_nREQ и PCIe_nRST подключить обязательно. TX/RX на разъём M.2 без перекрещивания — имена PETp/PERp даны со стороны модуля (§2.3).","USB 2.0: 90 Ω, ±0.15 мм; в ОС otg_mode=1. USB_OTG_ID на GND для фиксированной роли host (§2.4). Для rpiboot (прошивка eMMC) USB CM4 должен идти к ПК напрямую, минуя хаб.","Ethernet: PHY BCM54210PE на CM4; типовая схема — MagJack 1:1; LED активные низким, IOL 8 мА (§2.2).","Wi-Fi: под PCB-антенной CM4 в baseboard нужен вырез в земле минимум 6.5×11 мм, лучше 8×15 мм, без металла ближе 10 мм; даташит рекомендует внешнюю антенну через U.FL (dtparam=ant2). Сертификация сторонних антенн — отдельно (§2.1, §3.1).","Последовательность включения: +5V → GLOBAL_EN → 3.3V → 1.8V (+1 мс) → RUN_PG (+10 мс) → nEXTRST (+1 с). nRPIBOOT должен быть низким в течение 2 мс после +5V (§5.1).","RUN_PG: сброс через 220 Ω на GND; GLOBAL_EN низкий = полное выключение, 15 мкА; GLOBAL_EN высокий + ОС выключена = 8 мА (§4, §5.3).","Диапазон −20…+85 °C; троттлинг BCM2711 от 85 °C; RF оптимален до +75 °C (§3.2).","Вариант с eMMC: пины SD_* (57, 61–75) не использовать (§4)."]};

<script>
/*LIB-START*/
var LIB = (function () {
  var GROUPS = {
    GND:{n:'GND',c:'#333333'}, PWR5:{n:'+5V',c:'#D85A30'}, PWR33:{n:'3.3V',c:'#E8963C'}, PWR18:{n:'1.8V',c:'#C9A227'},
    GPIO:{n:'GPIO',c:'#2E8B57'}, ETH:{n:'Ethernet',c:'#4A6FA5'}, SD:{n:'SD/eMMC',c:'#8B8B3A'}, USB:{n:'USB',c:'#C46A2B'},
    PCIE:{n:'PCIe',c:'#2F7FB8'}, CSI0:{n:'CSI0',c:'#3C9D8A'}, CSI1:{n:'CSI1',c:'#7FB8A8'},
    HDMI0:{n:'HDMI0',c:'#A05A9C'}, HDMI1:{n:'HDMI1',c:'#C489C0'}, DSI0:{n:'DSI0',c:'#6B5FB5'}, DSI1:{n:'DSI1',c:'#9A90D6'},
    I2C0:{n:'I2C0',c:'#5B8AC2'}, CTRL:{n:'Управление',c:'#8A4FBF'}, RSV:{n:'Reserved',c:'#B22222'},
    VDAC:{n:'TV-out',c:'#8C8C8C'}, ANALOG:{n:'Analog',c:'#8C8C8C'}
  };
  var DIRS = {gnd:'земля', power_in:'вход питания', power_out:'выход питания', in:'вход', out:'выход', bidir:'двунаправленный', nc:'не подключать'};
  var STATUS = {used:'используется', opt:'опционально / резерв', free:'свободен', nc:'не используется', dnc:'не подключать'};
  var PITCH = 18, PAD = 16, X0 = 60, Y = {J1:{odd:52, even:72}, J2:{odd:340, even:360}};

  function padXY(n) {
    var k = (n - 1) % 100, col = Math.floor(k / 2);
    return {x: X0 + (49 - col) * PITCH, y: Y[n <= 100 ? 'J1' : 'J2'][n % 2 ? 'odd' : 'even']};
  }
  function merge(pin, prj) {
    var explicit = prj.pins[String(pin.n)], e = explicit || prj.defaults[pin.grp] || {};
    var dev = e.dev || 'NC', d = prj.devices[dev];
    return {net: e.net || '', dev: dev, devName: d ? d.name : '', mode: e.mode || '',
            status: e.status || (explicit ? 'used' : 'free'), note: e.note || ''};
  }
  function busOf(mode) {
    var m = /(?:^|\s)(?:TXD|RXD|RTS|CTS)(\d)$/.exec(mode); if (m) return 'uart' + m[1];
    m = /(?:^|\s)(?:SDA|SCL)(\d)$/.exec(mode); if (m) return 'i2c' + m[1];
    m = /(?:^|\s)SPI(\d)_/.exec(mode); if (m) return 'spi' + m[1];
    m = /(?:^|\s)PWM(\d)_/.exec(mode); if (m) return 'pwm' + m[1];
    return '';
  }
  function colorOf(pin, ov, layer, prj) {
    if (layer === 'ds') return GROUPS[pin.grp] ? GROUPS[pin.grp].c : '#8C8C8C';
    if (ov.status === 'dnc') return '#B22222';
    if (ov.status === 'nc' || ov.status === 'free') return '#9A9A9A';
    var d = prj.devices[ov.dev]; return d ? d.c : '#9A9A9A';
  }
  function chipKey(pin, ov, layer) {
    if (layer === 'ds') return pin.grp;
    return (ov.status === 'nc' || ov.status === 'dnc' || ov.status === 'free') ? 'NC' : ov.dev;
  }
  function matches(pin, ov, alt, q) {
    q = (q || '').trim().toLowerCase(); if (!q) return true;
    if (/^\d+$/.test(q)) return pin.n === +q || pin.gpio === +q;
    var hay = [pin.sig, ov.net, ov.mode, ov.dev, ov.devName, busOf(ov.mode), pin.gpio != null ? 'gpio' + pin.gpio : '']
      .concat(alt ? alt.alt : []).join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  }
  function csvEsc(v) { v = String(v == null ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function csv(pins, prj) {
    var lines = ['pin;conn;row;signal;group;dir;net;device;mode;status;pair;note'];
    pins.forEach(function (p) {
      var o = merge(p, prj);
      lines.push([p.n, p.conn, p.row, p.sig, p.grp, p.dir, o.net, o.dev, o.mode, o.status, p.pair ? p.pair.partner : '', o.note].map(csvEsc).join(';'));
    });
    return lines.join('\n');
  }
  return {GROUPS: GROUPS, DIRS: DIRS, STATUS: STATUS, PITCH: PITCH, PAD: PAD, padXY: padXY, merge: merge,

})();

</script>

  function buildBoard() {
    board.appendChild(svg('rect', {class: 'outline', x: 20, y: 20, width: 960, height: 400, rx: 12}));
    [[40, 40], [960, 40], [40, 400], [960, 400]].forEach(function (c) {
      board.appendChild(svg('circle', {class: 'hole', cx: c[0], cy: c[1], r: 7}));
    });
    board.appendChild(svg('rect', {class: 'ant', x: 34, y: 110, width: 72, height: 120, rx: 4}));
    board.appendChild(svg('text', {class: 'lbl', x: 40, y: 246, 'font-size': 9}, 'Wi-Fi антенна: вырез в земле'));
    board.appendChild(svg('rect', {class: 'soc', x: 440, y: 170, width: 140, height: 100, rx: 6}));
    board.appendChild(svg('text', {class: 'lbl b', x: 510, y: 225, 'text-anchor': 'middle'}, 'BCM2711'));
    [[500, 40, 'middle', 'J1 — пины 1–100 · нечётные в верхнем ряду', true],
     [958, 40, 'end', '1 / 2 ↓', false], [60, 40, 'start', '99 / 100 ↓', false],
     [500, 328, 'middle', 'J2 — пины 101–200 · нечётные в верхнем ряду', true],
     [958, 328, 'end', '101 / 102 ↓', false], [60, 328, 'start', '199 / 200 ↓', false],
     [500, 412, 'middle', 'CM4, вид сверху: разъёмы на нижней стороне модуля (Figure 4 даташита). Не в масштабе.', false]
    ].forEach(function (l) {
      board.appendChild(svg('text', {class: 'lbl' + (l[4] ? ' b' : ''), x: l[0], y: l[1], 'text-anchor': l[2]}, l[3]));
    });
    pins.forEach(function (p) {
      var xy = LIB.padXY(p.n);
      var g = svg('g', {class: 'pad', 'data-n': p.n, tabindex: 0, role: 'button'});
      g.appendChild(svg('title', {}));
      g.appendChild(svg('rect', {x: xy.x, y: xy.y, width: LIB.PAD, height: LIB.PAD, rx: 3}));
      g.appendChild(svg('text', {x: xy.x + LIB.PAD / 2, y: xy.y + LIB.PAD / 2 + 2.5}, String(p.n)));
      g.addEventListener('click', function () { select(p.n); });
      g.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(p.n); }
      });
      board.appendChild(g);
      pads[p.n] = g;
    });
  }

  /* ---------- легенда ---------- */
  function buildLegend() {
    leg.replaceChildren();
    var src = state.layer === 'ds' ? LIB.GROUPS : PROJECT.devices;
    Object.keys(src).forEach(function (key) {
      var b = h('button', 'lg'); b.type = 'button'; b.dataset.k = key; b.setAttribute('aria-pressed', 'false');
      var d = h('span', 'd'); d.style.background = chipColor(key); d.setAttribute('aria-hidden', 'true');
      b.appendChild(d); b.appendChild(document.createTextNode(chipName(key)));
      b.addEventListener('click', function () { setFilter(state.filter === key ? null : key); });
      leg.appendChild(b);
    });
  }

  /* ---------- панель ---------- */
  function kv(dl, k, v) {
    dl.appendChild(h('dt', null, k));
    var dd = h('dd');
    if (typeof v === 'string') dd.textContent = v; else dd.appendChild(v);
    dl.appendChild(dd);
  }
  function chip(text, color) { var s = h('span', 'chip', text); s.style.background = color; return s; }
  function code(text) { return h('code', null, text); }
  function pinBtn(n) {
    var b = h('button', 'linkbtn pinbtn', 'пин ' + n); b.type = 'button';
    b.addEventListener('click', function () { select(n); });
    return b;
  }
  function altTable(gpio, mode) {
    var a = ALT[String(gpio)], t = h('table', 'alt'), tr1 = h('tr'), tr2 = h('tr');
    var used = /^ALT(\d)/.exec(mode || '');
    a.alt.forEach(function (name, i) {
      tr1.appendChild(h('th', null, 'ALT' + i));
      var td = h('td', used && +used[1] === i ? 'on' : null, name || '—');
      tr2.appendChild(td);
    });
    t.appendChild(tr1); t.appendChild(tr2);
    return t;
  }
  function renderPanel() {
    var frag = document.createDocumentFragment();
    if (state.sel == null) {
      if (state.filter) {
        var list = pins.filter(function (p) { return LIB.chipKey(p, ov(p), state.layer) === state.filter; });
        frag.appendChild(h('h2', null, chipName(state.filter) + ' · ' + list.length + ' пин.'));
        var ul = h('ul');
        list.forEach(function (p) {
          var li = h('li'), o = ov(p);
          li.appendChild(pinBtn(p.n));
          li.appendChild(document.createTextNode(' ' + p.sig + (state.layer === 'prj' && o.net ? ' — ' + o.net : '')));
          ul.appendChild(li);
        });
        frag.appendChild(ul);
      } else {
        frag.appendChild(h('div', 'ph', 'Нажмите на пин'));
      }
      panel.replaceChildren(frag);
      return;
    }
    var p = byN[state.sel], o = ov(p), col = LIB.colorOf(p, o, state.layer, PROJECT);
    var h2 = h('h2');
    var pn = h('span', 'pn', String(p.n)); pn.style.background = col; h2.appendChild(pn);
    h2.appendChild(document.createTextNode(p.sig + ' '));
    h2.appendChild(h('span', 'muted', p.conn + ' · ' + (p.row === 'odd' ? 'нечётный (верхний) ряд' : 'чётный (нижний) ряд')));
    var close = h('button', 'close linkbtn', '✕'); close.type = 'button'; close.setAttribute('aria-label', 'Закрыть');
    close.addEventListener('click', function () { select(null); });
    h2.appendChild(close);
    frag.appendChild(h2);
    if (state.layer === 'prj') {
      var dl = h('dl', 'kv');
      kv(dl, 'Цепь', o.net ? code(o.net) : '—');
      kv(dl, 'Устройство', chip(o.devName || o.dev, col));
      if (o.mode) kv(dl, 'Режим', code(o.mode));
      kv(dl, 'Статус', LIB.STATUS[o.status] || o.status);
      if (o.note) kv(dl, 'Примечание', o.note);
      frag.appendChild(dl);
    }
    var dl2 = h('dl', 'kv');
    kv(dl2, 'Группа', chip(LIB.GROUPS[p.grp].n, LIB.GROUPS[p.grp].c));
    kv(dl2, 'Направление', LIB.DIRS[p.dir] || p.dir);
    if (p.gpio != null) {
      var a = ALT[String(p.gpio)];
      kv(dl2, 'BCM2711', 'GPIO' + p.gpio + (a ? ' · при загрузке pull-' + (a.pull === 'High' ? 'up' : 'down') : ''));
    }
    if (p.pair) {
      var q = byN[p.pair.partner], span = h('span');
      span.appendChild(pinBtn(q.n));
      span.appendChild(document.createTextNode(' ' + q.sig + ' · ' + p.pair.z + ' Ω · разбег на CM4: ' + p.pair.skew + ' / ' + q.pair.skew + ' мм'));
      kv(dl2, 'Дифф-пара', span);
    }
    if (PROJECT.ds_notes[p.grp]) kv(dl2, 'Правило', PROJECT.ds_notes[p.grp]);
    frag.appendChild(dl2);
    frag.appendChild(h('div', 'dsq', p.ds));
    if (p.gpio != null && ALT[String(p.gpio)]) frag.appendChild(altTable(p.gpio, state.layer === 'prj' ? o.mode : ''));
    panel.replaceChildren(frag);
  }

  /* ---------- применение состояния ---------- */
  function apply() {
    document.body.classList.toggle('layer-ds', state.layer === 'ds');
    document.body.classList.toggle('layer-prj', state.layer === 'prj');
    document.body.classList.toggle('has-sel', state.sel != null);
    var selP = state.sel != null ? byN[state.sel] : null;
    var mate = selP && selP.pair ? selP.pair.partner : null, shown = 0;
    pins.forEach(function (p) {
      var o = ov(p), v = visible(p);
      if (v) shown++;
      var g = pads[p.n], cls = 'pad';
      if (!v) cls += ' dim';
      if (p.n === state.sel) cls += ' sel';
      if (p.n === mate) cls += ' mate';
      if (state.layer === 'prj' && o.status === 'dnc') cls += ' dnc';
      if (state.layer === 'prj' && o.status === 'opt') cls += ' opt';
      g.setAttribute('class', cls);
      g.querySelector('rect').setAttribute('fill', LIB.colorOf(p, o, state.layer, PROJECT));
      var label = p.n + ' · ' + p.sig + (state.layer === 'prj' && o.net ? ' · ' + o.net : '');
      g.querySelector('title').textContent = label;
      g.setAttribute('aria-label', 'Пин ' + label);
      var r = rows[p.n];
      if (r) {
        r.hidden = !v;
        r.classList.toggle('sel', p.n === state.sel);
        r.querySelector('.sw').style.background = LIB.colorOf(p, o, state.layer, PROJECT);
      }
    });
    var cnt = $('#cnt'); if (cnt) cnt.textContent = 'Показано ' + shown + ' из 200';
    leg.querySelectorAll('.lg').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === state.filter)); });
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.layer === state.layer)); });
    renderPanel();
  }
  function select(n) { state.sel = n == null ? null : +n; apply(); }
  function setLayer(layer) { state.layer = layer; state.filter = null; buildLegend(); apply(); }
  function setFilter(key) { state.filter = key; apply(); }
  function setQuery(q) { state.q = q; if (qInput.value !== q) qInput.value = q; apply(); }

  /* ---------- события ---------- */
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { setLayer(b.dataset.layer); });
  });
  qInput.addEventListener('input', function () { setQuery(qInput.value); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { state.sel = null; state.filter = null; state.q = ''; qInput.value = ''; apply(); return; }
    if (e.target === qInput || state.sel == null) return;
    var n = state.sel, lo = n <= 100 ? 1 : 101, hi = lo + 99, next = null;
    if (e.key === 'ArrowLeft') next = n + 2;
    else if (e.key === 'ArrowRight') next = n - 2;
    else if (e.key === 'ArrowDown' && n % 2 === 1) next = n + 1;
    else if (e.key === 'ArrowUp' && n % 2 === 0) next = n - 1;
    if (next != null && next >= lo && next <= hi) { e.preventDefault(); select(next); }
  });

  window.PINOUT = {select: select, setLayer: setLayer, setFilter: setFilter, setQuery: setQuery, state: state,
                   registerRow: function (n, tr) { rows[n] = tr; }, apply: apply, ov: ov, byN: byN};
  $('#sub').textContent = (PROJECT.meta.cm4 || '') + (PROJECT.meta.date ? ' · ред. ' + PROJECT.meta.rev + ' от ' + PROJECT.meta.date : '');
  buildBoard();
  buildLegend();
  apply();
})();
/*UI-END*/
</script>
</body>
</html>
