var RATIONALE = {"overview":["У BCM2711 пять PL011 UART (0, 2, 3, 4, 5) — ровно под консоль, GPS, два CRSF и шину сервоприводов; mini-UART не используется: его скорость зависит от изменяемой системной тактовой частоты. [project]","UART3/UART4 остаются за CRSF: RTS3/RTS4 не нужны — CRSF_Mod переключает направление сам (RC-цепь по TX, входа DIR у блока нет), поэтому GPIO7 и GPIO11 ушли в резерв. [Review/crsf-one-wire.md п. 6]","Ключи Retr_PWR (PW_VRX, PW2, PW3, PW_RZ1, PW_RZ2, PW7) ведёт не GPIO, а расширитель TCA9534A на I2C1 через BSS138, выходы P6/P7 — под будущие ключи TX: все линии независимы, при выключенном CM4 расширитель обесточен и все шины выключены. [Review/power-board.md разд. 7.2]","Бюджет GPIO — 24 из 28, резерв GPIO7, 11, 17, 19: направление CRSF переключает сам CRSF_Mod, а ключи питания ведёт расширитель на I2C1. [Review/website.md разд. 2]","Шины I2C разделены: I2C0 (выводы 82/80) — камера, ADV7280A-M и ADS1115 платы VRX, как собрано (плата VRX заказана и не меняется); I2C1 (58/56) — расширитель TCA9534A, INA219 U25 и датчики. [Review/vrx-board.md п. 9]","CSI — как на носителе: ADV7280A-M на CSI0 (D0 и тактовая пара, выводы 128/130 и 140/142), камера FPC1 на CSI1 с 4 линиями (lane); ТЗ порт не фиксирует, а четырёхлинейный порт полезнее камере. [Review/analog-to-csi.md п. 1]","Сервис по ТЗ (прошивка, восстановление, аппаратный сброс, перезапуск по Ethernet без Linux): UART0 — единственный UART, в который пишет загрузчик; nRPIBOOT плюс прямой USB-путь к ПК — прошивка eMMC; RUN_PG — сброс; GLOBAL_EN — полный цикл питания. [project]"],"devices":{"CONSOLE":["ТЗ требует выводы и интерфейсы для прошивки, восстановления и аппаратного сброса CM4; сервисная консоль — один из них. [ТЗ]","UART0 (GPIO14/15) — единственный UART, в который пишет загрузчик. CRSF на UART0 потребовал бы отключить console=serial0 и получал бы вывод загрузчика, поэтому UART0 отдан консоли. [project]"],"GPS":["GPS BK-450 (GPS + компас): NMEA/UBX по UART, компас — на общей I2C1. [ТЗ]","UART2 (GPIO0/1): по DS §2.10 прошивка при загрузке ищет EEPROM HAT на ID_SD/ID_SC — несколько импульсов безвредны для GPS, но нежелательны для модуля CRSF, поэтому здесь GPS. [project]","Резерв: UART2 освобождается, если GPS переедет в LTE-модем по USB. [project]"],"CRSF1":["Два независимых CRSF TX-модуля (TBS Crossfire, ExpressLRS): два аппаратных UART и четыре GPIO на однопроводный полудуплекс с переключением направления и инверсией; модули ставятся прямо на baseboard. [ТЗ]","UART3 ведёт блок CBB1 (CRSF_Mod): направление полудуплекса блок переключает сам по TX, входа DIR нет — из четырёх GPIO по ТЗ остаются два INV, RTS3 (GPIO7) не нужен. [Review/crsf-one-wire.md п. 6]","Ключ питания TX1 — выход P6 расширителя TCA9534A; самого ключа и источника +V_TX1 пока нет ни на носителе, ни на Retr_PWR. [Review/power-board.md п. 6]"],"CRSF2":["Второй CRSF TX (ExpressLRS) — независимый модуль с собственным UART, переключением направления, инверсией и ключом питания. [ТЗ]","UART4 ведёт блок CBB2 (CRSF_Mod) с тем же автоматическим направлением, поэтому RTS4 (GPIO11) не нужен; инверсия — GPIO16 на вход INV блока. [Review/crsf-one-wire.md п. 6]","Ключ питания TX2 — выход P7 расширителя TCA9534A; ключа и источника +V_TX2 пока нет, напряжение (батарея или 12 В) не решено. [Review/power-board.md п. 6]"],"SERVO":["По ТЗ — два 12-вольтовых сервопривода ST3025 на одной UART-шине 1 Мбит/с, без внешнего адаптера Waveshare Bus Servo Adapter (A). [ТЗ]","UART5 (GPIO12/13) — последний свободный PL011; шину SRV_1/2 ведёт один блок CBB3 (CRSF_Mod) с автоматическим направлением, CBB4 — резерв: два блока на одной шине дали бы два выхода на UART5_RXD. [Review/crsf-one-wire.md п. 12]","Уставка преобразователей серво на Retr_PWR — ≈ 27.95 В (делитель MC34063 47K/2K2), а не 12 В по ТЗ: до исправления делителя ключи PW2/PW3 не включать. [Review/power-board.md п. 5]"],"I2C":["ТЗ требует опрашивать одновременно АЦП RSSI (ADS1115), монитор батареи (Matek INA-BM/INA228, 0x45/0x44/0x41), RM3100, BMP390 и компас BK-450. [ТЗ]","I2C1 (GPIO2/3, выводы 58/56) на носителе пустая: сюда расширитель TCA9534A, INA219 U25 (перенести с I2C0) и датчики RM3100, BMP390, компас BK-450; подтяжки к питанию (pull-up) 1.8 кОм уже стоят на CM4. [Review/power-board.md п. 9]","TCA9534A/PCA9534A (с «A», адрес 0x38–0x3F) не пересекается с RM3100 (0x20–0x23); PCA9554/TCA9554 не брать — внутренние подтяжки 100 кОм включат шины при подаче питания. [Review/power-board.md разд. 7.2]"],"VRX":["Сменный модуль приёмников одного диапазона: SPI с общими DATA/CLK и индивидуальными CS (LE); RSSI каждого приёмника — на АЦП. [ТЗ]","SPI6 (ALT3: GPIO20 = SPI6_MOSI, GPIO21 = SPI6_SCLK) и четыре LE на GPIO22–25 — так разведён разъём VRX_1 носителя; приёмники только на запись, MISO не нужен. [Review/vrx-board.md п. 1]","Коммутатор CVBS 4→1 (RS2255) стоит на модуле VRX, а не на носителе: CVBS_SEL0/1 (GPIO6/10) → CH_A/CH_B; он нужен ради выхода V_OUT на K7, ADV7280A-M получает все 4 канала мимо него. [Review/vrx-board.md п. 10]"],"FAN":["Вентилятор: ШИМ для регулировки скорости и один GPIO для данных о вращении. [ТЗ]","FAN_PWM на GPIO18 = аппаратный PWM0_0 (ALT5), потому что GPIO12/13 (PWM0 в ALT0) заняты UART5. Тахометр — GPIO26: подходит любой GPIO. [project]"],"PCIE":["M.2 M-key NVMe 2280 по PCIe — основной локальный накопитель. [ТЗ]"],"CAM":["Второй CSI CM4 выведен на FFC-разъём для обычной CSI-камеры. [ТЗ]","Камера FPC1 — на CSI1 с 4 линиями (lane), как разведено на носителе: камере подходит штатная пара «CSI1 + I2C0 на выводах 82/80», overlay без правок (не проверено). [Review/analog-to-csi.md п. 2]","Камера питается от PWR_3V (FPC1.1), которая включается вместе с PW_VRX: Linux включает PW_VRX при загрузке через gpio-hog на TCA9534A, до probe камеры. [Review/power-board.md п. 4]"],"I2C0":["I2C0 (GPIO44/45, выводы 82/80) по даташиту обычно отдана CSI1 — штатная пара для камеры FPC1 на CSI1; GPIO на неё не расходуются. [DS §2.9]","Ведомые I2C0 — камера FPC1, ADV7280A-M (0x21) и ADS1115 платы VRX: плата VRX заказана и не меняется, поэтому ADS1115 остаётся здесь, как собрано (VRX_1.14/16 → SDA0/SCL0). [Review/vrx-board.md п. 9]","Подтяжки 4K7 к 5 В на платах VRX вместе с 1.8 кОм CM4 дают на линиях ≈ 3.77 В (расчёт) при пределе 3.8 В — риск, уровень проверить на стенде. [Review/vrx-board.md п. 3]"],"VDEC":["Перспектива по ТЗ — analog→MIPI на CSI. [ТЗ]","ADV7280A-M (U1 носителя, схема sdtv2csi) — на CSI0, как разведено на носителе: D0 на выводах 128/130, тактовая пара на 140/142; однолинейному декодеру D1 не нужна. [Review/analog-to-csi.md п. 1]","Штатный overlay adv728x-m нацелен на CSI1: для декодера на CSI0 с I2C на выводах 82/80 нужен свой вариант overlay (не проверено). [Review/analog-to-csi.md п. 2]"],"USB":["Два внешних USB-порта по ТЗ. [ТЗ]","У CM4 один порт USB 2.0, поэтому хаб: 2 внешних порта, LTE-модем, резерв; плюс прямой путь к ПК в режиме устройства — для rpiboot. [project]"],"ETH":["Ethernet-коммутатор объединяет CM4, K7, IP-камеру, внешний ПК и конвертер оптики. [ТЗ]","На носителе Ethernet — две пары (TD0±/TD1±) через TVS1 и трансформатор LT1* на разъём ETH1, то есть 100 Мбит; коммутатора на плате нет — где коммутатор из ТЗ, не решено. [Review/website.md п. 12]","Пары 2/3 (выводы 3/5, 9/11) нужны только для 1 Гбит: на носителе это метки на CN1 без цепей, поэтому они необязательны. [Review/website.md п. 12]"],"CTRL":["Выводы и интерфейсы для прошивки, восстановления и аппаратного сброса CM4; удалённый полный перезапуск по Ethernet независимо от CM4 и Linux. [ТЗ]","GLOBAL_EN ← схема Ethernet-reboot (полный цикл питания без Linux); RUN_PG ← кнопка сброса; nRPIBOOT ← перемычка для прошивки eMMC. [project]","Перемычки WL_nDisable/BT_nDisable: возможность отключить Wi-Fi/Bluetooth 2.4 ГГц, когда рядом работает модуль ELRS 2.4 ГГц. [project]"],"POWER":["Питание устройства — батарея 4S–6S. [ТЗ]","+5V CM4 (цепь +5V_CM, выводы 77–87) даёт U4 TPS5430 платы Retr_PWR через X_U8.2/4; эта шина включена всегда, ключи PW* её не коммутируют. [Review/power-board.md разд. 7.1]","GPIO_VREF → +3V (CM4_3.3V): по DS §2.5 и §3.3 опора GPIO берётся только с шины CM4. Кроме GPIO_VREF, +3V по плану питает лишь TCA9534A и аноды светодиодов (бюджет 600 мА); мощные нагрузки 3.3 В — от своего стабилизатора. [project]"],"SPARE":["Резерв — GPIO7, GPIO11, GPIO17, GPIO19 (выводы 37, 38, 50, 26): направление CRSF переключает сам CRSF_Mod, а ключи Retr_PWR и TX ведёт расширитель TCA9534A на I2C1. [Review/website.md разд. 2]","При загрузке GPIO7 с подтяжкой к питанию (pull-up), GPIO11/17/19 — к земле (pull-down): под выход, выключенный до старта ПО, GPIO7 потребует внешней подтяжки к земле ≤ 4.7 кОм. [Review/power-board.md разд. 7.2]"]},"pins":{"36":["ID_SD (GPIO0): по DS §2.10 без HAT и без обслуживания CSI0 прошивкой вывод свободен под GPIO; декодер на CSI0 и камеру на CSI1 ведёт ARM по I2C0 (выводы 82/80). [project]","GPIO0 = TXD2 (ALT4): UART2 отдан GPS. [BCM2711 §5.3]"],"35":["ID_SC (GPIO1) — пара к выводу 36: в ALT4 это RXD2. [BCM2711 §5.3]"],"37":["GPIO7 = RTS3 (ALT4): RTS3 не нужен — CRSF_Mod переключает направление сам, поэтому вывод в резерве. [Review/crsf-one-wire.md п. 6]","GPIO7 = SPI0_CE1_N (ALT0): если резервный вывод займут, SPI0 не включайте. [BCM2711 §5.3]"],"38":["GPIO11 = RTS4 (ALT4): RTS4 не нужен — направление CRSF TX2 блок CRSF_Mod тоже переключает сам, поэтому вывод в резерве. [Review/crsf-one-wire.md п. 6]","GPIO11 = SPI0_SCLK (ALT0): SPI0 не используется — приёмники на SPI6, как разведён разъём VRX_1. [project]"],"30":["GPIO6 = CTS3 (ALT4): однопроводному CRSF вход CTS не нужен, поэтому вывод отдан под CVBS_SEL0. [project]","CVBS_SEL0 → CH_A коммутатора RS2255 на модуле VRX (VRX_1.18); коммутатор нужен только для выхода V_OUT на K7, поэтому GPIO6 не освободится, пока нужен этот выход. [Review/website.md п. 10]"],"44":["GPIO10 = CTS4 (ALT4): однопроводному CRSF вход CTS не нужен, поэтому вывод отдан под CVBS_SEL1. [project]","CVBS_SEL1 → CH_B коммутатора RS2255 на модуле VRX (VRX_1.20); убрать коммутатор — значит переделать все платы VRX. [Review/website.md п. 10]"],"50":["GPIO17 в резерве: ключ TX1 ведёт выход P6 расширителя TCA9534A, отдельный GPIO не нужен. [Review/power-board.md разд. 7.2]","GPIO17 = RTS0 (ALT3): UART0 работает консолью без управления потоком, RTS0 не нужен. [BCM2711 §5.3]"],"26":["GPIO19 в резерве: ключ TX2 ведёт выход P7 расширителя TCA9534A, отдельный GPIO не нужен. [Review/power-board.md разд. 7.2]","GPIO19: его ALT-функции SPI6_MISO (ALT3) и PWM0_1 (ALT5) не нужны — приёмники только на запись, ШИМ вентилятора на GPIO18. [BCM2711 §5.3]"],"49":["GPIO18 — один из двух выводов PWM0 вне UART5 (ALT5: GPIO18 = PWM0_0, GPIO19 = PWM0_1); GPIO19 в резерве, второй канал ШИМ остаётся доступен. [BCM2711 §5.3]"],"24":["GPIO26: ни одна из его ALT-функций (SD, DPI, JTAG, SPI5_CE1_N) на плате не нужна — отдан тахометру, которому подходит любой GPIO. [BCM2711 §5.3]"],"27":["GPIO20 = SPI6_MOSI (ALT3) → VRX_DATA (VRX_1.2). Из SPI6 нужны только MOSI и SCLK: приёмники не отвечают, LE — обычные GPIO; GPIO18 (SPI6_CE0_N) отдан под FAN_PWM, GPIO19 (SPI6_MISO) в резерве. [BCM2711 §5.3]"],"25":["GPIO21 = SPI6_SCLK (ALT3) → VRX_CLK (VRX_1.4), пара к выводу 27. [project]"],"46":["GPIO22–25 — четыре смежных GPIO без нужных плате ALT-функций (SD, DPI, JTAG, I2C6, CE SPI3/SPI4), все с подтяжкой к земле (pull-down) при загрузке: до старта ПО приёмники остаются в состоянии по включению. [BCM2711 §5.3]"],"29":["GPIO16 → вход INV блока CBB2 (XOR U14/U15 на CRSF_Mod); при загрузке подтяжка к земле (pull-down): до старта ПО INV = 0, сигнал прямой — если на блоке стоит только ~R4. [Review/crsf-one-wire.md п. 9]"],"48":["GPIO27 → вход INV блока CBB1 (XOR U14/U15 на CRSF_Mod); при загрузке подтяжка к земле (pull-down): до старта ПО INV = 0, сигнал прямой — если на блоке стоит только ~R4. [Review/crsf-one-wire.md п. 9]"],"78":["GPIO_VREF соединён с +3V (CM4_3.3V, выводы 84/86) — GPIO работают на 3.3 В; вариант 1.8 В на этой плате не нужен. [project]"],"80":["SCL0: по даташиту I2C0 обычно отдана CSI1 — штатная пара для камеры FPC1; libcamera работает на ARM, поэтому шину делят ещё ADV7280A-M и ADS1115 платы VRX, GPIO не расходуются. [DS §2.9]"],"82":["SDA0: пара к выводу 80; ведомые — камера FPC1, ADV7280A-M (0x21) и ADS1115 платы VRX, который остаётся на I2C0, потому что плата VRX не меняется. [Review/vrx-board.md п. 9]"],"55":["GPIO14 = TXD0 (ALT0): TXD0/RXD0 есть только на GPIO14/15; их ALT5 (TXD1/RXD1, mini-UART) не используется. [BCM2711 §5.3]"],"51":["GPIO15 = RXD0 (ALT0); одновременно это RTS5 (ALT4), поэтому у UART5 нет RTS — направление шины сервоприводов задаёт блок CRSF_Mod автоматически по TX. [project]"],"115":["CSI1 D0− — первая из четырёх линий (lane) камеры FPC1 (FPC1.21), пара к выводу 117; камера на CSI1, как разведено на носителе. [Review/analog-to-csi.md п. 1]"],"127":["CSI1 тактовый сигнал −: тактовая пара камеры FPC1 (FPC1.15), пара к выводу 129. [project]"],"121":["CSI1 D1 занята камерой: четырёхлинейный CSI1 отдан FPC1, а однолинейному ADV7280A-M хватает D0 на CSI0. [Review/analog-to-csi.md п. 1]"],"128":["CSI0 D0−: единственная линия данных (lane) ADV7280A-M (U1.10 через R5), пара к выводу 130 — так разведена схема носителя. [Review/analog-to-csi.md п. 1]"],"140":["CSI0 тактовый сигнал −: тактовая пара ADV7280A-M (U1.12 через R13), нужна и при одной линии данных (lane). [Review/analog-to-csi.md п. 1]"],"99":["GLOBAL_EN выбран для перезапуска по Ethernet: низкий уровень даёт полный цикл питания CM4 без участия Linux (RUN_PG лишь сбрасывает CPU, питание не снимает) — требование ТЗ о независимом перезапуске. [project]"],"92":["RUN_PG — кнопка аппаратного сброса CPU: требование ТЗ об аппаратном reset. [project]"],"93":["nRPIBOOT — перемычка: принудительная загрузка по USB для прошивки eMMC и восстановления, в паре с прямым USB-путём к ПК. [project]"],"58":["GPIO2 = SDA1 (ALT0): I2C1 на носителе пустая — сюда расширитель TCA9534A, INA219 U25 (перенести с I2C0) и датчики; I2C0 (82/80) остаётся камере, декодеру и ADS1115 платы VRX. [Review/power-board.md п. 9]"],"56":["GPIO3 = SCL1 (ALT0), пара к выводу 58; его ALT4 (RTS2) не нужен — GPS на UART2 работает без управления потоком. [BCM2711 §5.3]"]}};

    return {net: e.net || '', dev: dev, devName: d ? d.name : '', mode: e.mode || '',
            status: e.status || (explicit ? 'used' : 'free'), note: e.note || '',
            dir: e.dir || '', issues: e.issues || []};
  }
  function dirOf(pin, ov, layer) {
    if (layer === 'ds') return pin.dir;
    if (ov.status === 'nc' || ov.status === 'dnc' || ov.status === 'free') return 'nc';
    if (!ov.net) return 'spare';
    return ov.dir || pin.dir;
  }
  function checkOf(pin, ov, sch) {
    var s = sch.pins[String(pin.n)] || {};
    function v(code, text) { return {code: code, text: text}; }
    if (pin.grp === 'GND' && s.net !== 'GND') return v('gnd_open', '✗ GND не на земле' + (s.net ? ' (в схеме: ' + s.net + ')' : ' (без цепи)'));
    if (ov.net && s.net === ov.net && s.wired !== false) return v('ok', '✓ совпадает со схемой');
    if (ov.net && s.net === ov.net && s.wired === false) return v('dead_end', '≈ метка на CN есть, дальше обрыв');
    if (ov.net && s.net && s.net !== ov.net) return v('renamed', '≈ в схеме: ' + s.net + (s.wired === false ? ' · обрыв' : ''));
    if (ov.net && !s.net) return v('missing', '✗ в схеме нет');
    if (!ov.net && s.net) return v('extra', '≈ в схеме метка ' + s.net + ', на сайте не используется');
    return v('none', '— не используется');
  }
  function hasIssue(pin, ov, check) {
    return check.code === 'gnd_open' || check.code === 'missing' || ov.issues.length > 0;
  }
  function colorOf(pin, ov, layer, prj) {
    if (layer === 'ds') return GROUPS[pin.grp] ? GROUPS[pin.grp].c : '#8C8C8C';
    if (ov.status === 'dnc') return '#B22222';
    if (ov.status === 'nc' || ov.status === 'free') return '#9A9A9A';
    var d = prj.devices[ov.dev]; return d ? d.c : '#9A9A9A';
  }
  function chipKey(pin, ov, layer) {
    if (layer === 'ds') return pin.grp;
    return (ov.status === 'nc' || ov.status === 'dnc' || ov.status === 'free') ? 'NC' : ov.dev;
  }
  function routingFor(pin, rt) {
    return (rt.groups[pin.grp] || []).concat(rt.pins[String(pin.n)] || []);
  }
  function csvEsc(v) { v = String(v == null ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function csv(pins, prj, sch) {
    var lines = ['pin;connector;row;signal;group;direction;net;device;mode;status;schematic_net;check;issues;pair;note;datasheet'];
    pins.forEach(function (p) {
      var o = merge(p, prj), s = sch.pins[String(p.n)] || {};
      lines.push([p.n, connOf(p), p.row, p.sig, p.grp, dirOf(p, o, 'prj'), o.net, o.dev, o.mode, o.status,
                  s.net, checkOf(p, o, sch).code, o.issues.join(' | '), p.pair ? p.pair.partner : '', o.note, p.ds].map(csvEsc).join(';'));
    });
    return lines.join('\n');
  }
  return {GROUPS: GROUPS, DIRS: DIRS, STATUS: STATUS, CONN: CONN, PITCH: PITCH, PAD: PAD, MM: MM, ARROW: ARROW,
          connOf: connOf, padXY: padXY, sideOf: sideOf, rot: rot, mm: mm, merge: merge, dirOf: dirOf,
          checkOf: checkOf, hasIssue: hasIssue, colorOf: colorOf, chipKey: chipKey, routingFor: routingFor,
          csvEsc: csvEsc, csv: csv};
})();
/*LIB-END*/
</script>
<script>
/*UI-START*/
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var pins = DATA.pins, ALT = DATA.alt, byN = {};
  pins.forEach(function (p) { byN[p.n] = p; });
  var state = {layer: 'ds', filter: null, sel: null, onlyIssues: false};
  var $ = function (s) { return document.querySelector(s); };
  var board = $('#board'), leg = $('#leg'), panel = $('#panel'), routing = $('#routing');
  var design = $('#design');
  var pads = {}, rows = {};

  function svg(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);

    return e;
  }
  function h(tag, cls, text) {
    var e = document.createElement(tag);

    return e;
  }
  function ov(p) { return LIB.merge(p, PROJECT); }
  function sch(p) { return SCHEMATIC.pins[String(p.n)] || {}; }
  function dirName(p, o, layer) { var d = LIB.dirOf(p, o, layer); return LIB.DIRS[d] || d; }

  function nPins(n) { var d = n % 10, m = n % 100; return n + ' ' + (m >= 11 && m <= 14 ? 'пинов' : d === 1 ? 'пин' : d >= 2 && d <= 4 ? 'пина' : 'пинов'); }
  function chipName(key) {
    if (state.layer === 'ds') return LIB.GROUPS[key] ? LIB.GROUPS[key].n : key;
    return PROJECT.devices[key] ? PROJECT.devices[key].name : key;
  }
  function chipColor(key) {
    if (state.layer === 'ds') return LIB.GROUPS[key] ? LIB.GROUPS[key].c : '#8C8C8C';
    return PROJECT.devices[key] ? PROJECT.devices[key].c : '#9A9A9A';
  }
  var issueMemo = {};   // pin number → has schematic/design issue (ov and SCHEMATIC are static)
  function hasIssue(p) {
    if (!(p.n in issueMemo)) { var o = ov(p); issueMemo[p.n] = LIB.hasIssue(p, o, LIB.checkOf(p, o, SCHEMATIC)); }
    return issueMemo[p.n];
  }
  function visible(p) {
    if (state.filter && LIB.chipKey(p, ov(p), state.layer) !== state.filter) return false;
    return !state.onlyIssues || hasIssue(p);
  }

  /* ---------- board ---------- */
  function r3(v) { return Math.round(v * 1000) / 1000; }
  function at(x, y) { var p = LIB.mm(x, y); return {x: r3(p.x), y: r3(p.y)}; }   // rotated-frame mm → viewBox
  function buildBoard() {
    var defs = svg('defs', {}), pat = svg('pattern', {id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)'});
    pat.appendChild(svg('line', {x1: 0, y1: 0, x2: 0, y2: 6, stroke: '#8A8A8A', 'stroke-width': 1.2}));
    defs.appendChild(pat); board.appendChild(defs);

    var s = LIB.MM, o = at(0, 0);
    // CM4 rotated 90° CCW: 40 × 55 mm, corner radius 2 mm, CN1 on the left, CN2 on the right
    board.appendChild(svg('rect', {id: 'outline', x: o.x, y: o.y, width: r3(40 * s), height: r3(55 * s), rx: r3(2 * s)}));
    [[3.5, 3.5], [51.5, 3.5], [3.5, 36.5], [51.5, 36.5]].forEach(function (c) {
      var q = LIB.rot(c[0], c[1]), p = at(q.x, q.y);
      board.appendChild(svg('circle', {class: 'hole', cx: p.x, cy: p.y, r: r3(1.25 * s)}));
    });
    // connector bodies 3 × 22 mm (vertical), pin-1 dot at the top end, inset 1.2 mm
    [['CN1', LIB.rot(25, 3), 1], ['CN2', LIB.rot(25, 37), -1]].forEach(function (c) {
      var ctr = c[1], tl = at(ctr.x - 1.5, ctr.y - 11), d = at(ctr.x, 55 - 34.8);
      board.appendChild(svg('rect', {class: 'conn', 'data-conn': c[0], x: tl.x, y: tl.y, width: r3(3 * s), height: r3(22 * s), rx: 2}));
      board.appendChild(svg('circle', {class: 'pin1', cx: d.x, cy: d.y, r: 2.2}));
      var t = at(ctr.x + c[2] * 2.2, ctr.y);   // beside the body, towards the SoC
      board.appendChild(svg('text', {class: 'lbl s', x: t.x, y: r3(t.y + 3), 'text-anchor': c[2] > 0 ? 'start' : 'end'}, c[0]));
    });
    // BCM2711 15 × 15 mm centred at rot(31.9875, 23.025)
    var sc = LIB.rot(31.9875, 23.025), soc = at(sc.x - 7.5, sc.y - 7.5), socC = at(sc.x, sc.y);
    board.appendChild(svg('rect', {class: 'soc', x: soc.x, y: soc.y, width: r3(15 * s), height: r3(15 * s), rx: 4}));
    board.appendChild(svg('text', {class: 'lbl b', x: socC.x, y: r3(socC.y + 4), 'text-anchor': 'middle'}, 'BCM2711'));
    // antenna keep-out x′ 10.5…21.5, y′ 48.5…55 mm (bottom edge), U.FL at rot(2.567, 9)
    var a = at(10.5, 48.5);
    board.appendChild(svg('rect', {class: 'ant', x: a.x, y: a.y, width: r3(11 * s), height: r3(6.5 * s)}));
    var uq = LIB.rot(2.567, 9), u = at(uq.x, uq.y);
    board.appendChild(svg('circle', {class: 'ufl', cx: u.x, cy: u.y, r: r3(1.2 * s)}));
    ['Зона без меди 6.5 × 11 мм — внизу слева:', 'под этой областью ни на одном слое', 'baseboard нет меди; U.FL рядом с ней.'].forEach(function (t, i) {
      board.appendChild(svg('text', {class: 'lbl s', x: a.x, y: 760 + 12 * i}, t));
    });
    // connector headers, row markers and caption
    [[162, 30, 'CN1 (J1) · выводы 1–100 · нечётные — внешний ряд', true],
     [878, 30, 'CN2 (J2) · выводы 101–200 · нечётные — внутренний ряд', true],
     [162, 50, '1 / 2'], [878, 50, '101 / 102'], [162, 975, '99 / 100'], [878, 975, '199 / 200'],
     [530, 992, 'CM4, вид сверху, в масштабе, повёрнут на 90° против часовой стрелки: CN1 (J1 даташита) слева, CN2 (J2) справа, выводы 1 и 101 — вверху. Разъёмы на нижней стороне модуля.']
    ].forEach(function (l) {
      board.appendChild(svg('text', {class: 'lbl' + (l[3] ? ' b' : ''), x: l[0], y: l[1], 'text-anchor': 'middle'}, l[2]));
    });
    // pads: number inside, net label on the side given by LIB.sideOf; arrows and badges come from apply()
    pins.forEach(function (p) {
      var xy = LIB.padXY(p.n), left = LIB.sideOf(p.n) === 'L';
      var g = svg('g', {class: 'pad', 'data-n': p.n});
      g.appendChild(svg('title', {}));
      g.appendChild(svg('rect', {x: xy.x, y: xy.y, width: LIB.PAD, height: LIB.PAD, rx: 3}));
      g.appendChild(svg('text', {class: 'num', x: xy.x + LIB.PAD / 2, y: xy.y + LIB.PAD / 2 + 2.5}, String(p.n)));
      g.appendChild(svg('text', {class: 'netlbl', x: left ? xy.x - 28 : xy.x + 44, y: xy.y + 12, 'text-anchor': left ? 'end' : 'start'}));
      g.addEventListener('click', function () { select(p.n); });
      board.appendChild(g);
      pads[p.n] = g;
    });
  }

  /* ---------- legend ---------- */
  function buildLegend() {
    leg.replaceChildren();
    var src = state.layer === 'ds' ? LIB.GROUPS : PROJECT.devices;
    Object.keys(src).forEach(function (key) {
      var b = h('button', 'lg'); b.type = 'button'; b.dataset.k = key; b.setAttribute('aria-pressed', 'false');
      var d = h('span', 'd'); d.style.background = chipColor(key); d.setAttribute('aria-hidden', 'true');
      b.appendChild(d); b.appendChild(document.createTextNode(chipName(key)));
      b.addEventListener('click', function () { setFilter(state.filter === key ? null : key); });
      leg.appendChild(b);
    });
    var oi = h('button', 'lg', 'Только с замечаниями'); oi.type = 'button'; oi.id = 'only-issues'; oi.setAttribute('aria-pressed', 'false');
    oi.addEventListener('click', function () { setOnlyIssues(!state.onlyIssues); });
    leg.appendChild(oi);   // hidden in the Datasheet layer by CSS
  }

  /* ---------- general layout notes ---------- */
  function buildGeneral() {
    var cols = $('#general-cols');
    (ROUTING.general || []).forEach(function (sec) {
      var d = h('div'); d.appendChild(h('h3', null, sec.title));
      var ul = h('ul'); (sec.items || []).forEach(function (t) { ul.appendChild(noteLi(t)); }); d.appendChild(ul);
      cols.appendChild(d);
    });
  }
  function noteLi(text) {
    var li = h('li'), m = /^(.*?)\s*(\[[^\]]+\])\s*$/.exec(text);
    if (m) { li.appendChild(document.createTextNode(m[1] + ' ')); li.appendChild(h('span', 'src', m[2])); }
    else li.textContent = text;
    return li;
  }

  /* ---------- table ---------- */
  function buildTable() {
    var thead = $('#tbl thead'), tbody = $('#tbl tbody'), tr = h('tr');
    [['#', ''], ['Conn.', ''], ['Signal', ''], ['Group', 'c-grp'], ['Dir.', 'c-dir'],
     ['Net', 'prj'], ['Device', 'prj'], ['Mode', 'prj c-mode'], ['Status', 'prj'], ['Схема', 'prj'], ['Проверка', 'prj'], ['Note', 'prj'],
     ['Pair', 'c-pair'], ['Datasheet', 'ds']].forEach(function (c) { tr.appendChild(h('th', c[1] || null, c[0])); });
    thead.appendChild(tr);
    pins.forEach(function (p) {
      // the schematic cells depend on the layer only through visibility (.prj), so they are built once
      var o = ov(p), s = sch(p), c = LIB.checkOf(p, o, SCHEMATIC), r = h('tr', 'row'); r.dataset.n = p.n;
      var num = h('td', 'mono'); num.appendChild(h('span', 'sw')); num.appendChild(document.createTextNode(String(p.n))); r.appendChild(num);
      r.appendChild(h('td', null, LIB.connOf(p)));
      r.appendChild(h('td', 'mono', p.sig));
      r.appendChild(h('td', 'c-grp', LIB.GROUPS[p.grp] ? LIB.GROUPS[p.grp].n : p.grp));
      r.appendChild(h('td', 'c-dir', dirName(p, o, state.layer)));
      r.appendChild(h('td', 'mono prj c-net', o.net));
      r.appendChild(h('td', 'prj c-dev', o.devName || o.dev));
      r.appendChild(h('td', 'mono prj c-mode', o.mode));
      r.appendChild(h('td', 'prj c-status', LIB.STATUS[o.status] || o.status));
      r.appendChild(h('td', 'mono prj c-sch', s.net || '—'));
      var chk = h('td', 'prj c-check c-' + c.code, VSYM[c.code] + (o.issues.length ? ' · ' + o.issues.length : ''));
      chk.title = c.text; r.appendChild(chk);   // symbol only, the full verdict is in the title and the panel
      r.appendChild(h('td', 'txt prj c-note', o.note));
      r.appendChild(h('td', 'mono c-pair', p.pair ? p.pair.partner + ' · ' + p.pair.z + ' Ом' : ''));
      r.appendChild(h('td', 'txt ds', DS_RU[p.ds] || p.ds));
      r.addEventListener('click', function () { select(p.n); });
      tbody.appendChild(r);
      rows[p.n] = r;
    });
  }

  /* ---------- CSV ---------- */
  function bindCsv() {
    var btn = $('#csv'), dlg = $('#csvdlg');
    btn.addEventListener('click', function () {
      var text = LIB.csv(pins, PROJECT, SCHEMATIC);
      function ok() { btn.textContent = 'Copied ✓'; setTimeout(function () { btn.textContent = 'Copy CSV'; }, 1500); }
      function fallback() { dlg.querySelector('textarea').value = text; dlg.showModal(); dlg.querySelector('textarea').select(); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
      else fallback();
    });
  }

  /* ---------- cards ---------- */
  function kv(dl, k, v) {
    dl.appendChild(h('dt', null, k));
    var dd = h('dd');
    if (typeof v === 'string') dd.textContent = v; else dd.appendChild(v);
    dl.appendChild(dd);
  }
  function chip(text, color) { var s = h('span', 'chip', text); s.style.background = color; return s; }
  function code(text) { return h('code', null, text); }
  function pinBtn(n) {
    var b = h('button', 'linkbtn pinbtn', 'pin ' + n); b.type = 'button';
    b.addEventListener('click', function () { select(n); });
    return b;
  }
  function closeBtn(fn) {
    var c = h('button', 'close linkbtn', '✕'); c.type = 'button'; c.setAttribute('aria-label', 'Закрыть');
    c.addEventListener('click', fn); return c;
  }
  function altTable(gpio, mode) {
    var a = ALT[String(gpio)], t = h('table', 'alt'), tr1 = h('tr'), tr2 = h('tr');
    var used = /^ALT(\d)/.exec(mode || '');
    a.alt.forEach(function (name, i) {

    t.appendChild(tr1); t.appendChild(tr2);
    return t;
  }
  function renderNotes(el, items, title, empty) {
    var frag = document.createDocumentFragment();

      frag.appendChild(h('div', 'ph', empty));
    } else {
      var ul = h('ul'); items.forEach(function (t) { ul.appendChild(noteLi(t)); }); frag.appendChild(ul);
    }
    el.replaceChildren(frag);
  }
  function renderRouting(items, title, empty) {
    renderNotes(routing, items, title || 'Routing notes', empty || 'Особых требований к трассировке для этого пина нет — см. Layout notes под схемой.');
  }
  function renderDesign(items, title, empty) {
    renderNotes(design, items, title || 'Design notes', empty || 'Для этого вывода отдельного обоснования нет — см. обоснование устройства.');
  }
  function designEmpty(dev, many) {
    if (dev === 'GND') return 'Земля — обоснование не требуется.';
    if (dev === 'NC') return (many ? 'Выводы не используются' : 'Вывод не используется') + ' — обоснование не требуется.';
    return '';
  }
  function renderPanel() {
    var frag = document.createDocumentFragment();
    if (state.sel == null) {
      if (state.filter) {
        var list = pins.filter(function (p) { return LIB.chipKey(p, ov(p), state.layer) === state.filter; });
        var h2f = h('h2', null, chipName(state.filter) + ' · ' + nPins(list.length));
        h2f.appendChild(closeBtn(function () { setFilter(null); }));
        frag.appendChild(h2f);

        panel.replaceChildren(frag);
        var grpItems = [], seen = {};

        });
        renderRouting(grpItems, 'Routing notes · ' + chipName(state.filter));

      } else {
        frag.appendChild(h('div', 'ph', 'Нажмите на пин.'));
        panel.replaceChildren(frag);

      }

    }
    var p = byN[state.sel], o = ov(p), col = LIB.colorOf(p, o, state.layer, PROJECT);

    var pn = h('span', 'pn', String(p.n)); pn.style.background = col; h2.appendChild(pn);
    h2.appendChild(document.createTextNode(p.sig + ' '));
    h2.appendChild(h('span', 'muted', LIB.connOf(p) + ' (' + p.conn + ' в даташите) · ' + (p.row === 'odd' ? 'нечётный ряд' : 'чётный ряд')));
    h2.appendChild(closeBtn(function () { select(null); }));
    frag.appendChild(h2);
    if (state.layer === 'prj') {
      var dl = h('dl', 'kv'), s = sch(p), c = LIB.checkOf(p, o, SCHEMATIC);
      kv(dl, 'Net', o.net ? code(o.net) : '—');
      kv(dl, 'Device', chip(o.devName || o.dev, col));
      if (o.mode) kv(dl, 'Mode', code(o.mode));
      kv(dl, 'Status', LIB.STATUS[o.status] || o.status);
      kv(dl, 'Direction', dirName(p, o, 'prj'));
      var schV = '—';
      if (s.net) {
        schV = h('span'); schV.appendChild(code(s.net));
        if (s.to && s.to.length) schV.appendChild(document.createTextNode(' → ' + s.to.join(', ')));
      }
      kv(dl, 'Схема', schV);
      kv(dl, 'Проверка', h('span', 'chk-' + c.code, c.text));
      if (o.note) kv(dl, 'Note', o.note);
      frag.appendChild(dl);
    }
    var dl2 = h('dl', 'kv');
    kv(dl2, 'Group', chip(LIB.GROUPS[p.grp].n, LIB.GROUPS[p.grp].c));
    kv(dl2, 'Direction', LIB.DIRS[p.dir] || p.dir);
    if (p.gpio != null) {
      var a = ALT[String(p.gpio)];
      kv(dl2, 'BCM2711', 'GPIO' + p.gpio + (a ? ' · при загрузке pull-' + (a.pull === 'High' ? 'up' : 'down') : ''));
    }
    if (p.pair) {
      var q = byN[p.pair.partner], span = h('span');
      span.appendChild(pinBtn(q.n));
      span.appendChild(document.createTextNode(' ' + q.sig + ' · ' + p.pair.z + ' Ом · разбег длин на CM4 ' + p.pair.skew + ' / ' + q.pair.skew + ' мм'));
      kv(dl2, 'Differential pair', span);
    }
    frag.appendChild(dl2);
    var dq = h('div', 'dsq'), ru = DS_RU[p.ds];
    dq.appendChild(h('b', null, 'Datasheet: ')); dq.appendChild(document.createTextNode(ru || p.ds));
    if (ru) dq.appendChild(h('div', 'dsq-en', p.ds));
    frag.appendChild(dq);
    if (p.gpio != null && ALT[String(p.gpio)]) frag.appendChild(altTable(p.gpio, state.layer === 'prj' ? o.mode : ''));
    if (state.layer === 'prj') {
      frag.appendChild(h('h3', null, 'Замечания'));
      if (o.issues.length) {
        var iu = h('ul', 'issues'); o.issues.forEach(function (t) { iu.appendChild(noteLi(t)); }); frag.appendChild(iu);
      } else frag.appendChild(h('div', 'ph', 'Замечаний нет.'));
    }
    panel.replaceChildren(frag);
    renderRouting(LIB.routingFor(p, ROUTING), 'Routing notes · pin ' + p.n);
    renderDesign((RATIONALE.devices[o.dev] || []).concat(RATIONALE.pins[String(p.n)] || []), 'Design notes · pin ' + p.n, designEmpty(o.dev));
  }

  /* ---------- state ---------- */
  var VERDICT = {ok: 'ok', dead_end: 'approx', renamed: 'approx', extra: 'approx', gnd_open: 'bad', missing: 'bad', none: 'none'};
  function tally() {   // schematic verdicts over all 200 pins, independent of the filter
    var k = {ok: 0, approx: 0, bad: 0, none: 0};
    pins.forEach(function (p) { k[VERDICT[LIB.checkOf(p, ov(p), SCHEMATIC).code]]++; });
    return ' · ✓ ' + k.ok + ' · ≈ ' + k.approx + ' · ✗ ' + k.bad + ' · — ' + k.none;
  }
  function apply() {
    document.body.classList.toggle('layer-ds', state.layer === 'ds');
    document.body.classList.toggle('layer-prj', state.layer === 'prj');
    document.body.classList.toggle('has-sel', state.sel != null || state.filter != null);
    var selP = state.sel != null ? byN[state.sel] : null;
    var mate = selP && selP.pair ? selP.pair.partner : null, shown = 0;
    pins.forEach(function (p) {
      var o = ov(p), v = visible(p);
      if (v) shown++;
      var g = pads[p.n], cls = 'pad', xy = LIB.padXY(p.n);
      if (!v) cls += ' dim';
      if (p.n === state.sel) cls += ' sel';
      if (p.n === mate) cls += ' mate';
      if (state.layer === 'prj' && o.status === 'dnc') cls += ' dnc';
      if (state.layer === 'prj' && o.status === 'opt') cls += ' opt';
      g.querySelector('rect').setAttribute('fill', LIB.colorOf(p, o, state.layer, PROJECT));
      // net label, then the direction glyph and the issue badge: present in the DOM only when they apply
      var t = state.layer === 'prj' ? (o.net || '—') : p.sig, nl = g.querySelector('.netlbl');
      nl.textContent = t;
      nl.setAttribute('class', 'netlbl' + (t === '—' ? ' empty' : '') + (p.grp === 'GND' ? ' gnd' : ''));
      g.querySelectorAll('path.arr, path.badge').forEach(function (e) { e.remove(); });
      var d = LIB.dirOf(p, o, state.layer);
      if (LIB.ARROW[d]) {
        var kind = d === 'power_in' ? 'pwr in' : d === 'power_out' ? 'pwr out' : d;
        g.appendChild(svg('path', {class: 'arr ' + kind, d: LIB.ARROW[d],
          transform: LIB.sideOf(p.n) === 'L' ? 'translate(' + (xy.x - 24) + ', ' + (xy.y + 3) + ')'
                                             : 'translate(' + (xy.x + 40) + ', ' + (xy.y + 3) + ') scale(-1,1)'}));
      }
      if (state.layer === 'prj' && LIB.hasIssue(p, o, LIB.checkOf(p, o, SCHEMATIC))) {
        g.appendChild(svg('path', {class: 'badge', d: 'M' + (xy.x + 10) + ' ' + xy.y + ' h6 v6 Z'}));
        cls += ' warn';
      }
      g.setAttribute('class', cls);
      var label = p.n + ' · ' + LIB.connOf(p) + ' · ' + p.sig + (state.layer === 'prj' && o.net ? ' · ' + o.net : '');
      g.querySelector('title').textContent = label;
      g.setAttribute('aria-label', 'Пин ' + label);
      var r = rows[p.n];
      if (r) {
        r.hidden = !v;
        r.classList.toggle('sel', p.n === state.sel);
        r.querySelector('.sw').style.background = LIB.colorOf(p, o, state.layer, PROJECT);
        r.querySelector('.c-dir').textContent = dirName(p, o, state.layer);
      }
    });
    var cnt = $('#cnt');
    if (cnt) cnt.textContent = 'Показано ' + shown + ' из 200 пинов' + (state.layer === 'prj' ? tally() : '');
    leg.querySelectorAll('.lg[data-k]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === state.filter)); });
    var oi = $('#only-issues'); if (oi) oi.setAttribute('aria-pressed', String(state.onlyIssues));
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.layer === state.layer)); });
    renderPanel();
  }
  function select(n) {
    if (n == null) state.sel = null;
    else if (state.sel === +n) state.sel = null;
    else { state.sel = +n; state.filter = null; }
    apply();
  }
  function setLayer(layer) { state.layer = layer; state.filter = null; state.onlyIssues = false; buildLegend(); apply(); }
  function setOnlyIssues(v) { state.onlyIssues = !!v; apply(); }
  function setFilter(key) { state.filter = key; state.sel = null; apply(); }

  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { setLayer(b.dataset.layer); });
  });

  window.PINOUT = {select: select, setLayer: setLayer, setFilter: setFilter, setOnlyIssues: setOnlyIssues, state: state, apply: apply, ov: ov, byN: byN};
  $('#sub').textContent = PROJECT.meta.cm4 + ' · rev. ' + PROJECT.meta.rev + ', ' + PROJECT.meta.date +
    ' · схема: ' + SCHEMATIC.source.project + ' (снимок ' + SCHEMATIC.source.snapshot.slice(0, 10) + ')';
  buildBoard();
  buildLegend();
  buildGeneral();
  buildTable();
  bindCsv();
  apply();
})();
/*UI-END*/
</script>
</body>
</html>
