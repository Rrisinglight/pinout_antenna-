<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CM4 baseboard — 2×100-pin pinout</title>
<style>
:root{
  --font:system-ui,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --fg:#0d0d0d;--fg2:#525252;--bg:#f5f5f5;--bg2:#ebebeb;--bg3:#d9d9d9;
  --bd:#1a1a1a;--bd2:#737373;--bd3:#a3a3a3;--sel:#0d0d0d;--lead:#000000;
  --r:10px;--focus:0 0 0 2px var(--bg),0 0 0 4px #404040;
}
@media (prefers-color-scheme:dark){:root{
  --fg:#f0f0f0;--fg2:#a3a3a3;--bg:#141414;--bg2:#1f1f1f;--bg3:#2a2a2a;
  --bd:#e5e5e5;--bd2:#737373;--bd3:#404040;--sel:#ffffff;--lead:#ffffff;--focus:0 0 0 2px #141414,0 0 0 4px #a3a3a3;
}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:1rem clamp(16px,3vw,24px) 2rem;font-family:var(--font);color:var(--fg);background:var(--bg);line-height:1.45}
.w{max-width:1360px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{margin:0;font-size:clamp(1.05rem,2.5vw,1.3rem);font-weight:600;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--fg2)}
.seg{display:inline-flex;border:1.5px solid var(--bd3);border-radius:20px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:5px 12px;border:0;background:transparent;color:var(--fg2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:none;box-shadow:var(--focus)}
.legend{display:flex;flex-wrap:wrap;gap:5px 8px;margin-bottom:12px}
.lg{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;color:var(--fg2);background:var(--bg2)}
.lg:hover{border-color:var(--bd2)}.lg:focus-visible{outline:none;box-shadow:var(--focus)}
.lg[aria-pressed="true"]{border-color:var(--bd);background:var(--bg3);color:var(--fg)}
.lg .d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1280px){.main{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.board-wrap{overflow-x:auto;border:1px solid var(--bd3);border-radius:var(--r);background:var(--bg2)}
#board{display:block;min-width:860px;width:100%;height:auto}
.pad{cursor:pointer}
.pad rect{stroke:transparent;stroke-width:2;transition:opacity .12s}
.pad text{font-family:var(--mono);font-size:7px;fill:#fff;text-anchor:middle;pointer-events:none;user-select:none}
.pad.dim rect,.pad.dim text{opacity:.15}
.pad.mate rect{stroke:var(--sel);stroke-width:2;stroke-dasharray:3 2}
.pad:focus-visible{outline:none}.pad:focus-visible rect{stroke:var(--sel);stroke-width:3}
.pad.dnc rect{stroke:#c33}
.pad.opt rect{stroke:var(--fg2);stroke-dasharray:2 2}
.pad.sel rect{stroke:var(--sel);stroke-width:3}
.lbl{font-family:var(--font);font-size:11px;fill:var(--fg2)}.lbl.b{fill:var(--fg);font-weight:600}.lbl.s{font-size:9px}
#outline{fill:var(--bg);stroke:var(--bd2);stroke-width:1.5}
.hole{fill:var(--bg2);stroke:var(--bd2)}
.conn{fill:var(--bg3);stroke:var(--bd2)}
.pin1{fill:var(--fg)}
.soc{fill:var(--bg3);stroke:var(--bd3)}
.ant{fill:url(#hatch);stroke:var(--bd2);stroke-dasharray:4 3}
.ufl{fill:none;stroke:var(--bd2)}
.lead{fill:var(--lead);opacity:.08}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.card{background:var(--bg2);border:1px solid var(--bd3);border-radius:var(--r);padding:12px 14px;font-size:13px}
.card .ph{color:var(--fg2)}
.card h2{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600}
.card ul{padding-left:18px;margin:6px 0}.card li{margin:4px 0}
.card ul.plain{padding-left:0;list-style:none}
.pn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;color:#fff;font-size:12px;font-weight:600}
.muted{color:var(--fg2);font-weight:400;font-size:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin:8px 0}
.kv dt{color:var(--fg2)}.kv dd{margin:0}code{font-family:var(--mono);font-size:12px}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;color:#fff;font-size:11px;font-weight:500}
.dsq{margin:6px 0;padding:8px 10px;border-left:3px solid var(--bd3);background:var(--bg);font-size:12px;color:var(--fg2)}
.dsq b{color:var(--fg)}
.alt{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
.alt th,.alt td{border:1px solid var(--bd3);padding:2px 5px;text-align:left;font-family:var(--mono)}
.alt th{font-family:var(--font);color:var(--fg2);font-weight:500}
.alt td.on{background:var(--bg3);font-weight:700}
.linkbtn{font:inherit;font-size:12px;border:1px solid var(--bd3);background:var(--bg);color:var(--fg);border-radius:6px;padding:1px 7px;cursor:pointer}
.card .close{display:none;margin-left:auto}
.src{color:var(--fg2);font-size:11px}
#general{margin-top:16px;font-size:13px}
#general h2{font-size:15px;margin:0 0 6px}
#general .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 24px}
#general h3{font-size:13px;margin:8px 0 4px}
#general ul{padding-left:18px;margin:4px 0}#general li{margin:3px 0}
.tbl-sec{margin-top:16px}
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px;color:var(--fg2)}
#csv{font:inherit;font-size:12px;padding:4px 10px;border:1.5px solid var(--bd3);border-radius:20px;background:var(--bg2);color:var(--fg);cursor:pointer}
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd3);border-radius:var(--r);max-height:70vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 8px;border-bottom:1px solid var(--bd3);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--bg2);color:var(--fg2);font-weight:500;white-space:nowrap;z-index:1}
td.mono{font-family:var(--mono);white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg2)}tr.row.sel{background:var(--bg3)}
tr.row[hidden]{display:none}
td.txt{min-width:280px;color:var(--fg2)}
body.layer-ds .prj{display:none}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
dialog{border:1px solid var(--bd3);border-radius:var(--r);background:var(--bg);color:var(--fg);max-width:min(90vw,700px)}
dialog textarea{width:100%;height:50vh;font-family:var(--mono);font-size:11px}
@media (max-width:1279px){
  body.has-sel .side{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:50vh;z-index:10;box-shadow:0 -4px 16px rgba(0,0,0,.25);background:var(--bg);padding:8px;gap:8px}
  body.has-sel .card .close{display:inline-block}
}
</style>
</head>
<body class="layer-ds">
<div class="w">
  <header class="top">
    <div>
      <h1>CM4 baseboard — 2×100-pin pinout</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="seg" role="group" aria-label="Layer">
      <button type="button" data-layer="ds" aria-pressed="true">Datasheet</button>
      <button type="button" data-layer="prj" aria-pressed="false">Project</button>
    </div>
  </header>
  <div class="legend" id="leg" role="toolbar" aria-label="Filter"></div>
  <div class="main">
    <div>
      <div class="board-wrap"><svg id="board" viewBox="0 0 1000 560" role="group" aria-label="CM4 connectors, top view"></svg></div>
      <section id="general" aria-label="Layout notes"><h2>Layout notes</h2><div class="cols" id="general-cols"></div></section>
      <section class="tbl-sec" aria-label="Pin table">
        <div class="tbl-head"><span id="cnt"></span><button type="button" id="csv">Copy CSV</button></div>
        <div class="tbl-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
      </section>
    </div>
    <aside class="side">

      <div class="card" id="routing"><h3>Routing notes</h3><div class="ph">Select a pin or a legend entry.</div></div>
    </aside>
  </div>
</div>
<dialog id="csvdlg"><form method="dialog"><p>Clipboard not available — copy the text (Ctrl+A, Ctrl+C):</p><textarea readonly></textarea><p><button>Close</button></p></form></dialog>

et":"GLOBAL_EN","dev":"CTRL","note":"From the Ethernet-reboot circuit (independent of the CM4), open-drain only. Low = CM4 fully off (15 µA), 3.3 V and 1.8 V outputs drop; release = cold start. 100 kΩ internal pull-up to +5V with RC delay."},"100":{"net":"EXT_nRST","dev":"CTRL","status":"opt","note":"Output: low during reset, high (3.3 V) once the CPU has started. Can reset peripherals such as the USB hub."},"101":{"net":"USB_OTG_ID","dev":"USB","note":"Tie to GND for fixed host role (needs the OS driver). rpiboot needs a direct USB path CM4 ↔ PC in device mode: a switch or jumper between the hub upstream and the service port (schematic engineer's choice)."},"103":{"net":"USB_DN","dev":"USB","note":"USB 2.0 D−, 90 Ω pair, intra-pair match 0.15 mm. To the USB 2.0 hub upstream (2 external ports, LTE modem, spare) / rpiboot service port. OS: otg_mode=1."},"105":{"net":"USB_DP","dev":"USB","note":"USB 2.0 D+, 90 Ω pair."},"102":{"net":"PCIE_CLKREQ_N","dev":"PCIE","note":"To M.2 CLKREQ#. Mandatory: without it the CM4 does not output REFCLK. Internal pull-up."},"109":{"net":"PCIE_RST_N","dev":"PCIE","note":"To M.2 PERST#. Mandatory for a clean SSD reset."},"110":{"net":"PCIE_REFCLK_P","dev":"PCIE","note":"To M.2 REFCLK+, 100 MHz, 90 Ω pair, intra-pair match 0.1 mm. AC-coupling capacitor already on the CM4."},"112":{"net":"PCIE_REFCLK_N","dev":"PCIE","note":"To M.2 REFCLK−."},"116":{"net":"PCIE_RX_P","dev":"PCIE","note":"From M.2 PERp0 (SSD transmitter). 90 Ω pair. AC-coupling capacitors are on the SSD side (present on NVMe cards)."},"118":{"net":"PCIE_RX_N","dev":"PCIE","note":"From M.2 PERn0."},"122":{"net":"PCIE_TX_P","dev":"PCIE","note":"To M.2 PETp0. 90 Ω pair. AC-coupling capacitor already on the CM4."},"124":{"net":"PCIE_TX_N","dev":"PCIE","note":"To M.2 PETn0."},"128":{"net":"CSI0_D0_N","dev":"CSI0","note":"To the camera FFC (CSI0, 2 lanes), 100 Ω pair. CM4IO uses a 22-pin 0.5 mm FFC; Raspberry Pi cameras use 15-pin 1.0 mm (adapter cable)."},"130":{"net":"CSI0_D0_P","dev":"CSI0","note":"To the camera FFC, 100 Ω pair."},"134":{"net":"CSI0_D1_N","dev":"CSI0","note":"To the camera FFC, 100 Ω pair."},"136":{"net":"CSI0_D1_P","dev":"CSI0","note":"To the camera FFC, 100 Ω pair."},"140":{"net":"CSI0_CLK_N","dev":"CSI0","note":"To the camera FFC, 100 Ω pair. Software: the stock cam0 overlay variants expect the camera I2C on GPIO0/1; here I2C0 is on pins 82/80, so the overlay must reference i2c_csi_dsi (one-line change)."},"142":{"net":"CSI0_CLK_P","dev":"CSI0","note":"To the camera FFC, 100 Ω pair."},"115":{"net":"CSI1_D0_N","dev":"VDEC","note":"From ADV7280A-M D0N (pin 10), 100 Ω pair. Single-lane CSI-2 link. Overlay: dtoverlay=adv728x-m,adv7280m=1 (targets CSI1 and I2C0 on pins 82/80 by default)."},"117":{"net":"CSI1_D0_P","dev":"VDEC","note":"From ADV7280A-M D0P (pin 9), 100 Ω pair."},"127":{"net":"CSI1_CLK_N","dev":"VDEC","note":"From ADV7280A-M CLKN (pin 12), 100 Ω pair."},"129":{"net":"CSI1_CLK_P","dev":"VDEC","note":"From ADV7280A-M CLKP (pin 11), 100 Ω pair."},"121":{"net":"","dev":"VDEC","status":"nc","note":"CSI1 lane D1 — not used by the single-lane ADV7280A-M. Leave unconnected."},"123":{"net":"","dev":"VDEC","status":"nc","note":"CSI1 lane D1 — not used. Leave unconnected."},"133":{"net":"","dev":"VDEC","status":"nc","note":"CSI1 lane D2 — not used. Leave unconnected."},"135":{"net":"","dev":"VDEC","status":"nc","note":"CSI1 lane D2 — not used. Leave unconnected."},"139":{"net":"","dev":"VDEC","status":"nc","note":"CSI1 lane D3 — not used. Leave unconnected."},"141":{"net":"","dev":"VDEC","status":"nc","note":"CSI1 lane D3 — not used. Leave unconnected."}}};

<script>
/*LIB-START*/
var LIB = (function () {
  var GROUPS = {
    GND:{n:'GND',c:'#333333'}, PWR5:{n:'+5V',c:'#D85A30'}, PWR33:{n:'3.3V',c:'#E8963C'}, PWR18:{n:'1.8V',c:'#C9A227'},
    GPIO:{n:'GPIO',c:'#2E8B57'}, ETH:{n:'Ethernet',c:'#4A6FA5'}, SD:{n:'SD/eMMC',c:'#8B8B3A'}, USB:{n:'USB',c:'#C46A2B'},
    PCIE:{n:'PCIe',c:'#2F7FB8'}, CSI0:{n:'CSI0',c:'#3C9D8A'}, CSI1:{n:'CSI1',c:'#7FB8A8'},
    HDMI0:{n:'HDMI0',c:'#A05A9C'}, HDMI1:{n:'HDMI1',c:'#C489C0'}, DSI0:{n:'DSI0',c:'#6B5FB5'}, DSI1:{n:'DSI1',c:'#9A90D6'},
    I2C0:{n:'I2C0',c:'#5B8AC2'}, CTRL:{n:'Control',c:'#8A4FBF'}, RSV:{n:'Reserved',c:'#B22222'},
    VDAC:{n:'TV-out',c:'#8C8C8C'}, ANALOG:{n:'Analog',c:'#8C8C8C'}
  };
  var DIRS = {gnd:'ground', power_in:'power input', power_out:'power output', in:'input', out:'output', bidir:'bidirectional', nc:'do not connect'};
  var STATUS = {used:'used', opt:'optional / reserved', free:'free', nc:'not used', dnc:'do not connect'};
  var PITCH = 18, PAD = 16, X0 = 60, Y = {J1:{odd:34, even:54}, J2:{odd:484, even:504}};
  var MM = 8.4, OX = 269, OY = 118;   // outline scale (px per mm) and origin of the 55×40 mm board

  function padXY(n) {
    var k = (n - 1) % 100, col = Math.floor(k / 2);
    return {x: X0 + (49 - col) * PITCH, y: Y[n <= 100 ? 'J1' : 'J2'][n % 2 ? 'odd' : 'even']};
  }
  function mm(x, y) { return {x: OX + x * MM, y: OY + y * MM}; }
  function merge(pin, prj) {
    var explicit = prj.pins[String(pin.n)], e = explicit || prj.defaults[pin.grp] || {};
    var dev = e.dev || 'NC', d = prj.devices[dev];
    return {net: e.net || '', dev: dev, devName: d ? d.name : '', mode: e.mode || '',
            status: e.status || (explicit ? 'used' : 'free'), note: e.note || ''};
  }
  function colorOf(pin, ov, layer, prj) {
    if (layer === 'ds') return GROUPS[pin.grp] ? GROUPS[pin.grp].c : '#8C8C8C';
    if (ov.status === 'dnc') return '#B22222';
    if (ov.status === 'nc' || ov.status === 'free') return '#9A9A9A';
    var d = prj.devices[ov.dev]; return d ? d.c : '#9A9A9A';
  }
  function chipKey(pin, ov, layer) {
    if (layer === 'ds') return pin.grp;
    return (ov.status === 'nc' || ov.status === 'dnc' || ov.status === 'free') ? 'NC' : ov.dev;
  }
  function routingFor(pin, rt) {
    return (rt.groups[pin.grp] || []).concat(rt.pins[String(pin.n)] || []);
  }
  function csvEsc(v) { v = String(v == null ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function csv(pins, prj) {
    var lines = ['pin;connector;row;signal;group;direction;net;device;mode;status;pair;note;datasheet'];
    pins.forEach(function (p) {
      var o = merge(p, prj);
      lines.push([p.n, p.conn, p.row, p.sig, p.grp, p.dir, o.net, o.dev, o.mode, o.status, p.pair ? p.pair.partner : '', o.note, p.ds].map(csvEsc).join(';'));
    });
    return lines.join('\n');
  }
  return {GROUPS: GROUPS, DIRS: DIRS, STATUS: STATUS, PITCH: PITCH, PAD: PAD, MM: MM, padXY: padXY, mm: mm,
          merge: merge, colorOf: colorOf, chipKey: chipKey, routingFor: routingFor, csv: csv};
})();
/*LIB-END*/
</script>
<script>
/*UI-START*/
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var pins = DATA.pins, ALT = DATA.alt, byN = {};

  var state = {layer: 'ds', filter: null, sel: null};
  var $ = function (s) { return document.querySelector(s); };
  var board = $('#board'), leg = $('#leg'), panel = $('#panel'), routing = $('#routing');
  var pads = {}, rows = {};

  function svg(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;

  }
  function ov(p) { return LIB.merge(p, PROJECT); }
  function chipName(key) {
    if (state.layer === 'ds') return LIB.GROUPS[key] ? LIB.GROUPS[key].n : key;
    return PROJECT.devices[key] ? PROJECT.devices[key].name : key;
  }
  function chipColor(key) {
    if (state.layer === 'ds') return LIB.GROUPS[key] ? LIB.GROUPS[key].c : '#8C8C8C';

  /* ---------- board ---------- */
  function buildBoard() {
    var defs = svg('defs', {}), pat = svg('pattern', {id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)'});

    defs.appendChild(pat); board.appendChild(defs);

    var o = LIB.mm(0, 0), s = LIB.MM;
    // leaders: pad strip ↔ connector body on the outline
    var cL = LIB.mm(14, 0).x, cR = LIB.mm(36, 0).x;
    var j1 = LIB.mm(0, 3).y, j2 = LIB.mm(0, 37).y;
    board.appendChild(svg('polygon', {class: 'lead', points: [60, 70, 958, 70, cR, j1 - 1.5 * s, cL, j1 - 1.5 * s].join(',')}));
    board.appendChild(svg('polygon', {class: 'lead', points: [cL, j2 + 1.5 * s, cR, j2 + 1.5 * s, 958, 478, 60, 478].join(',')}));
    // outline 55×40 mm, corner radius 2 mm
    board.appendChild(svg('rect', {id: 'outline', x: o.x, y: o.y, width: 55 * s, height: 40 * s, rx: 2 * s}));
    [[3.5, 3.5], [51.5, 3.5], [3.5, 36.5], [51.5, 36.5]].forEach(function (c) {
      var p = LIB.mm(c[0], c[1]); board.appendChild(svg('circle', {class: 'hole', cx: p.x, cy: p.y, r: 1.25 * s}));
    });
    // connector bodies (22×3 mm, centred x = 25 mm) with pin-1 marks at the right end
    [['J1', 3], ['J2', 37]].forEach(function (c) {
      var y = LIB.mm(0, c[1]).y;
      board.appendChild(svg('rect', {class: 'conn', 'data-conn': c[0], x: cL, y: y - 1.5 * s, width: 22 * s, height: 3 * s, rx: 2}));
      board.appendChild(svg('circle', {class: 'pin1', cx: cR - 1.2 * s, cy: y, r: 2.2}));
      board.appendChild(svg('text', {class: 'lbl s', x: cL + 4, y: y + 3.5}, c[0] + (c[0] === 'J1' ? ' · pins 1–100' : ' · pins 101–200') + ' · pin 1 at the right end'));
    });
    // BCM2711 15×15 mm centred at (31.99, 23.03)
    var soc = LIB.mm(31.9875 - 7.5, 23.025 - 7.5);
    board.appendChild(svg('rect', {class: 'soc', x: soc.x, y: soc.y, width: 15 * s, height: 15 * s, rx: 4}));
    board.appendChild(svg('text', {class: 'lbl b', x: soc.x + 7.5 * s, y: soc.y + 7.5 * s + 4, 'text-anchor': 'middle'}, 'BCM2711'));
    // antenna keep-out 6.5×11 mm at the left edge, U.FL at (2.567, 9)
    var a = LIB.mm(0, 10.5);
    board.appendChild(svg('rect', {class: 'ant', x: a.x, y: a.y, width: 6.5 * s, height: 11 * s}));
    var u = LIB.mm(2.567, 9);
    board.appendChild(svg('circle', {class: 'ufl', cx: u.x, cy: u.y, r: 1.2 * s}));
    board.appendChild(svg('text', {class: 'lbl s', x: a.x + 6.5 * s + 6, y: a.y + 11}, 'Antenna keep-out 6.5 × 11 mm:'));
    board.appendChild(svg('text', {class: 'lbl s', x: a.x + 6.5 * s + 6, y: a.y + 23}, 'no copper on any baseboard layer'));
    board.appendChild(svg('text', {class: 'lbl s', x: a.x + 6.5 * s + 6, y: a.y + 35}, 'under this area; U.FL above it.'));
    // strip labels and caption
    [[500, 24, 'middle', 'J1 · pins 1–100 · odd numbers in the top row', true],
     [958, 24, 'end', '1 / 2', false], [60, 24, 'start', '99 / 100', false],
     [500, 534, 'middle', 'J2 · pins 101–200 · odd numbers in the top row', true],
     [958, 534, 'end', '101 / 102', false], [60, 534, 'start', '199 / 200', false],
     [500, 552, 'middle', 'CM4 viewed from the top, to scale (datasheet Fig. 4). Connectors are on the underside; pin 1 is at the right end of each connector.', false]
    ].forEach(function (l) {
      board.appendChild(svg('text', {class: 'lbl' + (l[4] ? ' b' : ''), x: l[0], y: l[1], 'text-anchor': l[2]}, l[3]));
    });
    pins.forEach(function (p) {
      var xy = LIB.padXY(p.n);

      g.appendChild(svg('title', {}));
      g.appendChild(svg('rect', {x: xy.x, y: xy.y, width: LIB.PAD, height: LIB.PAD, rx: 3}));
      g.appendChild(svg('text', {x: xy.x + LIB.PAD / 2, y: xy.y + LIB.PAD / 2 + 2.5}, String(p.n)));

        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(p.n); }
      });
      board.appendChild(g);
      pads[p.n] = g;
    });
  }

  /* ---------- legend ---------- */
  function buildLegend() {
    leg.replaceChildren();
    var src = state.layer === 'ds' ? LIB.GROUPS : PROJECT.devices;
    Object.keys(src).forEach(function (key) {
      var b = h('button', 'lg'); b.type = 'button'; b.dataset.k = key; b.setAttribute('aria-pressed', 'false');

      b.appendChild(d); b.appendChild(document.createTextNode(chipName(key)));
      b.addEventListener('click', function () { setFilter(state.filter === key ? null : key); });
      leg.appendChild(b);
    });
  }

  /* ---------- general layout notes ---------- */
  function buildGeneral() {
    var cols = $('#general-cols');
    (ROUTING.general || []).forEach(function (sec) {
      var d = h('div'); d.appendChild(h('h3', null, sec.title));

      cols.appendChild(d);

  function noteLi(text) {
    var li = h('li'), m = /^(.*?)\s*(\[[^\]]+\])\s*$/.exec(text);

    [['#', ''], ['Conn.', ''], ['Signal', ''], ['Group', ''], ['Dir.', ''],
     ['Net', 'prj'], ['Device', 'prj'], ['Mode', 'prj'], ['Status', 'prj'], ['Note', 'prj'],

    thead.appendChild(tr);
    pins.forEach(function (p) {
      var o = ov(p), r = h('tr', 'row'); r.dataset.n = p.n;

      r.appendChild(h('td', null, p.conn));
      r.appendChild(h('td', 'mono', p.sig));
      r.appendChild(h('td', null, LIB.GROUPS[p.grp] ? LIB.GROUPS[p.grp].n : p.grp));

      r.appendChild(h('td', 'prj c-dev', o.devName || o.dev));
      r.appendChild(h('td', 'mono prj c-mode', o.mode));
      r.appendChild(h('td', 'prj c-status', LIB.STATUS[o.status] || o.status));
      r.appendChild(h('td', 'txt prj c-note', o.note));

  /* ---------- CSV ---------- */
  function bindCsv() {
    var btn = $('#csv'), dlg = $('#csvdlg');
    btn.addEventListener('click', function () {
      var text = LIB.csv(pins, PROJECT);
      function ok() { btn.textContent = 'Copied ✓'; setTimeout(function () { btn.textContent = 'Copy CSV'; }, 1500); }
      function fallback() { dlg.querySelector('textarea').value = text; dlg.showModal(); dlg.querySelector('textarea').select(); }

      else fallback();
    });
  }

  /* ---------- cards ---------- */
  function kv(dl, k, v) {
    dl.appendChild(h('dt', null, k));
    var dd = h('dd');
    if (typeof v === 'string') dd.textContent = v; else dd.appendChild(v);
    dl.appendChild(dd);
  }
  function chip(text, color) { var s = h('span', 'chip', text); s.style.background = color; return s; }
  function code(text) { return h('code', null, text); }
  function pinBtn(n) {
    var b = h('button', 'linkbtn pinbtn', 'pin ' + n); b.type = 'button';

  }

  }
  function altTable(gpio, mode) {
    var a = ALT[String(gpio)], t = h('table', 'alt'), tr1 = h('tr'), tr2 = h('tr');
    var used = /^ALT(\d)/.exec(mode || '');
    a.alt.forEach(function (name, i) {

  }
  function renderRouting(items, title) {
    var frag = document.createDocumentFragment();
    frag.appendChild(h('h3', null, title || 'Routing notes'));
    if (!items || !items.length) {
      frag.appendChild(h('div', 'ph', 'No pin-specific routing constraint. See Layout notes below the board.'));
    } else {
      var ul = h('ul'); items.forEach(function (t) { ul.appendChild(noteLi(t)); }); frag.appendChild(ul);
    }
    routing.replaceChildren(frag);
  }
  function renderPanel() {
    var frag = document.createDocumentFragment();
    if (state.sel == null) {
      if (state.filter) {
        var list = pins.filter(function (p) { return LIB.chipKey(p, ov(p), state.layer) === state.filter; });
        var h2f = h('h2', null, chipName(state.filter) + ' · ' + list.length + ' pins');
        h2f.appendChild(closeBtn(function () { setFilter(null); }));
        frag.appendChild(h2f);
        var ul = h('ul', 'plain');
        list.forEach(function (p) {
          var li = h('li'), o = ov(p);
          li.appendChild(pinBtn(p.n));
          li.appendChild(document.createTextNode(' ' + p.sig + (state.layer === 'prj' && o.net ? ' — ' + o.net : '')));
          ul.appendChild(li);
        });
        frag.appendChild(ul);
        panel.replaceChildren(frag);
        var grpItems = state.layer === 'ds' ? (ROUTING.groups[state.filter] || []) : [];
        renderRouting(grpItems, 'Routing notes · ' + chipName(state.filter));
      } else {
        frag.appendChild(h('div', 'ph', 'Click a pin.'));
        panel.replaceChildren(frag);
        renderRouting([], 'Routing notes');
        routing.querySelector('.ph').textContent = 'Select a pin or a legend entry.';
      }
      return;
    }
    var p = byN[state.sel], o = ov(p), col = LIB.colorOf(p, o, state.layer, PROJECT);
    var h2 = h('h2');
    var pn = h('span', 'pn', String(p.n)); pn.style.background = col; h2.appendChild(pn);
    h2.appendChild(document.createTextNode(p.sig + ' '));
    h2.appendChild(h('span', 'muted', p.conn + ' · ' + (p.row === 'odd' ? 'odd (top) row' : 'even (bottom) row')));
    h2.appendChild(closeBtn(function () { select(null); }));
    frag.appendChild(h2);
    if (state.layer === 'prj') {
      var dl = h('dl', 'kv');
      kv(dl, 'Net', o.net ? code(o.net) : '—');
      kv(dl, 'Device', chip(o.devName || o.dev, col));
      if (o.mode) kv(dl, 'Mode', code(o.mode));
      kv(dl, 'Status', LIB.STATUS[o.status] || o.status);
      if (o.note) kv(dl, 'Note', o.note);
      frag.appendChild(dl);
    }
    var dl2 = h('dl', 'kv');
    kv(dl2, 'Group', chip(LIB.GROUPS[p.grp].n, LIB.GROUPS[p.grp].c));
    kv(dl2, 'Direction', LIB.DIRS[p.dir] || p.dir);
    if (p.gpio != null) {
      var a = ALT[String(p.gpio)];
      kv(dl2, 'BCM2711', 'GPIO' + p.gpio + (a ? ' · boot pull-' + (a.pull === 'High' ? 'up' : 'down') : ''));
    }
    if (p.pair) {
      var q = byN[p.pair.partner], span = h('span');
      span.appendChild(pinBtn(q.n));
      span.appendChild(document.createTextNode(' ' + q.sig + ' · ' + p.pair.z + ' Ω · CM4 trace skew ' + p.pair.skew + ' / ' + q.pair.skew + ' mm'));
      kv(dl2, 'Differential pair', span);
    }
    frag.appendChild(dl2);
    var dq = h('div', 'dsq'); dq.appendChild(h('b', null, 'Datasheet: ')); dq.appendChild(document.createTextNode(p.ds)); frag.appendChild(dq);
    if (p.gpio != null && ALT[String(p.gpio)]) frag.appendChild(altTable(p.gpio, state.layer === 'prj' ? o.mode : ''));
    panel.replaceChildren(frag);
    renderRouting(LIB.routingFor(p, ROUTING), 'Routing notes · pin ' + p.n);
  }

  /* ---------- state ---------- */
  function apply() {
    document.body.classList.toggle('layer-ds', state.layer === 'ds');
    document.body.classList.toggle('layer-prj', state.layer === 'prj');
    document.body.classList.toggle('has-sel', state.sel != null || state.filter != null);
    var selP = state.sel != null ? byN[state.sel] : null;
    var mate = selP && selP.pair ? selP.pair.partner : null, shown = 0;
    pins.forEach(function (p) {
      var o = ov(p), v = visible(p);
      if (v) shown++;
      var g = pads[p.n], cls = 'pad';
      if (!v) cls += ' dim';
      if (p.n === state.sel) cls += ' sel';
      if (p.n === mate) cls += ' mate';
      if (state.layer === 'prj' && o.status === 'dnc') cls += ' dnc';
      if (state.layer === 'prj' && o.status === 'opt') cls += ' opt';
      g.setAttribute('class', cls);
      g.querySelector('rect').setAttribute('fill', LIB.colorOf(p, o, state.layer, PROJECT));
      var label = p.n + ' · ' + p.sig + (state.layer === 'prj' && o.net ? ' · ' + o.net : '');
      g.querySelector('title').textContent = label;
      g.setAttribute('aria-label', 'Pin ' + label);
      var r = rows[p.n];
      if (r) {
        r.hidden = !v;
        r.classList.toggle('sel', p.n === state.sel);
        r.querySelector('.sw').style.background = LIB.colorOf(p, o, state.layer, PROJECT);
      }
    });
    var cnt = $('#cnt'); if (cnt) cnt.textContent = 'Showing ' + shown + ' of 200 pins';
    leg.querySelectorAll('.lg').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === state.filter)); });
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.layer === state.layer)); });
    renderPanel();
  }
  function select(n) { state.sel = n == null ? null : +n; apply(); }
  function setLayer(layer) { state.layer = layer; state.filter = null; buildLegend(); apply(); }
  function setFilter(key) { state.filter = key; apply(); }

  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { setLayer(b.dataset.layer); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { state.sel = null; state.filter = null; apply(); return; }
    if ((e.target.closest && e.target.closest('input,textarea')) || state.sel == null) return;
    var n = state.sel, lo = n <= 100 ? 1 : 101, hi = lo + 99, next = null;
    if (e.key === 'ArrowLeft') next = n + 2;
    else if (e.key === 'ArrowRight') next = n - 2;
    else if (e.key === 'ArrowDown' && n % 2 === 1) next = n + 1;
    else if (e.key === 'ArrowUp' && n % 2 === 0) next = n - 1;
    if (next != null && next >= lo && next <= hi) { e.preventDefault(); select(next); }
  });

  window.PINOUT = {select: select, setLayer: setLayer, setFilter: setFilter, state: state, apply: apply, ov: ov, byN: byN};
  $('#sub').textContent = (PROJECT.meta.cm4 || '') + (PROJECT.meta.date ? ' · rev. ' + PROJECT.meta.rev + ', ' + PROJECT.meta.date : '');
  buildBoard();
  buildLegend();
  buildGeneral();
  buildTable();
  bindCsv();
  apply();
})();
/*UI-END*/
</script>
</body>
</html>
