<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CM4 baseboard — 2×100-pin pinout</title>
<style>
:root{
  --font:system-ui,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --fg:#0d0d0d;--fg2:#525252;--bg:#f5f5f5;--bg2:#ebebeb;--bg3:#d9d9d9;
  --bd:#1a1a1a;--bd2:#737373;--bd3:#a3a3a3;--sel:#0d0d0d;
  --r:10px;--focus:0 0 0 2px var(--bg),0 0 0 4px #404040;
}
@media (prefers-color-scheme:dark){:root{
  --fg:#f0f0f0;--fg2:#a3a3a3;--bg:#141414;--bg2:#1f1f1f;--bg3:#2a2a2a;
  --bd:#e5e5e5;--bd2:#737373;--bd3:#404040;--sel:#ffffff;--focus:0 0 0 2px #141414,0 0 0 4px #a3a3a3;
}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:1rem clamp(16px,3vw,24px) 2rem;font-family:var(--font);color:var(--fg);background:var(--bg);line-height:1.45}
.w{max-width:1360px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{margin:0;font-size:clamp(1.05rem,2.5vw,1.3rem);font-weight:600;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--fg2)}
.seg{display:inline-flex;border:1.5px solid var(--bd3);border-radius:20px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:5px 12px;border:0;background:transparent;color:var(--fg2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:none;box-shadow:var(--focus)}
.legend{display:flex;flex-wrap:wrap;gap:5px 8px;margin-bottom:12px}
.lg{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;color:var(--fg2);background:var(--bg2)}
.lg:hover{border-color:var(--bd2)}.lg:focus-visible{outline:none;box-shadow:var(--focus)}
.lg[aria-pressed="true"]{border-color:var(--bd);background:var(--bg3);color:var(--fg)}
body.layer-ds #only-issues{display:none}
.lg .d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1280px){.main{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.board-wrap{overflow-x:auto}
#board{display:block;min-width:860px;width:100%;height:auto}
.pad{cursor:pointer;pointer-events:bounding-box}
.pad rect{stroke:transparent;stroke-width:2;transition:opacity .12s}
.pad .num{font-family:var(--mono);font-size:7px;fill:#fff;text-anchor:middle;pointer-events:none;user-select:none}
.netlbl{font-family:var(--mono);font-size:11px;fill:var(--fg)}
.netlbl.empty,.netlbl.gnd{fill:var(--fg2)}
.arr{fill:var(--bg3);stroke:var(--bd2);stroke-width:1}
.arr.pwr{stroke-dasharray:2 1.5}
.badge{fill:#c33}
.pad.dim rect,.pad.dim .num{opacity:.15}
.pad.dim .netlbl,.pad.dim .arr,.pad.dim .badge{opacity:.15}
.pad.mate rect{stroke:var(--sel);stroke-width:2;stroke-dasharray:3 2}
.pad.dnc rect{stroke:#c33}
.pad.opt rect{stroke:var(--fg2);stroke-dasharray:2 2}
.pad.sel rect{stroke:var(--sel);stroke-width:3}
.lbl{font-family:var(--font);font-size:11px;fill:var(--fg2)}.lbl.b{fill:var(--fg);font-weight:600;letter-spacing:-.02em}.lbl.s{font-size:9px}
#outline{fill:var(--bg2);stroke:var(--bd2);stroke-width:1.5}
.hole{fill:var(--bg);stroke:var(--bd2)}
.conn{fill:var(--bg3);stroke:var(--bd2)}
.pin1{fill:var(--fg)}
.soc{fill:var(--bg3);stroke:var(--bd3)}
.ant{fill:url(#hatch);stroke:var(--bd2);stroke-dasharray:4 3}
.ufl{fill:none;stroke:var(--bd2)}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.side,.board-wrap,.tbl-wrap{scrollbar-width:thin;scrollbar-color:transparent transparent}
.side:hover,.board-wrap:hover,.tbl-wrap:hover{scrollbar-color:var(--bd3) transparent}
.side::-webkit-scrollbar,.board-wrap::-webkit-scrollbar,.tbl-wrap::-webkit-scrollbar{width:8px;height:8px}
.side::-webkit-scrollbar-track,.board-wrap::-webkit-scrollbar-track,.tbl-wrap::-webkit-scrollbar-track{background:transparent}
.side::-webkit-scrollbar-thumb,.board-wrap::-webkit-scrollbar-thumb,.tbl-wrap::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
.side:hover::-webkit-scrollbar-thumb,.board-wrap:hover::-webkit-scrollbar-thumb,.tbl-wrap:hover::-webkit-scrollbar-thumb{background:var(--bd3)}
.card{background:var(--bg2);border:1px solid var(--bd3);border-radius:var(--r);padding:12px 14px;font-size:13px}
.card .ph{color:var(--fg2)}
.card h2{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600}
.card ul{padding-left:18px;margin:6px 0}.card li{margin:4px 0}
.card ul.plain{padding-left:0;list-style:none}
.pn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;color:#fff;font-size:12px;font-weight:600}
.muted{color:var(--fg2);font-weight:400;font-size:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin:8px 0}
.kv dt{color:var(--fg2)}.kv dd{margin:0}code{font-family:var(--mono);font-size:12px}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;color:#fff;font-size:11px;font-weight:500}
.dsq{margin:6px 0;padding:8px 10px;border-left:3px solid var(--bd3);background:var(--bg);font-size:12px;color:var(--fg2)}
.dsq b{color:var(--fg)}
.dsq-en{margin-top:4px;font-size:11px;opacity:.75}
.alt{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
.alt th,.alt td{border:1px solid var(--bd3);padding:2px 5px;text-align:left;font-family:var(--mono)}
.alt th{font-family:var(--font);color:var(--fg2);font-weight:500}
.alt td.on{background:var(--bg3);font-weight:700}
.linkbtn{font:inherit;font-size:12px;border:1px solid var(--bd3);background:var(--bg);color:var(--fg);border-radius:6px;padding:1px 7px;cursor:pointer}
.card .close{display:none;margin-left:auto}
.src{color:var(--fg2);font-size:11px}
#panel h3{margin-top:12px}
.chk-gnd_open,.chk-missing,td.c-check.c-gnd_open,td.c-check.c-missing{color:#c33}
.chk-none,td.c-check.c-none{color:var(--fg2)}
#general{margin-top:16px;font-size:13px}
#general h2{font-size:15px;margin:0 0 6px}
#general .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 24px}
#general h3{font-size:13px;margin:8px 0 4px}
#general ul{padding-left:18px;margin:4px 0}#general li{margin:3px 0}
.tbl-sec{margin-top:16px}
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px;color:var(--fg2)}
#csv{font:inherit;font-size:12px;padding:4px 10px;border:1.5px solid var(--bd3);border-radius:20px;background:var(--bg2);color:var(--fg);cursor:pointer}
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd3);border-radius:var(--r)}
@media (min-width:1280px){.tbl-wrap{overflow:clip}}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 8px;border-bottom:1px solid var(--bd3);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--bg2);color:var(--fg2);font-weight:500;white-space:nowrap;z-index:1}
td.mono{font-family:var(--mono);white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg2)}tr.row.sel{background:var(--bg3)}
tr.row[hidden]{display:none}
td.txt{min-width:200px;color:var(--fg2)}
body.layer-ds .prj{display:none}
/* Project layer: datasheet-only columns live in the Datasheet layer and the panel; Mode is in the panel's ALT table */
body.layer-prj .c-grp,body.layer-prj .c-dir,body.layer-prj .c-pair,body.layer-prj .ds{display:none}
body.layer-prj td.txt{min-width:0}
@media (min-width:1280px) and (max-width:1599px){body.layer-prj .c-mode{display:none}}
@media (min-width:1280px){body.layer-prj td.txt{overflow-wrap:anywhere}}   /* long tokens such as dtoverlay=… must not widen Note past the clip */
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
dialog{border:1px solid var(--bd3);border-radius:var(--r);background:var(--bg);color:var(--fg);max-width:min(90vw,700px)}
dialog textarea{width:100%;height:50vh;font-family:var(--mono);font-size:11px}
@media (max-width:1279px){
  body.has-sel .side{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:50vh;z-index:10;box-shadow:0 -4px 16px rgba(0,0,0,.25);background:var(--bg);padding:8px;gap:8px}
  body.has-sel .card .close{display:inline-block}
}
</style>
</head>
<body class="layer-ds">
<div class="w">
  <header class="top">
    <div>
      <h1>CM4 baseboard — 2×100-pin pinout</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="seg" role="group" aria-label="Layer">
      <button type="button" data-layer="ds" aria-pressed="true">Datasheet</button>
      <button type="button" data-layer="prj" aria-pressed="false">Project</button>
    </div>
  </header>
  <div class="legend" id="leg" role="toolbar" aria-label="Filter"></div>
  <div class="main">
    <div>
      <div class="board-wrap"><svg id="board" viewBox="0 0 1060 1000" role="group" aria-label="Разъёмы CM4, вид сверху"></svg></div>
      <section class="tbl-sec" aria-label="Pin table">
        <div class="tbl-head"><span id="cnt"></span><button type="button" id="csv">Copy CSV</button></div>

      <section id="general" aria-label="Layout notes"><h2>Layout notes</h2><div class="cols" id="general-cols"></div></section>

      <div class="card" id="routing"><h3>Routing notes</h3><div class="ph">Выберите пин или элемент легенды.</div></div>
    </aside>
  </div>
</div>

ite.md п. 12]"]},"15":{"net":"E_LED_Y","dev":"ETH","dir":"out","status":"opt","note":"Светодиод активности Ethernet (nLED3), активный низкий уровень, втекающий ток до 8 мА. На носителе → R1 3K3 → светодиод ETH_Y.","issues":["Анод светодиода ETH_Y на PWR_3V (отключаемая шина, гаснет вместе с PW_VRX): перевести на +3V (CM4_3.3V) [Review/power-board.md п. 10]"]},"16":{"net":"","dev":"NC","status":"nc","note":"IEEE 1588 SYNC не используется."},"17":{"net":"E_LED_G","dev":"ETH","dir":"out","status":"opt","note":"Светодиод скорости Ethernet (nLED2: низкий = 1 Гбит или 100 Мбит), активный низкий уровень, втекающий ток до 8 мА. На носителе → R2 3K3 → светодиод ETH_G.","issues":["Анод светодиода ETH_G на PWR_3V (отключаемая шина, гаснет вместе с PW_VRX): перевести на +3V (CM4_3.3V) [Review/power-board.md п. 10]"]},"18":{"net":"","dev":"NC","status":"nc","note":"IEEE 1588 SYNC не используется."},"19":{"net":"ETH_nLED_SPD1","dev":"ETH","dir":"out","status":"opt","note":"Светодиод скорости Ethernet (nLED1: низкий = 1 Гбит или 10 Мбит), активный низкий уровень, втекающий ток 8 мА. На носителе только метка на CN1, светодиода нет (обрыв)."},"20":{"net":"EEPROM_nWP","dev":"CTRL","status":"opt","note":"Перемычка на GND защищает EEPROM загрузчика от записи; иначе оставьте неподключённым (внутренняя подтяжка к питанию (pull-up) 100 кОм).","issues":["Вывода нет в схеме носителя: подключение опционально (перемычка на GND) [Review/website.md разд. 5]"]},"21":{"net":"A_LED_G","dev":"CTRL","dir":"out","note":"Светодиод активности CM4: активный низкий уровень, не более 20 мА, допускает 5 В. На носителе → R10 3K3 → светодиод ACT.","issues":["Анод светодиода ACT на PWR_3V (отключаемая шина, гаснет вместе с PW_VRX): перевести на +3V (CM4_3.3V) [Review/power-board.md п. 10]"]},"24":{"net":"FAN_TACH","dev":"FAN","mode":"GPIO","dir":"in","note":"Вход тахометра вентилятора. У вентилятора выход с открытым коллектором — добавьте подтяжку к питанию (pull-up) на baseboard; внутренних 47 кОм для длинного кабеля мало."},"25":{"net":"VRX_CLK","dev":"VRX","mode":"ALT3 SPI6_SCLK","dir":"out","note":"Общая линия CLK четырёх приёмников → VRX_1.4.","issues":["На платах VRX 1.2 и 3.3 ГГц X1.2/X1.4 = SCK/DAT — наоборот относительно носителя (VRX_1.2 = DATA, VRX_1.4 = CLK): аппаратный SPI6 с ними не работает, совпадает только 5.8 ГГц [Review/vrx-board.md п. 1]","Уровень 3.3 В от CM4 на входах SPI и LE приёмников, питающихся от 5 В, не проверен: пороги по даташиту не сверены [Review/vrx-board.md разд. 7]"]},"26":{"net":"","dev":"SPARE","mode":"GPIO","dir":"bidir","status":"opt","note":"Резерв (GPIO19). Ключ питания TX2 управляется выходом P7 расширителя TCA9534A на I2C1 (вариант B), отдельный GPIO не нужен. При загрузке подтяжка к земле (pull-down).","issues":["При варианте A (ключи на GPIO7/GPIO11) GPIO19 остаётся занят под TX2_PWR_EN (выход GPIO): освобождает его только вариант B [Review/power-board.md разд. 7.2]","Ключей TX нет ни на носителе, ни на Retr_PWR: +V_TX2 не подключена, напряжение (батарея или 12 В) не решено [Review/power-board.md п. 6]"]},"27":{"net":"VRX_DATA","dev":"VRX","mode":"ALT3 SPI6_MOSI","dir":"out","note":"Общая линия DATA четырёх приёмников (типа RTC6705, 25-битные слова только на запись) → VRX_1.2. Аппаратный SPI6: dtoverlay=spi6-1cs,cs0_pin=22 (CS0 по умолчанию = GPIO18 занят под FAN_PWM) — либо программный SPI (bit-bang).","issues":["На платах VRX 1.2 и 3.3 ГГц X1.2/X1.4 = SCK/DAT — наоборот относительно носителя (VRX_1.2 = DATA, VRX_1.4 = CLK): аппаратный SPI6 с ними не работает, совпадает только 5.8 ГГц [Review/vrx-board.md п. 1]","Уровень 3.3 В от CM4 на входах SPI и LE приёмников, питающихся от 5 В, не проверен: пороги по даташиту не сверены [Review/vrx-board.md разд. 7]"]},"28":{"net":"UART5_RXD","dev":"SERVO","mode":"ALT4 RXD5","dir":"in","note":"От выхода RX блока CBB3 (CRSF_Mod) — шина сервоприводов ST3025 (цепь SRV_1/2).","issues":["В схеме SRV_1.2 и SRV_2.2 объединены в одну шину SRV_1/2, а на PCB цепи SRV_1 и SRV_2 раздельные, с блоком на каждой (CBB3 → SRV_1, CBB4 → SRV_2): два блока на одной шине дадут два выхода на UART5_RXD — оставить один CBB3 [Review/crsf-one-wire.md п. 12]"]},"29":{"net":"CRSF2_INV","dev":"CRSF2","mode":"GPIO","dir":"out","note":"→ вход INV блока CBB2 (CRSF_Mod, XOR U14/U15): инверсия сигнала CRSF TX2. Вход INV нельзя оставлять открытым — на блоке делитель 10K/10K (R4/~R4). При загрузке подтяжка к земле (pull-down). В схеме носителя метка IO16.","issues":["На CRSF_Mod у INV стоят R4 (к VCC) и ~R4 (к GND) по 10K без пометки DNP: R4 перебьёт подтяжку GPIO к земле при загрузке — ставить только ~R4 [Review/crsf-one-wire.md п. 9]"]},"30":{"net":"CVBS_SEL0","dev":"VRX","mode":"GPIO","dir":"out","note":"→ VRX_1.18 = вход A (CH_A) коммутатора RS2255 на плате VRX: бит 0 выбора канала для выхода V_OUT → AV_K1 (тракт K7); ADV7280A-M получает все 4 канала мимо коммутатора. При загрузке подтяжка к питанию (pull-up): A = 1. Вывод — CTS3: не включайте uart3,ctsrts.","issues":["Хватает ли уровня 3.3 В от GPIO для входов A/B RS2255 при его питании 5 В (порог VIH) — не проверено [Review/website.md п. 10]","Таблица выбора RS2255 не сверена с даташитом: по стандартной таблице (BA = 00 → X0) коды 00…11 → V_OUT4, V_OUT1, V_OUT2, V_OUT3, при загрузке A = 1, B = 0 → V_OUT1 [Review/website.md п. 10]"]},"31":{"net":"UART5_TXD","dev":"SERVO","mode":"ALT4 TXD5","dir":"out","note":"→ вход TX блока CBB3 (CRSF_Mod) → шина сервоприводов ST3025 (2 сервопривода, 1 Мбит/с, один провод, цепь SRV_1/2). Направление переключается автоматически (RC-цепь на блоке), DIR не нужен. Overlay: dtoverlay=uart5."},"34":{"net":"UART3_RXD","dev":"CRSF1","mode":"ALT4 RXD3","dir":"in","note":"От выхода RX блока CBB1 (CRSF_Mod) — CRSF TX1.","issues":["На PCB носителя CN1.34 и CN1.37 в одной цепи RX3 (в схеме UART3_RXD и IO7): трассировка замкнёт GPIO5 и GPIO7 — сначала Import Changes [Review/crsf-one-wire.md п. 4]"]},"35":{"net":"UART2_RXD","dev":"GPS","mode":"ALT4 RXD2","dir":"in","note":"От TX GPS (NMEA/UBX, логика 3.3 В)."},"36":{"net":"UART2_TXD","dev":"GPS","mode":"ALT4 TXD2","dir":"out","note":"К RX GPS (Beitian BK-450; позже — LTE-модем с GPS). При загрузке прошивка опрашивает GPIO0/1 как I2C0 в поисках EEPROM HAT — несколько импульсов попадают на RX GPS; отключите опрос строкой force_eeprom_read=0 (см. Layout notes). Overlay: dtoverlay=uart2."},"37":{"net":"","dev":"SPARE","mode":"GPIO","dir":"bidir","status":"opt","note":"Резерв (GPIO7): блоку CRSF_Mod вход DIR не нужен — направление переключается автоматически. При загрузке подтяжка к питанию (pull-up). ALT0 = SPI0_CE1_N: SPI0 не включайте, если вывод будет занят.","issues":["Вариант A управления ключами берёт GPIO7 под PW_VRX (BSS138, затвор подтянут к CM4_3.3V — шина включена с загрузки) [Review/power-board.md разд. 7.2]"]},"38":{"net":"","dev":"SPARE","mode":"GPIO","dir":"bidir","status":"opt","note":"Резерв (GPIO11): блоку CRSF_Mod вход DIR не нужен — направление переключается автоматически. При загрузке подтяжка к земле (pull-down), как у GPIO9–27. ALT0 = SPI0_SCLK.","issues":["Вариант A управления ключами берёт GPIO11 под PW2 + PW3 (два BSS138 с общим затвором: оба серво одним сигналом) [Review/power-board.md разд. 7.2]"]},"39":{"net":"UART4_TXD","dev":"CRSF2","mode":"ALT4 TXD4","dir":"out","note":"→ вход TX блока CBB2 (CRSF_Mod) → CRSF TX2 (ExpressLRS). Однопроводный полудуплекс: направление переключается на блоке автоматически, инверсия — от GPIO16 (вывод 29). Overlay: dtoverlay=uart4 без RTS.","issues":["На PCB носителя V_IN блоков CBB = +5V_CM: логика блока на 5 В выдаст 5 В на GPIO — нужно V_IN = 3.3 В или транслятор уровней [Review/crsf-one-wire.md п. 3]"]},"40":{"net":"UART4_RXD","dev":"CRSF2","mode":"ALT4 RXD4","dir":"in","note":"От выхода RX блока CBB2 (CRSF_Mod) — CRSF TX2."},"41":{"net":"VRX_SS4","dev":"VRX","mode":"GPIO","dir":"out","note":"LE приёмника 4 → VRX_1.12 (защёлкивание по нарастающему фронту). При загрузке подтяжка к земле (pull-down)."},"44":{"net":"CVBS_SEL1","dev":"VRX","mode":"GPIO","dir":"out","note":"→ VRX_1.20 = вход B (CH_B) коммутатора RS2255 на плате VRX: бит 1 выбора канала. При загрузке подтяжка к земле (pull-down): B = 0. Вывод — CTS4: не включайте uart4,ctsrts.","issues":["Хватает ли уровня 3.3 В от GPIO для входов A/B RS2255 при его питании 5 В (порог VIH) — не проверено [Review/website.md п. 10]","Таблица выбора RS2255 не сверена с даташитом: по стандартной таблице (BA = 00 → X0) коды 00…11 → V_OUT4, V_OUT1, V_OUT2, V_OUT3, при загрузке A = 1, B = 0 → V_OUT1 [Review/website.md п. 10]"]},"45":{"net":"VRX_SS3","dev":"VRX","mode":"GPIO","dir":"out","note":"LE приёмника 3 → VRX_1.10 (защёлкивание по нарастающему фронту). При загрузке подтяжка к земле (pull-down)."},"46":{"net":"VRX_SS1","dev":"VRX","mode":"GPIO","dir":"out","note":"LE приёмника 1 → VRX_1.6: низкий во время сдвига, защёлкивание по нарастающему фронту (= выбор кристалла с активным низким уровнем). При загрузке подтяжка к земле (pull-down)."},"47":{"net":"VRX_SS2","dev":"VRX","mode":"GPIO","dir":"out","note":"LE приёмника 2 → VRX_1.8 (защёлкивание по нарастающему фронту). При загрузке подтяжка к земле (pull-down)."},"48":{"net":"CRSF1_INV","dev":"CRSF1","mode":"GPIO","dir":"out","note":"→ вход INV блока CBB1 (CRSF_Mod, XOR U14/U15): инверсия сигнала CRSF TX1. Вход INV нельзя оставлять открытым — на блоке делитель 10K/10K (R4/~R4). При загрузке подтяжка к земле (pull-down). В схеме носителя метка IO27.","issues":["На CRSF_Mod у INV стоят R4 (к VCC) и ~R4 (к GND) по 10K без пометки DNP: R4 перебьёт подтяжку GPIO к земле при загрузке — ставить только ~R4 [Review/crsf-one-wire.md п. 9]"]},"49":{"net":"FAN_PWM","dev":"FAN","mode":"ALT5 PWM0_0","dir":"out","note":"ШИМ вентилятора, аппаратный PWM0, канал 0 (dtoverlay=pwm,pin=18,func=2). При загрузке низкий уровень: если вентилятор должен работать до старта ПО, добавьте подтяжку к питанию (pull-up) на входе драйвера."},"50":{"net":"","dev":"SPARE","mode":"GPIO","dir":"bidir","status":"opt","note":"Резерв (GPIO17). Ключ питания TX1 управляется выходом P6 расширителя TCA9534A на I2C1 (вариант B), отдельный GPIO не нужен. При загрузке подтяжка к земле (pull-down).","issues":["При варианте A (ключи на GPIO7/GPIO11) GPIO17 остаётся занят под TX1_PWR_EN (выход GPIO): освобождает его только вариант B [Review/power-board.md разд. 7.2]","Ключей TX нет ни на носителе, ни на Retr_PWR: +V_TX1 не подключена, напряжение (батарея или 12 В) не решено [Review/power-board.md п. 6]"]},"51":{"net":"UART0_RXD","dev":"CONSOLE","mode":"ALT0 RXD0","dir":"in","note":"Вход консоли ← UART.3 (разъём SM03B)."},"54":{"net":"UART3_TXD","dev":"CRSF1","mode":"ALT4 TXD3","dir":"out","note":"→ вход TX блока CBB1 (CRSF_Mod) → CRSF TX1 (TBS Crossfire). Однопроводный полудуплекс: направление переключается на блоке автоматически, инверсия — от GPIO27 (вывод 48). Overlay: dtoverlay=uart3 без RTS.","issues":["На PCB носителя V_IN блоков CBB = +5V_CM: логика блока на 5 В выдаст 5 В на GPIO — нужно V_IN = 3.3 В или транслятор уровней [Review/crsf-one-wire.md п. 3]"]},"55":{"net":"UART0_TXD","dev":"CONSOLE","mode":"ALT0 TXD0","dir":"out","note":"Сервисная консоль на 3-контактном разъёме UART (SM03B: UART.2 = TXD, UART.3 = RXD), 3.3 В. Единственный UART, в который пишет загрузчик (BOOT_UART=1); консоль ядра по умолчанию (console=serial0). Восстановление в полевых условиях без монитора."},"56":{"net":"SCL1","dev":"I2C","mode":"ALT0 SCL1","dir":"bidir","note":"Тактовый сигнал I2C1 (метка SCL1 на носителе). Подтяжка к питанию (pull-up) 1.8 кОм на CM4. Ведомые — см. вывод 58.","issues":["На носителе SDA1/SCL1 доходят только до CN1.58/56 (обрыв): ведомых I2C1 и разъёма для датчиков пока нет [Review/website.md разд. 5]","INA219 U25 носителя сейчас на I2C0 (U25.3/4 = SDA0/SCL0): перенести на SDA1/SCL1 [Review/power-board.md п. 9]"]},"57":{"net":"","dev":"NC","dir":"nc","status":"nc","note":"CM4 с eMMC: интерфейс SD не выведен — не подключайте. На носителе здесь метка SD_CLK без цепи.","issues":["На CN1 метки SD_* без цепей (SD есть только у CM4 Lite): решить, какой модуль — с eMMC или Lite с microSD, иначе убрать метки [Review/website.md п. 15]"]},"58":{"net":"SDA1","dev":"I2C","mode":"ALT0 SDA1","dir":"bidir","note":"Данные I2C1 (метка SDA1 на носителе). Ведомые: TCA9534A (0x38–0x3F, питание от +3V) — выходы P0–P7 = ключи Retr_PWR PW_VRX, PW2, PW3, PW_RZ1, PW_RZ2, PW7 (каждый через BSS138 со 100 кОм на землю) и линии TX1_PWR_EN/TX2_PWR_EN будущих ключей TX; ПО: сначала Output = 0x00, затем Configuration. INA219 U25 (перенести с I2C0, задать A0/A1); далее RM3100 (0x20–0x23), BMP390, компас BK-450, Matek INA-BM. ADS1115 платы VRX остаётся на I2C0 (плата заказана). Подтяжка к питанию (pull-up) 1.8 кОм уже есть на CM4 — внешние подтяжки не нужны.","issues":["На носителе SDA1/SCL1 доходят только до CN1.58/56 (обрыв): ведомых I2C1 и разъёма для датчиков пока нет [Review/website.md разд. 5]","INA219 U25 носителя сейчас на I2C0 (U25.3/4 = SDA0/SCL0): перенести на SDA1/SCL1 [Review/power-board.md п. 9]"]},"61":{"net":"","dev":"NC","dir":"nc","status":"nc","note":"CM4 с eMMC: интерфейс SD не выведен — не подключайте. На носителе здесь метка SD_DAT3 без цепи.","issues":["На CN1 метки SD_* без цепей (SD есть только у CM4 Lite): решить, какой модуль — с eMMC или Lite с microSD, иначе убрать метки [Review/website.md п. 15]"]},"62":{"net":"","dev":"NC","dir":"nc","status":"nc","note":"CM4 с eMMC: интерфейс SD не выведен — не подключайте. На носителе здесь метка SD_CMD без цепи.","issues":["На CN1 метки SD_* без цепей (SD есть только у CM4 Lite): решить, какой модуль — с eMMC или Lite с microSD, иначе убрать метки [Review/website.md п. 15]"]},"63":{"net":"","dev":"NC","dir":"nc","status":"nc","note":"CM4 с eMMC: интерфейс SD не выведен — не подключайте. На носителе здесь метка SD_DAT0 без цепи.","issues":["На CN1 метки SD_* без цепей (SD есть только у CM4 Lite): решить, какой модуль — с eMMC или Lite с microSD, иначе убрать метки [Review/website.md п. 15]"]},"67":{"net":"","dev":"NC","dir":"nc","status":"nc","note":"CM4 с eMMC: интерфейс SD не выведен — не подключайте. На носителе здесь метка SD_DAT1 без цепи.","issues":["На CN1 метки SD_* без цепей (SD есть только у CM4 Lite): решить, какой модуль — с eMMC или Lite с microSD, иначе убрать метки [Review/website.md п. 15]"]},"69":{"net":"","dev":"NC","dir":"nc","status":"nc","note":"CM4 с eMMC: интерфейс SD не выведен — не подключайте. На носителе здесь метка SD_DAT2 без цепи.","issues":["На CN1 метки SD_* без цепей (SD есть только у CM4 Lite): решить, какой модуль — с eMMC или Lite с microSD, иначе убрать метки [Review/website.md п. 15]"]},"75":{"net":"","dev":"NC","dir":"nc","status":"nc","note":"CM4 с eMMC: интерфейс SD не выведен — не подключайте. На носителе здесь метка SD_PWR_ON без цепи.","issues":["На CN1 метки SD_* без цепей (SD есть только у CM4 Lite): решить, какой модуль — с eMMC или Lite с microSD, иначе убрать метки [Review/website.md п. 15]"]},"78":{"net":"+3V","dev":"POWER","note":"GPIO_VREF: соедините с CM4_3.3V (+3V, выводы 84/86) для GPIO 3.3 В. Нельзя оставлять неподключённым или заземлять — CM4 не запустится. На носителе так и сделано: цепь +3V соединяет выводы 78, 84 и 86."},"80":{"net":"SCL0","dev":"I2C0","dir":"bidir","note":"Тактовый сигнал I2C0 (BCM GPIO45) — штатная шина камеры на CSI1. Ведомые — см. вывод 82: камера (FPC1.3), U1 ADV7280A-M, J2, ADS1115 платы VRX (VRX_1.16), пока ещё INA219 U25. Подтяжка к питанию (pull-up) 1.8 кОм на CM4.","issues":["INA219 U25 носителя сейчас на I2C0 (U25.3/4 = SDA0/SCL0): перенести на SDA1/SCL1 [Review/power-board.md п. 9]","Подтяжки 4K7 к 5 В на платах VRX вместе с 1.8 кОм CM4 дают на линии ≈ 3.77 В (расчёт) при пределе 3.8 В: плата заказана — уровень проверить на стенде [Review/vrx-board.md п. 3]","U1 ADV7280A-M носителя и внешний CVBS_Mod на J2 — оба по адресу 0x21: на шине должен остаться один [Review/analog-to-csi.md п. 6]","SDA0/SCL0 на PCB носителя до CN1.82/CN1.80 не разведены (DRC: Connection Error) [Review/analog-to-csi.md п. 3]","Камера, U1 и J2 питаются от PWR_3V, которую включает PW_VRX: Linux включает PW_VRX при загрузке (gpio-hog на TCA9534A), до probe камеры и декодера [Review/power-board.md п. 4]"]},"82":{"net":"SDA0","dev":"I2C0","dir":"bidir","note":"Данные I2C0 (BCM GPIO44). Ведомые: камера (FPC1.2); U1 ADV7280A-M по адресу 0x21 (ALSB высокий: R20 4.7 кОм, R21 не установлен); J2 — порт внешнего CVBS_Mod (тоже 0x21); ADS1115 платы VRX (VRX_1.14; ADDR не подключён — задать, 0x48 по даташиту ADS1115 не сверено). Плата VRX заказана и не меняется, поэтому ADS1115 остаётся на I2C0; INA219 U25 переносится на I2C1. Подтяжка к питанию (pull-up) 1.8 кОм на CM4.","issues":["INA219 U25 носителя сейчас на I2C0 (U25.3/4 = SDA0/SCL0): перенести на SDA1/SCL1 [Review/power-board.md п. 9]","Подтяжки 4K7 к 5 В на платах VRX вместе с 1.8 кОм CM4 дают на линии ≈ 3.77 В (расчёт) при пределе 3.8 В: плата заказана — уровень проверить на стенде [Review/vrx-board.md п. 3]","U1 ADV7280A-M носителя и внешний CVBS_Mod на J2 — оба по адресу 0x21: на шине должен остаться один [Review/analog-to-csi.md п. 6]","SDA0/SCL0 на PCB носителя до CN1.82/CN1.80 не разведены (DRC: Connection Error) [Review/analog-to-csi.md п. 3]","Камера, U1 и J2 питаются от PWR_3V, которую включает PW_VRX: Linux включает PW_VRX при загрузке (gpio-hog на TCA9534A), до probe камеры и декодера [Review/power-board.md п. 4]"]},"89":{"net":"WL_nDISABLE","dev":"CTRL","status":"opt","note":"Перемычка на GND отключает Wi-Fi (рядом модуль ELRS 2.4 ГГц). Подтяжка к питанию (pull-up) 1.8 кОм на CM4; как вход сообщает состояние модуля.","issues":["Вывода нет в схеме носителя: подключение опционально (перемычка на GND) [Review/website.md разд. 5]"]},"91":{"net":"BT_nDISABLE","dev":"CTRL","status":"opt","note":"Перемычка на GND отключает Bluetooth. Подтяжка к питанию (pull-up) 1.8 кОм на CM4.","issues":["Вывода нет в схеме носителя: подключение опционально (перемычка на GND) [Review/website.md разд. 5]"]},"92":{"net":"RUN_PG","dev":"CTRL","note":"Кнопка сброса: на GND через 220 Ом. Как выход: высокий = питание в норме и CPU работает (светодиод — через буфер). Внутренняя подтяжка к питанию (pull-up) 10 кОм на 3.3 В.","issues":["В схеме носителя нет кнопки сброса: добавить кнопку на GND через 220 Ом (ТЗ: аппаратный reset CM4) [Review/website.md разд. 5]"]},"93":{"net":"nRPIBOOT","dev":"CTRL","note":"Перемычка или кнопка на GND принудительно включает загрузку по USB (rpiboot: прошивка eMMC, восстановление). Должен стать низким не позднее 2 мс после нарастания +5V. Внутренняя подтяжка к питанию (pull-up) 10 кОм.","issues":["Вывода нет в схеме носителя: добавить перемычку или кнопку на GND (ТЗ: прошивка и восстановление CM4) [Review/website.md разд. 5]"]},"95":{"net":"NPWR_LED","dev":"CTRL","dir":"out","status":"opt","note":"Светодиод питания, активный низкий уровень; по даташиту требует буфера (транзистор). На носителе → R9 3K3 → светодиод PWR.","issues":["Светодиод PWR подключён напрямую через R9 3K3, а даташит требует буфер: добавить транзистор [Review/power-board.md п. 10]","Анод светодиода PWR на PWR_3V (отключаемая шина, гаснет вместе с PW_VRX): перевести на +3V (CM4_3.3V) [Review/power-board.md п. 10]"]},"97":{"net":"CAM_GPIO","dev":"CAM","dir":"out","note":"→ FPC1.6: включение и выключение камеры. Не переназначайте.","issues":["Камера питается от PWR_3V (FPC1.1), которую включает PW_VRX: Linux включает PW_VRX при загрузке через gpio-hog на TCA9534A [Review/power-board.md п. 4]"]},"98":{"net":"GND","dev":"GND","dir":"gnd","note":"Земля: подключите к GND, как все выводы GND.","issues":["CN1.98 в схеме носителя без цепи — подключить к GND [Review/website.md п. 13]"]},"99":{"net":"GLOBAL_EN","dev":"CTRL","note":"От схемы перезагрузки по Ethernet (независимой от CM4), только открытый сток. Низкий = CM4 полностью выключен (15 мкА), выходы 3.3 В и 1.8 В пропадают; отпускание = холодный старт. Внутренняя подтяжка к питанию (pull-up) 100 кОм на +5V с RC-задержкой.","issues":["Вывода нет в схеме носителя: схема перезапуска по Ethernet, независимая от CM4 (ТЗ), не нарисована [Review/website.md разд. 5]"]},"100":{"net":"NEXTRST","dev":"CTRL","dir":"out","status":"opt","note":"Выход: низкий во время сброса, высокий (3.3 В) после старта CPU. На носителе → J_RST (0R) → EXT_RST, дальше никуда; может сбрасывать периферию, например USB-хаб."},"101":{"net":"USBOTG_ID","dev":"USB","dir":"in","note":"На носителе → R_OTG 2K2 → GND: фиксированная роль хоста (нужен драйвер ОС). Для rpiboot нужен прямой путь USB CM4 ↔ ПК в режиме устройства; при OTG_ID на земле этот путь не проверен."},"102":{"net":"PCIE_CLKREQ_N","dev":"PCIE","note":"К M.2 CLKREQ#. Обязателен: без него CM4 не выдаёт REFCLK. Внутренняя подтяжка к питанию (pull-up).","issues":["Цепей PCIe на носителе нет, разъём M.2 не входит в текущий этап [Review/website.md разд. 5]"]},"103":{"net":"USB2_N","dev":"USB","dir":"bidir","note":"USB 2.0 D−, пара 90 Ом, разбег длин внутри пары — не более 0.15 мм. По плану — к upstream-порту хаба USB 2.0 (2 внешних порта, LTE-модем, резерв) / сервисному порту rpiboot; на носителе → USB-C PWR_IN1 и USB1 (A7/B7) параллельно. ОС: otg_mode=1.","issues":["Два разъёма USB-C (PWR_IN1, USB1) параллельно на одной паре, хаба нет: отвод линии и конфликт при двух устройствах [Review/website.md п. 11]","VBUS (5V_USB) соединяет только два разъёма, CC1/CC2 не подключены: устройство в порту хоста не получит питания [Review/website.md п. 11]"]},"105":{"net":"USB2_P","dev":"USB","dir":"bidir","note":"USB 2.0 D+, пара 90 Ом. На носителе → USB-C PWR_IN1 и USB1 (A6/B6) параллельно.","issues":["Два разъёма USB-C (PWR_IN1, USB1) параллельно на одной паре, хаба нет: отвод линии и конфликт при двух устройствах [Review/website.md п. 11]","VBUS (5V_USB) соединяет только два разъёма, CC1/CC2 не подключены: устройство в порту хоста не получит питания [Review/website.md п. 11]"]},"109":{"net":"PCIE_RST_N","dev":"PCIE","note":"К M.2 PERST#. Обязателен для корректного сброса SSD.","issues":["Цепей PCIe на носителе нет, разъём M.2 не входит в текущий этап [Review/website.md разд. 5]"]},"110":{"net":"PCIE_REFCLK_P","dev":"PCIE","note":"К M.2 REFCLK+, 100 МГц, пара 90 Ом, разбег длин внутри пары — не более 0.1 мм. Разделительный конденсатор уже стоит на CM4.","issues":["Цепей PCIe на носителе нет, разъём M.2 не входит в текущий этап [Review/website.md разд. 5]"]},"111":{"net":"","dev":"NC","dir":"nc","status":"nc","note":"Композитный ТВ-выход (VDAC_COMP) не используется — оставьте неподключённым.","issues":["Метка TV_OUT на CN2.11 без цепи: убрать или описать назначение (например, композитный выход на K7) [Review/analog-to-csi.md п. 12]"]},"112":{"net":"PCIE_REFCLK_N","dev":"PCIE","note":"К M.2 REFCLK−.","issues":["Цепей PCIe на носителе нет, разъём M.2 не входит в текущий этап [Review/website.md разд. 5]"]},"115":{"net":"CAM1_D0_N","dev":"CAM","dir":"in","note":"Камера FPC1 на CSI1, 4 линии: ← FPC1.21 (D0−), пара 100 Ом, разбег внутри пары не более 0.15 мм. I2C камеры — I2C0 на выводах 82/80, штатная пара для CSI1: overlay камеры без правок (не проверено). FPC1 — 22-контактный FFC (AFC04-S22ECA-00), как на CM4IO; у камер Raspberry Pi 15-контактный шлейф с шагом 1.0 мм — нужен переходной шлейф.","issues":["В схеме цепь названа CAM1_DO_N — буква O вместо нуля: переименовать в CAM1_D0_N [Review/analog-to-csi.md п. 13]","Разбег длин в паре CAM1 D0 на PCB 0.219 мм (38.225 и 38.443 мм) при рекомендации DS не более 0.15 мм: подровнять пару [Review/analog-to-csi.md п. 11]","Камера питается от PWR_3V (FPC1.1), которую включает PW_VRX: Linux включает PW_VRX при загрузке через gpio-hog на TCA9534A [Review/power-board.md п. 4]"]},"116":{"net":"PCIE_RX_P","dev":"PCIE","note":"От M.2 PERp0 (передатчик SSD). Пара 90 Ом. Разделительные конденсаторы — на стороне SSD (на картах NVMe они есть).","issues":["Цепей PCIe на носителе нет, разъём M.2 не входит в текущий этап [Review/website.md разд. 5]"]},"117":{"net":"CAM1_D0_P","dev":"CAM","dir":"in","note":"Камера: ← FPC1.20 (D0+), пара 100 Ом.","issues":["В схеме цепь названа CAM1_DO_P — буква O вместо var ROUTING = {"groups":{"GND":["Подключите все выводы GND на обоих разъёмах; ни один вывод земли не оставляйте неподключённым. [DS §4]","На носителе CN1.98 без цепи, а CN2.97/98 на цепи RG_OE — подключить все три к GND [Review/website.md п. 13]"],"PWR5":["+5V — основной вход питания, 4.75–5.25 В. Подключите все шесть выводов +5V (77, 79, 81, 83, 85, 87) к одной шине — на носителе это +5V_CM от Retr_PWR. [project]","Заложите в бюджет +5V типовой рабочий ток 1.4 А (400 мА в простое); реальное значение зависит от вычислительной нагрузки. [DS §5.3]","Нагрузка, снимаемая с выходов CM4_3.3V и CM4_1.8V, не входит в указанные токи потребления CM4; прибавьте её к бюджету +5V. [DS §5.4]"],"PWR33":["Выход CM4_3.3V (выводы 84, 86): 3.3 В ± 2.5 %, не более 300 мА на вывод, 600 мА суммарно. Выключен при снятом питании и пока GLOBAL_EN в низком уровне. [DS Table 6]","На этой плате CM4_3.3V (цепь +3V) по плану питает GPIO_VREF, аноды светодиодов состояния и расширитель TCA9534A; мощные нагрузки 3.3 В питайте от отдельного стабилизатора, запитанного от +5V. [project]"],"PWR18":["CM4_1.8V (выводы 88, 90) на этой плате не используется: оба вывода оставьте неподключёнными. [project]"],"GPIO":["Уровень GPIO задаётся GPIO_VREF (вывод 78) = 3.3 В на этой плате; входы не допускают 5 В (абсолютный максимум VGPIO_VREF + 0.5 В): любой источник 5 В подключайте через преобразователь уровня. [DS Table 3]","Суммарную нагрузку на 28 выводов GPIO держите ниже 50 мА. [DS §2.5]","Установите ток выходного драйвера (drive strength) и скорость нарастания фронта (slew rate) минимально достаточными для нагрузки (программная настройка), чтобы снизить проблемы ЭМС. [DS §2.5]","Внутренняя подтяжка GPIO к питанию/к земле (pull-up/pull-down) — типично 47 кОм (33–73 кОм при 3.3 В); там, где нужна более сильная подтяжка, установите внешний резистор. [DS Table 4]","Каждый GPIO при включении питания имеет фиксированную подтяжку к питанию или к земле (pull-up/pull-down; показана в карточке выбранного вывода); там, где по примечанию проекта нужен определённый уровень до старта ПО, поставьте внешнюю подтяжку на baseboard. [BCM2711 §5.3]"],"ETH":["Разведите четыре пары Ethernet как дифференциальные пары с дифференциальным волновым сопротивлением 100 Ом и достаточным зазором до соседних дорожек. [DS §2.2]","Разбег длин внутри каждой пары Ethernet (P и N) — не более 0.15 мм. [DS §2.2]","Разбег длин между парами допускается до 50 мм, поэтому межпарное выравнивание обычно не нужно. [DS §2.2]","PHY (BCM54210PE) сам компенсирует перекрёстное включение MDI, разбег между парами и полярность: перекрещивать пары не нужно. [DS §2.2]","На носителе пары 0/1 (выводы 12/10 и 4/6) идут через TVS1 (TPD4EUSB30) и трансформатор LT1* на разъём ETH1 — 100 Мбит; пары 2/3 оборваны на CN1, коммутатора на плате нет. [Review/website.md п. 12]"],"SD":["Вариант с eMMC: интерфейс SD/eMMC (выводы 57–75) наружу не выведен. Все выводы SD оставьте неподключёнными. [project]"],"USB":["Разведите USB_N/USB_P (выводы 103/105) как дифференциальную пару с дифференциальным волновым сопротивлением 90 Ом; разбег длин внутри пары — не более 0.15 мм. [DS §2.4]","USB по умолчанию отключён прошивкой; включите его строкой otg_mode=1 в config.txt. [DS §2.4]","По плану пара идёт на upstream-порт хаба USB 2.0 (2 внешних порта, LTE-модем, резерв) и на сервисный порт rpiboot. [project]","На носителе пара сейчас идёт на два USB-C (PWR_IN1 и USB1) параллельно, без хаба и без VBUS: отвод линии и конфликт при двух устройствах. [Review/website.md п. 11]"],"PCIE":["Разведите три пары PCIe (REFCLK, TX, RX) как дифференциальные пары с дифференциальным волновым сопротивлением 90 Ом и достаточным зазором до соседних дорожек. [DS §2.3]","Разбег длин внутри каждой пары PCIe (P и N) — не более 0.1 мм. Выравнивание длин между парами не требуется. [DS §2.3]","Разделительные конденсаторы: для CLK и TX они стоят на CM4; паре RX нужны внешние конденсаторы рядом с передатчиком устройства — на карте NVMe они уже установлены на самой карте. [DS §2.3]","Соответствие M.2 на этой плате: CM4 TX (выводы 122/124) → PETp0/PETn0, CM4 RX (выводы 116/118) ← PERp0/PERn0, REFCLK (110/112) → REFCLK+/−. [project]","PCIe_CLK_nREQ (вывод 102) обязателен: без него CM4 не выдаёт тактовый сигнал. Подключите PCIe_nRST (вывод 109), чтобы устройство сбрасывалось корректно. [DS §2.3]","Соедините вывод 102 с M.2 CLKREQ#, а вывод 109 — с M.2 PERST#. [project]"],"CSI0":["Разведите CSI0 — 2 линии данных (lane) и тактовую пару — как дифференциальные пары с дифференциальным волновым сопротивлением 100 Ом; разбег длин внутри пары — не более 0.15 мм. [DS §2.7]","CSI0 — видеодекодер ADV7280A-M: используются D0 (выводы 128/130) и тактовая пара (140/142). [Review/analog-to-csi.md п. 1]","D1 (выводы 134/136) идёт только на J2 — порт внешнего CVBS_Mod; однолинейному U1 она не нужна. [Review/website.md п. 2]"],"CSI1":["Разведите CSI1 как дифференциальные пары с дифференциальным волновым сопротивлением 100 Ом; разбег длин внутри пары — не более 0.15 мм. [DS §2.7]","CSI1 — камера FPC1 на все четыре линии (lane) D0–D3 и тактовую пару, выводы 115–141. [Review/analog-to-csi.md п. 1]","FPC1 — 22-контактный FFC (AFC04-S22ECA-00), как на CM4IO; камерам Raspberry Pi с 15-контактным шлейфом шага 1.0 мм нужен переходной шлейф. [project]","Шина управления камерой — I2C0 (выводы 82/80), включение — CAM_GPIO (вывод 97 → FPC1.6). [project]","Разбег длин в паре CAM1 D0 на PCB носителя 0.219 мм (38.225 и 38.443 мм) при рекомендации не более 0.15 мм: подровнять пару у FPC1/CN2. [Review/analog-to-csi.md п. 11]"],"HDMI0":["HDMI0 на этой плате не используется: все выводы HDMI0 оставьте неподключёнными. [project]"],"HDMI1":["HDMI1 на этой плате не используется: все выводы HDMI1 оставьте неподключёнными. [project]"],"DSI0":["DSI0 на этой плате не используется: все выводы DSI0 оставьте неподключёнными. [project]"],"DSI1":["DSI1 на этой плате не используется: все выводы DSI1 оставьте неподключёнными. [project]"],"I2C0":["SDA0/SCL0 (выводы 82/80, BCM2711 GPIO44/45) уже имеют на CM4 подтяжки к питанию (pull-up) 1.8 кОм на CM4_3.3V: сильных внешних подтяжек не добавляйте. [DS Table 6]","Ведомые I2C0: камера FPC1 (CSI1), декодер ADV7280A-M по адресу 0x21 (ALSB высокий), порт J2 внешнего CVBS_Mod (тоже 0x21) и ADS1115 платы VRX (VRX_1.14/16); INA219 U25 переносится на I2C1. [Review/analog-to-csi.md п. 9]"],"CTRL":["Все входы CTRL (выводы 20, 89, 91, 92, 93, 99) имеют внутреннюю подтяжку к питанию (pull-up): неиспользуемые оставьте неподключёнными; коммутируйте только на GND (перемычка, кнопка или драйвер с открытым стоком; RUN_PG — через 220 Ом). [DS Table 6]"],"RSV":["Зарезервированные выводы 76, 104, 106: ничего к ним не подключайте. [DS Table 6]"],"VDAC":["Композитный ТВ-выход (VDAC_COMP, вывод 111) на этой плате не используется: оставьте неподключённым. [project]"],"ANALOG":["AnalogIP0/1 (выводы 96/94, входы MXL7704 для USB-C CC): USB-C PD на этой плате нет, оба оставьте неподключёнными. [project]"]},"pins":{"15":["Выход светодиода Ethernet, активный низкий уровень, втекающий ток ≤ 8 мА при VOL < 0.4 В: анод светодиода через последовательный резистор на CM4_3.3V (выводы 84/86) — не на шину baseboard, которая остаётся под напряжением при выключенном CM4 (обратное питание через сигнальную линию). [DS Table 6]","На этой плате необязателен. [project]"],"16":["Вход IEEE 1588 SYNC, на этой плате не используется: оставьте неподключённым. [project]"],"17":["Выход светодиода Ethernet, активный низкий уровень, втекающий ток ≤ 8 мА при VOL < 0.4 В: анод светодиода через последовательный резистор на CM4_3.3V (выводы 84/86) — не на шину baseboard, которая остаётся под напряжением при выключенном CM4 (обратное питание через сигнальную линию). [DS Table 6]","На этой плате необязателен. [project]"],"18":["Выход IEEE 1588 SYNC, на этой плате не используется: оставьте неподключённым. [project]"],"19":["Выход светодиода Ethernet, активный низкий уровень, втекающий ток ≤ 8 мА при VOL < 0.4 В: анод светодиода через последовательный резистор на CM4_3.3V (выводы 84/86) — не на шину baseboard, которая остаётся под напряжением при выключенном CM4 (обратное питание через сигнальную линию). [DS Table 6]","На этой плате необязателен. [project]"],"20":["Оставьте неподключённым (внутренняя подтяжка к питанию (pull-up) 100 кОм на CM4_3.3V, VIL < 0.8 В) или заземлите, чтобы защитить EEPROM загрузчика от записи. [DS Table 6]","Для защиты от записи EEPROM_nWP должен быть в низком уровне ещё до подачи питания. [DS §5.1]","В серийном изделии притяните его к низкому уровню, чтобы конечный пользователь не мог изменить содержимое EEPROM. [DS §2.18]"],"21":["Светодиод активности, активный низкий уровень: не более 20 мА, допускает 5 В, VOL < 0.4 В. [DS Table 6]","При сбое загрузки этот светодиод мигает кодом ошибки; оставьте его видимым для сервисного обслуживания. [DS §2.16]"],"24":["Вход тахометра вентилятора: у вентилятора выход с открытым коллектором — добавьте подтяжку к питанию (pull-up) на baseboard; внутренних 47 кОм для длинного кабеля мало. [project]"],"49":["ШИМ вентилятора (PWM0, канал 0). При загрузке низкий уровень: если вентилятор должен работать до старта ПО, добавьте подтяжку к питанию (pull-up) на входе драйвера. [project]"],"51":["Сервисная консоль RXD0 ← UART.3 того же 3-контактного разъёма UART (SM03B), что и вывод 55. [project]"],"55":["Сервисная консоль TXD0 → UART.2 3-контактного разъёма UART (SM03B), 3.3 В; RXD — вывод 51. [project]"],"56":["SCL1 — шина TCA9534A, INA219 и датчиков: подтяжка к питанию (pull-up) 1.8 кОм уже есть на CM4 — сильных внешних подтяжек не добавляйте. [project]"],"58":["SDA1 — шина TCA9534A, INA219 и датчиков: подтяжка к питанию (pull-up) 1.8 кОм уже есть на CM4 — сильных внешних подтяжек не добавляйте. [project]"],"78":["Соедините GPIO_VREF с CM4_3.3V (выводы 84 и 86). Нельзя оставлять неподключённым и нельзя заземлять: без него CM4 не запускается. [DS Table 6]"],"80":["Разведите к камере (FPC1.3), SCL ADV7280A-M (U1, вывод 31), J2.3 и VRX_1.16 (ADS1115); на PCB носителя SCL0 до CN1.80 пока не доведена. [Review/analog-to-csi.md п. 3]"],"82":["Разведите к камере (FPC1.2), SDA ADV7280A-M (U1, вывод 30), J2.2 и VRX_1.14 (ADS1115); на PCB носителя SDA0 до CN1.82 пока не доведена. [Review/analog-to-csi.md п. 3]"],"89":["WL_nDisable: внутренняя подтяжка к питанию (pull-up) 1.8 кОм на CM4_3.3V; можно оставить неподключённым. [DS Table 6]","Замкните на землю или подайте низкий уровень, чтобы держать радиомодуль обесточенным; если вывод используется для контроля состояния, высокий уровень = модуль запитан. [DS §2.1.1]","Поставьте перемычку на GND, чтобы Wi-Fi можно было отключить, когда рядом установлен модуль ELRS 2.4 ГГц. [project]"],"91":["BT_nDisable: внутренняя подтяжка к питанию (pull-up) 1.8 кОм на CM4_3.3V; можно оставить неподключённым. [DS Table 6]","Замкните на землю или подайте низкий уровень, чтобы держать модуль Bluetooth обесточенным; если вывод используется для контроля состояния, высокий уровень = модуль запитан. [DS §2.1.2]","Поставьте перемычку на GND. [project]"],"92":["Вход сброса: притягивайте к GND через резистор 220 Ом (кнопка или драйвер с открытым стоком). Внутренняя подтяжка к питанию (pull-up) 10 кОм на +3.3V. [DS Table 6]","Как выход: высокий уровень = питание в норме и CPU работает. Светодиод «работа» подключайте через буфер, не напрямую. [project]","Сброс через RUN_PG не закрывает открытые файлы; применяйте с осторожностью. [DS §2.14]"],"93":["Низкий уровень принудительно включает загрузку с USB-хоста (rpiboot) вместо eMMC; для этого он должен стать низким не позднее 2 мс после нарастания +5V. [DS §5.1]","Внутренняя подтяжка к питанию (pull-up) 10 кОм на +3.3V; если не используется — оставьте неподключённым. [DS Table 6]","Поставьте перемычку или кнопку на GND: это путь для прошивки eMMC и восстановления. [DS §6.2]"],"95":["Необязательный светодиод питания: выход с активным низким уровнем, требует буфера (транзистор) — напрямую светодиодом управлять не может. [DS §2.17]"],"97":["Camera_GPIO: обычно используется для выключения камеры. Переназначать этот вывод не рекомендуется. Уровни сигнала CM4_3.3V. [DS Table 6]","Разведите на FPC1.6 — камера на CSI1. [project]"],"99":["Низкий уровень выключает питание CM4; внутренняя подтяжка к питанию (pull-up) 100 кОм на +5V. [DS Table 6]","При низком GLOBAL_EN CM4 потребляет 15 мкА (состояние минимального потребления). [DS Table 5]","После программного выключения удерживайте его в низком уровне дольше 1 мс, чтобы перезапустить систему питания; притягивайте к низкому только после завершения работы ОС. [DS §2.13]","Управляется только открытым стоком, от схемы перезагрузки по Ethernet (независимой от CM4); пока низкий — выходы 3.3 В и 1.8 В пропадают, отпускание = холодный старт. [project]"],"100":["Только выход: низкий во время сброса, высокий (CM4_3.3V) после начала загрузки CPU. [DS Table 6]","Необязательно: используйте для сброса периферии, например USB-хаба. [project]"],"101":["Для фиксированной роли (только хост или только устройство) соедините USB_OTG_ID с GND; есть внутренняя подтяжка к питанию (pull-up); драйвер ОС должен соответствовать выбранной роли. [DS §2.4]","Для rpiboot нужен прямой путь USB CM4 ↔ ПК в режиме устройства: переключатель или перемычка между upstream-портом хаба и сервисным портом (на усмотрение схемотехника). [project]"],"102":["Вход 3.3 В, низкий уровень = запрос тактового сигнала; внутренняя подтяжка к питанию (pull-up). [DS Table 6]","Соедините с M.2 CLKREQ#. [project]"],"109":["Выход +3.3V, активный низкий уровень. [DS Table 6]","Соедините с M.2 PERST# (корректный сброс SSD). [project]"],"110":["Выход тактового сигнала PCIe, положительный, 100 МГц → M.2 REFCLK+ (в паре с выводом 112). [project]"],"112":["Выход тактового сигнала PCIe, отрицательный, 100 МГц → M.2 REFCLK− (в паре с выводом 110). [project]"],"115":["CSI1 D0− от камеры FPC1.21, в паре с выводом 117; одна из четырёх линий (lane) камеры. [project]"],"116":["Соедините с M.2 PERp0 (передатчик SSD; сигнал идёт от него к CM4), в паре с выводом 118. [project]"],"117":["CSI1 D0+ от камеры FPC1.20, в паре с выводом 115. [project]"],"118":["Соедините с M.2 PERn0 (сигнал идёт от него к CM4), в паре с выводом 116. [project]"],"122":["Соедините с M.2 PETp0, в паре с выводом 124. [project]"],"124":["Соедините с M.2 PETn0, в паре с выводом 122. [project]"],"127":["CSI1, тактовый сигнал, отрицательный (clock−): от камеры FPC1.15, в паре с выводом 129. [project]"],"128":["CSI0 D0− от ADV7280A-M D0N (U1, вывод 10) через R5 (0R), в паре с выводом 130; однолинейный канал CSI-2. [Review/analog-to-csi.md п. 1]"],"129":["CSI1, тактовый сигнал, положительный (clock+): от камеры FPC1.14, в паре с выводом 127. [project]"],"130":["CSI0 D0+ от ADV7280A-M D0P (U1, вывод 9) через R6 (0R), в паре с выводом 128. [Review/analog-to-csi.md п. 1]"],"140":["CSI0, тактовый сигнал, отрицательный (clock−): от ADV7280A-M CLKN (U1, вывод 12) через R13 (0R), в паре с выводом 142. [Review/analog-to-csi.md п. 1]"],"142":["CSI0, тактовый сигнал, положительный (clock+): от ADV7280A-M CLKP (U1, вывод 11) через R19 (0R), в паре с выводом 140. [Review/analog-to-csi.md п. 1]"]},"general":[{"title":"Механика и разъёмы","items":["Модуль 55 × 40 мм, высота 4.7 мм; плата 1.2 мм ± 10 %. Четыре крепёжных отверстия M2.5 с отступом 3.5 мм от краёв модуля. [DS §3.1]","Две 100-контактные розетки (ответные части) Hirose DF40 на baseboard: DF40C-100DS-0.4V для высоты стека 1.5 мм (зазор под CM4 0 мм) или DF40HC(3.0)-100DS-0.4V для высоты стека 3.0 мм (зазор 1.5 мм). [DS §3.1]","Высота в собранном виде: 5.078 мм при стеке 1.5 мм, 6.578 мм при стеке 3.0 мм. Высота BCM2711 с шариками припоя — 2.378 ± 0.11 мм. [DS §3.1]","При стеке 1.5 мм зазор под CM4 равен 0 мм: не размещайте компоненты на baseboard внутри посадочного места модуля. При стеке 3.0 мм компоненты под модулем должны быть ниже 1.5 мм. [DS §3.1]","Чертёж платы (CM4 вид сверху, разъёмы на нижней стороне) одновременно является посадочным местом на baseboard в виде сверху — без зеркалирования. Вывод 1 — у правого конца обоих разъёмов на Fig. 4 (на повёрнутом чертеже страницы — вверху); сверьте нумерацию выводов с чертежом розетки DF40. [DS Fig. 4]","Оси разъёмов в 3 мм от длинных краёв (CN1 y = 3 мм, CN2 y = 37 мм по Fig. 4), центр по x = 25 мм от антенного края; корпус примерно 22 × 3 мм — геометрию контактных площадок и точное положение берите из посадочного места розетки DF40. [DS Fig. 4]","Расположение компонентов на CM4 может меняться от ревизии к ревизии; максимальные высоты компонентов и толщина платы сохраняются. STEP-файл из проектных данных CM4 используйте только как ориентир. [DS §3.1]"]},{"title":"Питание и последовательность включения","items":["Единственное питание +5V: оно должно нарастать монотонно до 4.75 В и во время работы оставаться выше 4.75 В. [DS §5.1]","Не подавайте напряжение ни на один вывод раньше, чем подана шина +5V. [DS §5.1]","При выключении и в выключенном состоянии ни на одном выводе не должно быть внешнего напряжения, иначе следующее включение может не произойти. [DS §4]","Последовательность включения: +5V → GLOBAL_EN (внутренняя RC-задержка) → 3.3 В → 1.8 В не ранее чем через 1 мс → RUN_PG не ранее чем через 10 мс → EXT_nRESET не ранее чем через 1 с. [DS §5.1]","Выключение: завершите работу ОС, затем снимите +5V или притяните GLOBAL_EN к низкому уровню. При выключении шина 1.8 В разряжается раньше шины 3.3 В. [DS §5.2]","Если CM4_3.3V питает что-либо кроме GPIO_VREF, при внезапной потере питания (+5V ниже 4.5 В) она никогда не должна опускаться ниже CM4_1.8V; иначе добавьте схему, отключающую нагрузку 3.3 В. [DS §4]","Проверка питания при низком GLOBAL_EN: +5V выше 4.75 В (лучше выше 4.9 В) при нагрузке 2 А с учётом шума; шины CM4 3.3 В и 1.8 В обе ниже 200 мВ (нет обратного питания). [DS §6.1]"]},{"title":"Загрузка, сброс и сервис","items":["nRPIBOOT (вывод 93) и EEPROM_nWP (вывод 20) на плате CM4IO заземляются перемычками (§6.2, §6.4): здесь поставьте перемычки или кнопки на GND. [DS §6.2]","EEPROM загрузчика обновляется только через usbboot или самообновление: путь rpiboot (перемычка nRPIBOOT плюс прямой USB-путь до ПК в режиме устройства) должен оставаться доступным в эксплуатации. [DS §6.3]","Сервисная консоль на этой плате: UART0 на 3-контактном разъёме UART (SM03B), 3.3 В; единственный UART, в который пишет загрузчик. [project]"]},{"title":"Высокоскоростные дифференциальные пары","items":["Дифференциальное волновое сопротивление: 90 Ом для PCIe (REFCLK, TX, RX) и USB 2.0; 100 Ом для Ethernet, CSI, HDMI и DSI. [DS §4.1]","На CM4 разбег длин внутри каждой пары — не более 0.05 мм; разбег длин между парами на стороне CM4 (таблицы 7–8) показаны в карточке выбранного вывода. [DS §4.1]"]},{"title":"GPIO и низкоскоростные интерфейсы","items":["UART на этой плате: UART0 консоль (55/51), UART2 GPS (36/35), UART3 CRSF TX1 (54/34), UART4 CRSF TX2 (39/40), UART5 шина сервоприводов (31/28); все 3.3 В. [project]","GPIO0/1 (выводы 36/35) — это UART2, а не I2C для HAT: добавьте force_eeprom_read=0 и disable_poe_fan=1 в config.txt, чтобы отключить опрос EEPROM при загрузке. [DS §2.10]","Однопроводные шины ведут блоки CRSF_Mod: CBB1 — CRSF TX1 (UART3), CBB2 — CRSF TX2 (UART4), CBB3 — шина сервоприводов (UART5); направление блок переключает сам по TX, GPIO направления не нужны. [Review/crsf-one-wire.md п. 6]","SPI6 к видеоприёмникам: MOSI на выводе 27, SCLK на выводе 25, по одному GPIO LE (выбор кристалла, chip-select; цепи VRX_SS1–4) на приёмник — выводы 46, 47, 45, 41. [project]"]},{"title":"Wi-Fi и радиочасть","items":["Под антенной ни на одном слое baseboard не должно быть меди и другого металла: зона без меди минимум 6.5 × 11 мм, лучше не менее 8 × 15 мм (меньшая зона сильнее всего ухудшает 2.4 ГГц). [DS §3.1]","Область антенны — у короткого края модуля: x = 0–6.5 мм, y = 10.5–21.5 мм по Fig. 4 (CM4 вид сверху); на странице заштрихована. [DS Fig. 4]","Оставьте не менее 10 мм свободного пространства вокруг печатной антенны; в любом металле поблизости сделайте вырезы; ориентируйте антенну к краю пластикового корпуса. Характеристики должен проверить разработчик. [DS §3.1]","По возможности используйте внешнюю антенну: на модуле есть стандартный разъём U.FL. [DS §3.1]","Разъём U.FL на модуле: x = 2.57 мм от антенного края, y = 9.0 мм от длинного края со стороны CN1 — те же оси, что и у зоны без меди под антенной. [DS Fig. 4]","Выбор антенны фиксируется при загрузке в config.txt: dtparam=ant1 = печатная антенна, dtparam=ant2 = внешняя антенна. [DS §2.1]"]},{"title":"Тепловой режим","items":["Рабочая температура −20…85 °C, без конденсации. [DS §3.2]","BCM2711 снижает частоту (троттлинг), чтобы удержать кристалл ниже 85 °C; если не удаётся, температура корпуса поднимается выше 85 °C. Держите температуру окружающей среды для остальных компонентов CM4 в рабочем диапазоне. [DS §3.2]","У CM4 меньше пассивного теплоотвода, чем у Raspberry Pi 4 Model B, и он может греться сильнее при меньшей рассеиваемой мощности, поэтому может потребоваться решение по охлаждению. [DS §3.2]","BCM2711 15 × 15 мм с центром в (31.99, 23.03) мм по Fig. 4: центрируйте там радиатор или вырез под вентилятор. [DS Fig. 4]","Вентилятор: PWM0 на GPIO18 (вывод 49), тахометр на GPIO26 (вывод 24) с внешней подтяжкой к питанию (pull-up). [project]","Оптимальные радиочастотные характеристики — от −20 °C до +75 °C; по возможности держите модуль Wi-Fi ниже 75 °C. [DS §3.2]"]},{"title":"Видеодекодер ADV7280A-M (проект)","items":["ADV7280A-M на CSI0, одна линия данных (lane): D0N/D0P (U1, выводы 10/9) через R5/R6 (0R) → выводы CM4 128/130, CLKN/CLKP (U1, выводы 12/11) через R13/R19 → выводы 140/142. [Review/analog-to-csi.md п. 1]","Камера FPC1 (22 контакта) — на CSI1: все четыре линии (lane) и тактовая пара, выводы 115–141; эти пары на носителе разведены. [Review/analog-to-csi.md п. 1]","I2C: SDA/SCL (U1, выводы 30/31) → CM4 SDA0/SCL0 (выводы 82/80). ALSB (вывод 29) через подтяжку к питанию (pull-up) 4.7 кОм (R20) с неустанавливаемой (DNP) подтяжкой к земле (R21): высокий = адрес 0x21, низкий = 0x20. [sdtv2csi]","Питание: LDO NJM12888F18, 3.3 В → 1.8 В для AVDD, DVDD, MVDD, PVDD, каждый через ферритовую бусину 600 Ом с 0.1 мкФ + 10 мкФ; DVDDIO = 3.3 В. Кварц Y1: ABM8G 28.63636 МГц, 2 × 20 пФ. [sdtv2csi]","Входная цепь каждого AIN: VINx → 24 Ом последовательно → узел, от него 51 Ом на GND → разделительный конденсатор 0.1 мкФ → AINx; 51 Ом стоит после 24 Ом, перед 0.1 мкФ. [Review/analog-to-csi.md п. 14]","~RESET (вывод 28): подтяжка к питанию (pull-up) 4.7 кОм + 4.7 мкФ на GND (RC-сброс при включении); ~PWRDWN (вывод 32): подтяжка к питанию 4.7 кОм; ~INTRQ и GPO0–GPO2: только контрольные точки. GPIO CM4 не задействованы. [sdtv2csi]","ПО: штатный adv728x-m (dtoverlay=adv728x-m,adv7280m=1, адрес 0x21) нацелен на CSI1 — для CSI0 нужен свой вариант overlay с I2C на выводах 82/80 (не проверено). [Review/analog-to-csi.md п. 2]","Камере на CSI1 подходит штатная пара «CSI1 + I2C0 (выводы 82/80)»: её overlay без правок (не проверено). [Review/analog-to-csi.md п. 2]","Параллельно U1 на тех же парах CSI0 и на I2C0 стоит J2 — порт внешнего CVBS_Mod (тоже 0x21): два передатчика CSI на одной паре нельзя — выбрать одно и оформить варианты сборки. [Review/analog-to-csi.md п. 6]","Тракт CSI0 от U1 до CN2 (цепи CAM0_*) и SDA0/SCL0 до CN1.82/80 на PCB носителя не разведены: вести пары 100 Ом с разбегом внутри пары ≤ 0.15 мм. [Review/analog-to-csi.md п. 3]","Цепи CAM0_DO_*/CAM1_DO_* в схеме названы с буквой O вместо нуля: переименовать в CAM0_D0_*/CAM1_D0_*. [Review/analog-to-csi.md п. 13]","Тракт K7 остаётся параллельно: ADV7280A-M получает V_OUT1–V_OUT4 модуля VRX на AIN1–AIN4 напрямую, а коммутатор RS2255 на модуле (CVBS_SEL0/1, выводы 30/44) нужен только для выхода V_OUT на AV_K1. [Review/website.md п. 10]"]},{"title":"Подключение готовых плат Retr_PWR, VRX, CRSF_Mod, CVBS_Mod (проект)","items":["Цепочка +5V CM4: +BAT → IS_IN1 → +V_IN → X_U8.22/24/26 → V_IN → FB7 → U4 TPS5430 → +5V_CM → X_U8.2/4 → CN1.77–87; на носителе у +BAT/+V_IN меди нет, +5V_CM разведена частично (DRC: 9 обрывов). [Review/power-board.md разд. 7.1]","На Retr_PWR вход всех четырёх TPS5430 — цепь V-IN, а батарея приходит на V_IN: переименовать метку V-IN → V_IN и соединить медь (≥ 1 мм, ≈ 14 мм), иначе +5V_CM нет и CM4 не стартует. [Review/power-board.md п. 1]","Правки U4 для +5V_CM: R4 = 3K24 — 4.99 В вместо 4.92 В (сейчас в худшем случае 4.748 В, ниже минимума CM4 4.75 В) и выходной фильтр по даташиту TI — 4.7 мкГн + 2 × 10 мкФ керамика вне его области, риск звона. [Review/power-board.md разд. 7.1]","Ключи Retr_PWR активны низким уровнем, поэтому каждую линию PW* ведёт BSS138 на носителе от выхода TCA9534A (P0–P5: PW_VRX, PW2, PW3, PW_RZ1, PW_RZ2, PW7) с подтяжкой затвора 100 кОм к земле: при загрузке и при выключенном CM4 ключ закрыт. [Review/power-board.md разд. 7.2]","Выходы P6/P7 (TX1_PWR_EN, TX2_PWR_EN) зарезервированы под ключи TX, которых ещё нет: +V_TX1/+V_TX2 не подключены — напряжение (батарея или 12 В), ключ и драйвер надо спроектировать. [Review/power-board.md п. 6]","PWR_3V (камера FPC1, U1 ADV7280A-M, 1.8 В носителя, светодиоды) питается от коммутируемой +5V_VRX и так остаётся: Linux включает PW_VRX при загрузке через gpio-hog на расширителе, а камера и декодер проходят probe после этого. [Review/power-board.md п. 4]","Сервошины ещё не 12 В: делитель MC34063 (47K/2K2) задаёт ≈ 27.95 В — выше батареи, стабилизации нет; исправить делитель до включения PW2/PW3. [Review/power-board.md п. 5]","V_IN блоков CRSF_Mod (CBB1–CBB3) — 3.3 В: на PCB носителя сейчас +5V_CM, и логика блока выдаст 5 В на GPIO при пределе 3.8 В; иначе нужен транслятор уровней. [Review/crsf-one-wire.md п. 3]","Шину сервоприводов SRV_1/2 ведёт один блок CBB3 (UART5, INV = 0); CBB4 убрать или оставить резервом без подключения — два блока дали бы два выхода на UART5_RXD. [Review/crsf-one-wire.md п. 12]","Разъём VRX_1: 2 = VRX_DATA, 4 = VRX_CLK, 6/8/10/12 = VRX_SS1–4, 14/16 = SDA0/SCL0, 18/20 = CVBS_SEL0/1. На платах 1.2 и 3.3 ГГц X1.2/X1.4 = SCK/DAT — наоборот; с аппаратным SPI6 совпадает только 5.8 ГГц. [Review/vrx-board.md п. 1]","Шины I2C: I2C0 (82/80) — камера, ADV7280A-M и ADS1115 платы VRX, как собрано (плата VRX не меняется); I2C1 (58/56) — TCA9534A, INA219 U25 (перенести с I2C0) и датчики. [Review/vrx-board.md п. 9]","Подтяжки 4K7 к 5 В на платах VRX вместе с 1.8 кОм CM4 дают на I2C0 ≈ 3.77 В (расчёт) при пределе 3.8 В: плата VRX не меняется — уровень проверить на стенде. [Review/vrx-board.md п. 3]","GND-выводы 98, 197, 198 на носителе не на земле: CN1.98 без цепи, CN2.97/98 на цепи RG_OE (на PCB между ними дорожка) — соединить с GND, RG_OE удалить. [Review/website.md п. 13]","Имена цепей — как на носителе (SDA0/SCL0, SDA1/SCL1, +3V, +5V_CM, VRX_SS1–4, CAM0_*/CAM1_*), чтобы их находить в EasyEDA; описательные имена сайта — только где метки нет. Исключения: CRSF1_INV/CRSF2_INV вместо IO27/IO16, D0 вместо DO. [project]"]}]};
var DS_RU = {"(BCM2711 GPIO 0) GPIO: typically a 3.3V signal, but can be a 1.8V signal by connecting GPIO_VREF to CM4_1.8V":"(BCM2711 GPIO 0) GPIO: обычно сигнал 3.3 В; может быть 1.8 В, если GPIO_VREF подключён к CM4_1.8V","(BCM2711 GPIO 1) GPIO: typically a 3.3V signal, but can be a 1.8V signal by connecting GPIO_VREF to CM4_1.8V":"(BCM2711 GPIO 1) GPIO: обычно сигнал 3.3 В; может быть 1.8 В, если GPIO_VREF подключён к CM4_1.8V","1.8V ± 2.5%. Power Output max 300mA per pin for a total of 600mA. This will be powered down during power-off or GLOBAL_EN being set low":"1.8 В ± 2.5 %. Выход питания: не более 300 мА на вывод, 600 мА суммарно. Отключается при снятии питания или при низком уровне GLOBAL_EN","3.3V ± 2.5%. Power Output max 300mA per pin for a total of 600mA. This will be powered down during power-off or GLOBAL_EN being set low":"3.3 В ± 2.5 %. Выход питания: не более 300 мА на вывод, 600 мА суммарно. Отключается при снятии питания или при низком уровне GLOBAL_EN","4.75V-5.25V. Main power input":"4.75–5.25 В. Основной вход питания","A low on this pin forces booting from an RPI server (e.g. PC or a Raspberry Pi); if not used leave floating. Internally pulled up via 10kΩ to +3.3V":"Низкий уровень на этом выводе принудительно включает загрузку с хоста rpiboot (например, ПК или Raspberry Pi); если не используется — оставьте неподключённым. Внутренняя подтяжка к питанию (pull-up) 10 кОм на +3.3V","Active-low Ethernet activity indicator (CM4_3.3V signal): typically a green LED is connected to this pin. IOL = 8mA @ VOL< 0.4V":"Индикатор активности Ethernet, активный низкий уровень (сигнал CM4_3.3V): обычно к этому выводу подключён зелёный светодиод. IOL = 8 мА при VOL < 0.4 В","Active-low Ethernet speed indicator (CM4_3.3V signal): typically a yellow LED is connected to this pin. A low state indicates the 1Gbit or 100Mbit link: IOL = 8mA @ VOL < 0.4V":"Индикатор скорости Ethernet, активный низкий уровень (сигнал CM4_3.3V): обычно к этому выводу подключён жёлтый светодиод. Низкий уровень означает соединение 1 Гбит или 100 Мбит: IOL = 8 мА при VOL < 0.4 В","Active-low Ethernet speed indicator (CM4_3.3V signal): typically a yellow LED is connected to this pin. A low state indicates the 1Gbit or 10Mbit link: IOL = 8mA @ VOL < 0.4V":"Индикатор скорости Ethernet, активный низкий уровень (сигнал CM4_3.3V): обычно к этому выводу подключён жёлтый светодиод. Низкий уровень означает соединение 1 Гбит или 10 Мбит: IOL = 8 мА при VOL < 0.4 В","Active-low Pi activity LED. 20mA Max, 5V tolerant (VOL < 0.4V). (this is the signal that drives the green LED on the Raspberry Pi 4 Model B)":"Светодиод активности Pi, активный низкий уровень. Не более 20 мА, допускает 5 В (VOL < 0.4 В). (Этот же сигнал управляет зелёным светодиодом на Raspberry Pi 4 Model B)","Active-low output to drive Power On LED. This signal needs to be buffered.":"Выход с активным низким уровнем для светодиода «Питание». Сигнал требует буферизации.","Analogue input of the MXL7704: typically connected to CC pin of Type C power connector":"Аналоговый вход MXL7704: обычно подключается к выводу CC разъёма питания Type-C","Bidirectional HDMI0 SCL. Internally pulled up with a 1.8kΩ. 5V tolerant. (It can be connected directly to a HDMI connector; a small amount of ESD protection is provided on the CM4 by an on-board HDMI05-CL02F3)":"Двунаправленный HDMI0 SCL. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм. Допускает 5 В. (Можно подключать напрямую к разъёму HDMI; небольшая защита от ESD обеспечена на CM4 микросхемой HDMI05-CL02F3)","Bidirectional HDMI0 SDA. Internally pulled up with a 1.8kΩ. 5V tolerant. (It can be connected directly to a HDMI connector; a small amount of ESD protection is provided on the CM4 by an on-board HDMI05-CL02F3)":"Двунаправленный HDMI0 SDA. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм. Допускает 5 В. (Можно подключать напрямую к разъёму HDMI; небольшая защита от ESD обеспечена на CM4 микросхемой HDMI05-CL02F3)","Bidirectional HDMI1 SCL. Internally pulled up with a 1.8kΩ. 5V tolerant. (It can be connected directly to a HDMI connector; a small amount of ESD protection is provided on the CM4 by an on-board HDMI05-CL02F3)":"Двунаправленный HDMI1 SCL. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм. Допускает 5 В. (Можно подключать напрямую к разъёму HDMI; небольшая защита от ESD обеспечена на CM4 микросхемой HDMI05-CL02F3)","Bidirectional HDMI1 SDA. Internally pulled up with a 1.8kΩ. 5V tolerant. (It can be connected directly to a HDMI connector; a small amount of ESD protection is provided on the CM4 by an on-board HDMI05-CL02F3)":"Двунаправленный HDMI1 SDA. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм. Допускает 5 В. (Можно подключать напрямую к разъёму HDMI; небольшая защита от ESD обеспечена на CM4 микросхемой HDMI05-CL02F3)","Bidirectional pin. Can be driven low (via a 220Ω resistor) to reset the CM4 CPU. As an output, a high signals that power is good and CPU is running. Internally pulled up to +3.3V via 10kΩ":"Двунаправленный вывод. Низкий уровень (через резистор 220 Ом) сбрасывает CPU CM4. Как выход: высокий уровень означает, что питание в норме и CPU работает. Внутренняя подтяжка к питанию (pull-up) 10 кОм на +3.3V","Can be left floating; if driven low the Bluetooth interface will be disabled. Internally pulled up via 1.8kΩ to CM4_3.3V":"Можно оставить неподключённым; при низком уровне интерфейс Bluetooth отключается. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм на CM4_3.3V","Can be left floating; if driven low the wireless interface will be disabled. Internally pulled up via 1.8kΩ to CM4_3.3V":"Можно оставить неподключённым; при низком уровне беспроводной интерфейс (Wi-Fi) отключается. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм на CM4_3.3V","Connect to CM4_3.3V to force SD card/eMMC interface to 1.8V signalling instead of 3.3V, otherwise leave unconnected. Typically only used if external eMMC is connected.":"Подключите к CM4_3.3V, чтобы перевести интерфейс SD-карты/eMMC на уровни 1.8 В вместо 3.3
