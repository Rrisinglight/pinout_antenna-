<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CM4 baseboard — 2×100-pin pinout</title>
<style>
:root{
  --font:system-ui,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --fg:#0d0d0d;--fg2:#525252;--bg:#f5f5f5;--bg2:#ebebeb;--bg3:#d9d9d9;
  --bd:#1a1a1a;--bd2:#737373;--bd3:#a3a3a3;--sel:#0d0d0d;
  --r:10px;--focus:0 0 0 2px var(--bg),0 0 0 4px #404040;
}
@media (prefers-color-scheme:dark){:root{
  --fg:#f0f0f0;--fg2:#a3a3a3;--bg:#141414;--bg2:#1f1f1f;--bg3:#2a2a2a;
  --bd:#e5e5e5;--bd2:#737373;--bd3:#404040;--sel:#ffffff;--focus:0 0 0 2px #141414,0 0 0 4px #a3a3a3;
}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:1rem clamp(16px,3vw,24px) 2rem;font-family:var(--font);color:var(--fg);background:var(--bg);line-height:1.45}
.w{max-width:1360px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{margin:0;font-size:clamp(1.05rem,2.5vw,1.3rem);font-weight:600;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--fg2)}
.seg{display:inline-flex;border:1.5px solid var(--bd3);border-radius:20px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:5px 12px;border:0;background:transparent;color:var(--fg2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:none;box-shadow:var(--focus)}
.legend{display:flex;flex-wrap:wrap;gap:5px 8px;margin-bottom:12px}
.lg{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;color:var(--fg2);background:var(--bg2)}
.lg:hover{border-color:var(--bd2)}.lg:focus-visible{outline:none;box-shadow:var(--focus)}
.lg[aria-pressed="true"]{border-color:var(--bd);background:var(--bg3);color:var(--fg)}
.lg .d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1280px){.main{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.board-wrap{overflow-x:auto}
#board{display:block;min-width:860px;width:100%;height:auto}
.pad{cursor:pointer}
.pad rect{stroke:transparent;stroke-width:2;transition:opacity .12s}
.pad text{font-family:var(--mono);font-size:7px;fill:#fff;text-anchor:middle;pointer-events:none;user-select:none}
.pad.dim rect,.pad.dim text{opacity:.15}
.pad.mate rect{stroke:var(--sel);stroke-width:2;stroke-dasharray:3 2}
.pad.dnc rect{stroke:#c33}
.pad.opt rect{stroke:var(--fg2);stroke-dasharray:2 2}
.pad.sel rect{stroke:var(--sel);stroke-width:3}
.lbl{font-family:var(--font);font-size:11px;fill:var(--fg2)}.lbl.b{fill:var(--fg);font-weight:600}.lbl.s{font-size:9px}
#outline{fill:var(--bg2);stroke:var(--bd2);stroke-width:1.5}
.hole{fill:var(--bg);stroke:var(--bd2)}
.conn{fill:var(--bg3);stroke:var(--bd2)}
.pin1{fill:var(--fg)}
.soc{fill:var(--bg3);stroke:var(--bd3)}
.ant{fill:url(#hatch);stroke:var(--bd2);stroke-dasharray:4 3}
.ufl{fill:none;stroke:var(--bd2)}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.side,.board-wrap,.tbl-wrap{scrollbar-width:thin;scrollbar-color:transparent transparent}
.side:hover,.board-wrap:hover,.tbl-wrap:hover{scrollbar-color:var(--bd3) transparent}
.side::-webkit-scrollbar,.board-wrap::-webkit-scrollbar,.tbl-wrap::-webkit-scrollbar{width:8px;height:8px}
.side::-webkit-scrollbar-track,.board-wrap::-webkit-scrollbar-track,.tbl-wrap::-webkit-scrollbar-track{background:transparent}
.side::-webkit-scrollbar-thumb,.board-wrap::-webkit-scrollbar-thumb,.tbl-wrap::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
.side:hover::-webkit-scrollbar-thumb,.board-wrap:hover::-webkit-scrollbar-thumb,.tbl-wrap:hover::-webkit-scrollbar-thumb{background:var(--bd3)}
.card{background:var(--bg2);border:1px solid var(--bd3);border-radius:var(--r);padding:12px 14px;font-size:13px}
.card .ph{color:var(--fg2)}
.card h2{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600}
.card ul{padding-left:18px;margin:6px 0}.card li{margin:4px 0}
.card ul.plain{padding-left:0;list-style:none}
.pn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;color:#fff;font-size:12px;font-weight:600}
.muted{color:var(--fg2);font-weight:400;font-size:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin:8px 0}
.kv dt{color:var(--fg2)}.kv dd{margin:0}code{font-family:var(--mono);font-size:12px}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;color:#fff;font-size:11px;font-weight:500}
.dsq{margin:6px 0;padding:8px 10px;border-left:3px solid var(--bd3);background:var(--bg);font-size:12px;color:var(--fg2)}
.dsq b{color:var(--fg)}
.dsq-en{margin-top:4px;font-size:11px;opacity:.75}
.alt{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
.alt th,.alt td{border:1px solid var(--bd3);padding:2px 5px;text-align:left;font-family:var(--mono)}
.alt th{font-family:var(--font);color:var(--fg2);font-weight:500}
.alt td.on{background:var(--bg3);font-weight:700}
.linkbtn{font:inherit;font-size:12px;border:1px solid var(--bd3);background:var(--bg);color:var(--fg);border-radius:6px;padding:1px 7px;cursor:pointer}
.card .close{display:none;margin-left:auto}
.src{color:var(--fg2);font-size:11px}
#general{margin-top:16px;font-size:13px}
#general h2{font-size:15px;margin:0 0 6px}
#general .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 24px}
#general h3{font-size:13px;margin:8px 0 4px}
#general ul{padding-left:18px;margin:4px 0}#general li{margin:3px 0}
.tbl-sec{margin-top:16px}
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px;color:var(--fg2)}
#csv{font:inherit;font-size:12px;padding:4px 10px;border:1.5px solid var(--bd3);border-radius:20px;background:var(--bg2);color:var(--fg);cursor:pointer}
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd3);border-radius:var(--r)}
@media (min-width:1280px){.tbl-wrap{overflow:clip}}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 8px;border-bottom:1px solid var(--bd3);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--bg2);color:var(--fg2);font-weight:500;white-space:nowrap;z-index:1}
td.mono{font-family:var(--mono);white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg2)}tr.row.sel{background:var(--bg3)}
tr.row[hidden]{display:none}
td.txt{min-width:280px;color:var(--fg2)}
body.layer-ds .prj{display:none}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
dialog{border:1px solid var(--bd3);border-radius:var(--r);background:var(--bg);color:var(--fg);max-width:min(90vw,700px)}
dialog textarea{width:100%;height:50vh;font-family:var(--mono);font-size:11px}
@media (max-width:1279px){
  body.has-sel .side{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:50vh;z-index:10;box-shadow:0 -4px 16px rgba(0,0,0,.25);background:var(--bg);padding:8px;gap:8px}
  body.has-sel .card .close{display:inline-block}
}
</style>
</head>
<body class="layer-ds">
<div class="w">
  <header class="top">
    <div>
      <h1>CM4 baseboard — 2×100-pin pinout</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="seg" role="group" aria-label="Layer">
      <button type="button" data-layer="ds" aria-pressed="true">Datasheet</button>
      <button type="button" data-layer="prj" aria-pressed="false">Project</button>
    </div>
  </header>
  <div class="legend" id="leg" role="toolbar" aria-label="Filter"></div>
  <div class="main">
    <div>
      <div class="board-wrap"><svg id="board" viewBox="0 0 1000 560" role="group" aria-label="Разъёмы CM4, вид сверху"></svg></div>
      <section id="general" aria-label="Layout notes"><h2>Layout notes</h2><div class="cols" id="general-cols"></div></section>

        <div class="tbl-head"><span id="cnt"></span><button type="button" id="csv">Copy CSV</button></div>
        <div class="tbl-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>

    </div>

    </aside>
  </div>
</div>

плекс: буфер направления + инвертор на baseboard. Overlay: dtoverlay=uart4 плюс overlay только с RTS для GPIO11."},"40":{"net":"UART4_RXD","dev":"CRSF2","mode":"ALT4 RXD4","note":"От CRSF TX2."},"44":{"net":"CVBS_SEL1","dev":"CVBS","mode":"GPIO","note":"Выбор коммутатора CVBS 4→1, бит 1. При загрузке подтяжка к земле (pull-down). Этот вывод — CTS4: штатный overlay uart4,ctsrts забрал бы его — используйте overlay только с RTS."},"38":{"net":"CRSF2_DIR","dev":"CRSF2","mode":"ALT4 RTS4","note":"Направление полудуплекса для TX2 — та же схема, что у CRSF1_DIR (RTS4 в режиме RS-485 или обычный GPIO)."},"31":{"net":"UART5_TXD","dev":"SERVO","mode":"ALT4 TXD5","note":"К шине сервоприводов ST3025 (2 сервопривода, 1 Мбит/с, один провод). Автоматическое направление на baseboard (буфер, управляемый от TX, как внутри Waveshare Bus Servo Adapter (A)); GPIO направления нет. Overlay: dtoverlay=uart5."},"28":{"net":"UART5_RXD","dev":"SERVO","mode":"ALT4 RXD5","note":"От шины сервоприводов."},"55":{"net":"UART0_TXD","dev":"CONSOLE","mode":"ALT0 TXD0","note":"Сервисная консоль на 3-контактном штыревом разъёме (GND, TXD, RXD), 3.3 В. Единственный UART, в который пишет загрузчик (BOOT_UART=1); консоль ядра по умолчанию (console=serial0). Восстановление в полевых условиях без монитора."},"51":{"net":"UART0_RXD","dev":"CONSOLE","mode":"ALT0 RXD0","note":"Вход консоли."},"29":{"net":"CRSF2_INV","dev":"CRSF2","mode":"GPIO","note":"Выбор инверсии сигнала для TX2 (XOR или мультиплексор на baseboard). При загрузке подтяжка к земле (pull-down)."},"50":{"net":"TX1_PWR_EN","dev":"PWRKEY","mode":"GPIO","note":"Разрешение ключа питания CRSF TX1 (12 В, ВЧ-мощность до 2 Вт). Подтяжка к земле (pull-down) при загрузке держит модуль выключенным, пока ПО его не включит; поставьте подтяжку к земле и на затворе ключа."},"49":{"net":"FAN_PWM","dev":"FAN","mode":"ALT5 PWM0_0","note":"ШИМ вентилятора, аппаратный PWM0, канал 0 (dtoverlay=pwm,pin=18,func=2). При загрузке низкий уровень: если вентилятор должен работать до старта ПО, добавьте подтяжку к питанию (pull-up) на входе драйвера."},"26":{"net":"TX2_PWR_EN","dev":"PWRKEY","mode":"GPIO","note":"Разрешение ключа питания CRSF TX2. Подтяжка к земле (pull-down) при загрузке = выключен."},"27":{"net":"VRX_DATA","dev":"VRX","mode":"ALT3 SPI6_MOSI","note":"Общая линия DATA четырёх приёмников (типа RTC6705, 25-битные слова только на запись). Аппаратный SPI6: dtoverlay=spi6-1cs,cs0_pin=22 (CS0 по умолчанию = GPIO18 занят под FAN_PWM) — либо программный SPI (bit-bang)."},"25":{"net":"VRX_CLK","dev":"VRX","mode":"ALT3 SPI6_SCLK","note":"Общая линия CLK четырёх приёмников."},"46":{"net":"VRX_LE1","dev":"VRX","mode":"GPIO","note":"LE приёмника 1: низкий во время сдвига, защёлкивание по нарастающему фронту (= выбор кристалла с активным низким уровнем). При загрузке подтяжка к земле (pull-down)."},"47":{"net":"VRX_LE2","dev":"VRX","mode":"GPIO","note":"LE приёмника 2."},"45":{"net":"VRX_LE3","dev":"VRX","mode":"GPIO","note":"LE приёмника 3."},"41":{"net":"VRX_LE4","dev":"VRX","mode":"GPIO","note":"LE приёмника 4."},"24":{"net":"FAN_TACH","dev":"FAN","mode":"GPIO","note":"Вход тахометра вентилятора. У вентилятора выход с открытым коллектором — добавьте подтяжку к питанию (pull-up) на baseboard; внутренних 47 кОм для длинного кабеля мало."},"48":{"net":"CRSF1_INV","dev":"CRSF1","mode":"GPIO","note":"Выбор инверсии сигнала для TX1 (XOR или мультиплексор на baseboard). При загрузке подтяжка к земле (pull-down)."},"78":{"net":"CM4_3V3","dev":"POWER","note":"GPIO_VREF: соедините с CM4_3.3V (выводы 84/86) для GPIO 3.3 В. Нельзя оставлять неподключённым или заземлять — CM4 не запустится."},"80":{"net":"I2C0_SCL","dev":"CSI0","note":"Тактовый сигнал I2C0 камеры/декодера (BCM GPIO45): к FFC камеры CSI0 и к ADV7280A-M на CSI1. Подтяжка к питанию (pull-up) 1.8 кОм на CM4."},"82":{"net":"I2C0_SDA","dev":"CSI0","note":"Данные I2C0 камеры/декодера (BCM GPIO44). Ведомые устройства: модуль камеры CSI0, ADV7280A-M по адресу 0x21 (ALSB высокий) или 0x20 (ALSB низкий). Подтяжка к питанию (pull-up) 1.8 кОм на CM4."},"89":{"net":"WL_nDISABLE","dev":"CTRL","status":"opt","note":"Перемычка на GND отключает Wi-Fi (рядом модуль ELRS 2.4 ГГц). Подтяжка к питанию (pull-up) 1.8 кОм на CM4; как вход сообщает состояние модуля."},"91":{"net":"BT_nDISABLE","dev":"CTRL","status":"opt","note":"Перемычка на GND отключает Bluetooth. Подтяжка к питанию (pull-up) 1.8 кОм на CM4."},"92":{"net":"RUN_PG","dev":"CTRL","note":"Кнопка сброса: на GND через 220 Ом. Как выход: высокий = питание в норме и CPU работает (светодиод — через буфер). Внутренняя подтяжка к питанию (pull-up) 10 кОм на 3.3 В."},"93":{"net":"nRPIBOOT","dev":"CTRL","note":"Перемычка или кнопка на GND принудительно включает загрузку по USB (rpiboot: прошивка eMMC, восстановление). Должен стать низким не позднее 2 мс после нарастания +5V. Внутренняя подтяжка к питанию (pull-up) 10 кОм."},"95":{"net":"PWR_nLED","dev":"CTRL","status":"opt","note":"Светодиод питания, активный низкий уровень, по даташиту требует буфера (транзистор)."},"97":{"net":"CAM_GPIO","dev":"CSI0","note":"К FFC камеры CSI0 (включение / выключение камеры). Не переназначайте."},"99":{"net":"GLOBAL_EN","dev":"CTRL","note":"От схемы перезагрузки по Ethernet (независимой от CM4), только открытый сток. Низкий = CM4 полностью выключен (15 мкА), выходы 3.3 В и 1.8 В пропадают; отпускание = холодный старт. Внутренняя подтяжка к питанию (pull-up) 100 кОм на +5V с RC-задержкой."},"100":{"net":"EXT_nRST","dev":"CTRL","status":"opt","note":"Выход: низкий во время сброса, высокий (3.3 В) после старта CPU. Может сбрасывать периферию, например USB-хаб."},"101":{"net":"USB_OTG_ID","dev":"USB","note":"Соедините с GND для фиксированной роли хоста (нужен драйвер ОС). Для rpiboot нужен прямой путь USB CM4 ↔ ПК в режиме устройства: переключатель или перемычка между upstream-портом хаба и сервисным портом (на усмотрение схемотехника)."},"103":{"net":"USB_DN","dev":"USB","note":"USB 2.0 D−, пара 90 Ом, разбег длин внутри пары — не более 0.15 мм. К upstream-порту хаба USB 2.0 (2 внешних порта, LTE-модем, резерв) / сервисному порту rpiboot. ОС: otg_mode=1."},"105":{"net":"USB_DP","dev":"USB","note":"USB 2.0 D+, пара 90 Ом."},"102":{"net":"PCIE_CLKREQ_N","dev":"PCIE","note":"К M.2 CLKREQ#. Обязателен: без него CM4 не выдаёт REFCLK. Внутренняя подтяжка к питанию (pull-up)."},"109":{"net":"PCIE_RST_N","dev":"PCIE","note":"К M.2 PERST#. Обязателен для корректного сброса SSD."},"110":{"net":"PCIE_REFCLK_P","dev":"PCIE","note":"К M.2 REFCLK+, 100 МГц, пара 90 Ом, разбег длин внутри пары — не более 0.1 мм. Разделительный конденсатор уже стоит на CM4."},"112":{"net":"PCIE_REFCLK_N","dev":"PCIE","note":"К M.2 REFCLK−."},"116":{"net":"PCIE_RX_P","dev":"PCIE","note":"От M.2 PERp0 (передатчик SSD). Пара 90 Ом. Разделительные конденсаторы — на стороне SSD (на картах NVMe они есть)."},"118":{"net":"PCIE_RX_N","dev":"PCIE","note":"От M.2 PERn0."},"122":{"net":"PCIE_TX_P","dev":"PCIE","note":"К M.2 PETp0. Пара 90 Ом. Разделительный конденсатор уже стоит на CM4."},"124":{"net":"PCIE_TX_N","dev":"PCIE","note":"К M.2 PETn0."},"128":{"net":"CSI0_D0_N","dev":"CSI0","note":"К FFC камеры (CSI0, 2 линии (lane)), пара 100 Ом. CM4IO использует 22-контактный FFC с шагом 0.5 мм; камеры Raspberry Pi — 15-контактный с шагом 1.0 мм (переходной шлейф)."},"130":{"net":"CSI0_D0_P","dev":"CSI0","note":"К FFC камеры, пара 100 Ом."},"134":{"net":"CSI0_D1_N","dev":"CSI0","note":"К FFC камеры, пара 100 Ом."},"136":{"net":"CSI0_D1_P","dev":"CSI0","note":"К FFC камеры, пара 100 Ом."},"140":{"net":"CSI0_CLK_N","dev":"CSI0","note":"К FFC камеры, пара 100 Ом. ПО: штатные варианты overlay cam0 ожидают I2C камеры на GPIO0/1; здесь I2C0 на выводах 82/80, поэтому overlay должен ссылаться на i2c_csi_dsi (правка в одну строку)."},"142":{"net":"CSI0_CLK_P","dev":"CSI0","note":"К FFC камеры, пара 100 Ом."},"115":{"net":"CSI1_D0_N","dev":"VDEC","note":"От ADV7280A-M D0N (вывод 10), пара 100 Ом. Однолинейный (single-lane) канал CSI-2. Overlay: dtoverlay=adv728x-m,adv7280m=1 (по умолчанию нацелен на CSI1 и I2C0 на выводах 82/80)."},"117":{"net":"CSI1_D0_P","dev":"VDEC","note":"От ADV7280A-M D0P (вывод 9), пара 100 Ом."},"127":{"net":"CSI1_CLK_N","dev":"VDEC","note":"От ADV7280A-M CLKN (вывод 12), пара 100 Ом."},"129":{"net":"CSI1_CLK_P","dev":"VDEC","note":"От ADV7280A-M CLKP (вывод 11), пара 100 Ом."},"121":{"net":"","dev":"VDEC","status":"nc","note":"CSI1, линия (lane) D1 — не используется однолинейным ADV7280A-M. Оставьте неподключённым."},"123":{"net":"","dev":"VDEC","status":"nc","note":"CSI1, линия (lane) D1 — не используется. Оставьте неподключённым."},"133":{"net":"","dev":"VDEC","status":"nc","note":"CSI1, линия (lane) D2 — не используется. Оставьте неподключённым."},"135":{"net":"","dev":"VDEC","status":"nc","note":"CSI1, линия (lane) D2 — не используется. Оставьте неподключённым."},"139":{"net":"","dev":"VDEC","status":"nc","note":"CSI1, линия (lane) D3 — не используется. Оставьте неподключённым."},"141":{"net":"","dev":"VDEC","status":"nc","note":"CSI1, линия (lane) D3 — не используется. Оставьте неподключённым."}}};
var ROUTING = {"groups":{"GND":["Подключите все выводы GND на обоих разъёмах; ни один вывод земли не оставляйте неподключённым. [DS §4]"],"PWR5":["+5V — основной вход питания, 4.75–5.25 В. Подключите все шесть выводов +5V (77, 79, 81, 83, 85, 87) к одной шине. [project]","Заложите в бюджет +5V типовой рабочий ток 1.4 А (400 мА в простое); реальное значение зависит от вычислительной нагрузки. [DS §5.3]","Нагрузка, снимаемая с выходов CM4_3.3V и CM4_1.8V, не входит в указанные токи потребления CM4; прибавьте её к бюджету +5V. [DS §5.4]"],"PWR33":["Выход CM4_3.3V (выводы 84, 86): 3.3 В ± 2.5 %, не более 300 мА на вывод, 600 мА суммарно. Выключен при снятом питании и пока GLOBAL_EN в низком уровне. [DS Table 6]","На этой плате CM4_3.3V питает только GPIO_VREF и светодиоды состояния; мощные нагрузки 3.3 В питайте от отдельного стабилизатора, запитанного от +5V. [project]"],"PWR18":["CM4_1.8V (выводы 88, 90) на этой плате не используется: оба вывода оставьте неподключёнными. [project]"],"GPIO":["Уровень GPIO задаётся GPIO_VREF (вывод 78) = 3.3 В на этой плате; входы не допускают 5 В (абсолютный максимум VGPIO_VREF + 0.5 В): любой источник 5 В подключайте через преобразователь уровня. [DS Table 3]","Суммарную нагрузку на 28 выводов GPIO держите ниже 50 мА. [DS §2.5]","Установите ток выходного драйвера (drive strength) и скорость нарастания фронта (slew rate) минимально достаточными для нагрузки (программная настройка), чтобы снизить проблемы ЭМС. [DS §2.5]","Внутренняя подтяжка GPIO к питанию/к земле (pull-up/pull-down) — типично 47 кОм (33–73 кОм при 3.3 В); там, где нужна более сильная подтяжка, установите внешний резистор. [DS Table 4]","Каждый GPIO при включении питания имеет фиксированную подтяжку к питанию или к земле (pull-up/pull-down; показана в карточке выбранного вывода); там, где по примечанию проекта нужен определённый уровень до старта ПО, поставьте внешнюю подтяжку на baseboard. [BCM2711 §5.3]"],"ETH":["Разведите четыре пары Ethernet как дифференциальные пары с дифференциальным волновым сопротивлением 100 Ом и достаточным зазором до соседних дорожек. [DS §2.2]","Разбег длин внутри каждой пары Ethernet (P и N) — не более 0.15 мм. [DS §2.2]","Разбег длин между парами допускается до 50 мм, поэтому межпарное выравнивание обычно не нужно. [DS §2.2]","PHY (BCM54210PE) сам компенсирует перекрёстное включение MDI, разбег между парами и полярность: перекрещивать пары не нужно. [DS §2.2]","На этой плате связь PHY–PHY с портом Ethernet-коммутатора, а не с MagJack; трансформаторная или ёмкостная развязка — на усмотрение схемотехника. [project]"],"SD":["Вариант с eMMC: интерфейс SD/eMMC (выводы 57–75) наружу не выведен. Все выводы SD оставьте неподключёнными. [project]"],"USB":["Разведите USB_N/USB_P (выводы 103/105) как дифференциальную пару с дифференциальным волновым сопротивлением 90 Ом; разбег длин внутри пары — не более 0.15 мм. [DS §2.4]","USB по умолчанию отключён прошивкой; включите его строкой otg_mode=1 в config.txt. [DS §2.4]","Пара идёт на upstream-порт хаба USB 2.0 (2 внешних порта, LTE-модем, резерв) и на сервисный порт rpiboot. [project]"],"PCIE":["Разведите три пары PCIe (REFCLK, TX, RX) как дифференциальные пары с дифференциальным волновым сопротивлением 90 Ом и достаточным зазором до соседних дорожек. [DS §2.3]","Разбег длин внутри каждой пары PCIe (P и N) — не более 0.1 мм. Выравнивание длин между парами не требуется. [DS §2.3]","Разделительные конденсаторы: для CLK и TX они стоят на CM4; паре RX нужны внешние конденсаторы рядом с передатчиком устройства — на карте NVMe они уже установлены на самой карте. [DS §2.3]","Соответствие M.2 на этой плате: CM4 TX (выводы 122/124) → PETp0/PETn0, CM4 RX (выводы 116/118) ← PERp0/PERn0, REFCLK (110/112) → REFCLK+/−. [project]","PCIe_CLK_nREQ (вывод 102) обязателен: без него CM4 не выдаёт тактовый сигнал. Подключите PCIe_nRST (вывод 109), чтобы устройство сбрасывалось корректно. [DS §2.3]","Соедините вывод 102 с M.2 CLKREQ#, а вывод 109 — с M.2 PERST#. [project]"],"CSI0":["Разведите CSI0 — 2 линии данных (lane) и тактовую пару — как дифференциальные пары с дифференциальным волновым сопротивлением 100 Ом; разбег длин внутри пары — не более 0.15 мм. [DS §2.7]","CSI0 идёт на FFC камеры. Плата CM4IO использует 22-контактный FFC с шагом 0.5 мм; камерные модули Raspberry Pi — 15-контактный с шагом 1.0 мм (переходной шлейф). [project]","Шина управления камерой — I2C0 (выводы 82/80); разведите её на FFC вместе с Camera_GPIO (вывод 97). [project]"],"CSI1":["Разведите CSI1 как дифференциальные пары с дифференциальным волновым сопротивлением 100 Ом; разбег длин внутри пары — не более 0.15 мм. [DS §2.7]","Используются только линия (lane) D0 (выводы 115/117) и тактовая пара (127/129): однолинейный (single-lane) канал от ADV7280A-M. D1–D3 (121/123, 133/135, 139/141) оставьте неподключёнными. [project]"],"HDMI0":["HDMI0 на этой плате не используется: все выводы HDMI0 оставьте неподключёнными. [project]"],"HDMI1":["HDMI1 на этой плате не используется: все выводы HDMI1 оставьте неподключёнными. [project]"],"DSI0":["DSI0 на этой плате не используется: все выводы DSI0 оставьте неподключёнными. [project]"],"DSI1":["DSI1 на этой плате не используется: все выводы DSI1 оставьте неподключёнными. [project]"],"I2C0":["SDA0/SCL0 (выводы 82/80, BCM2711 GPIO44/45) уже имеют на CM4 подтяжки к питанию (pull-up) 1.8 кОм на CM4_3.3V: сильных внешних подтяжек не добавляйте. [DS Table 6]","На этой шине два ведомых устройства: камера CSI0 (через FFC) и декодер ADV7280A-M по адресу 0x21 (ALSB высокий) или 0x20 (ALSB низкий). [project]"],"CTRL":["Все входы CTRL (выводы 20, 89, 91, 92, 93, 99) имеют внутреннюю подтяжку к питанию (pull-up): неиспользуемые оставьте неподключёнными; коммутируйте только на GND (перемычка, кнопка или драйвер с открытым стоком; RUN_PG — через 220 Ом). [DS Table 6]"],"RSV":["Зарезервированные выводы 76, 104, 106: ничего к ним не подключайте. [DS Table 6]"],"VDAC":["Композитный ТВ-выход (VDAC_COMP, вывод 111) на этой плате не используется: оставьте неподключённым. [project]"],"ANALOG":["AnalogIP0/1 (выводы 96/94, входы MXL7704 для USB-C CC): USB-C PD на этой плате нет, оба оставьте неподключёнными. [project]"]},"pins":{"15":["Выход светодиода Ethernet, активный низкий уровень, втекающий ток ≤ 8 мА при VOL < 0.4 В: анод светодиода через последовательный резистор на CM4_3.3V (выводы 84/86) — не на шину baseboard, которая остаётся под напряжением при выключенном CM4 (обратное питание через сигнальную линию). [DS Table 6]","На этой плате необязателен. [project]"],"16":["Вход IEEE 1588 SYNC, на этой плате не используется: оставьте неподключённым. [project]"],"17":["Выход светодиода Ethernet, активный низкий уровень, втекающий ток ≤ 8 мА при VOL < 0.4 В: анод светодиода через последовательный резистор на CM4_3.3V (выводы 84/86) — не на шину baseboard, которая остаётся под напряжением при выключенном CM4 (обратное питание через сигнальную линию). [DS Table 6]","На этой плате необязателен. [project]"],"18":["Выход IEEE 1588 SYNC, на этой плате не используется: оставьте неподключённым. [project]"],"19":["Выход светодиода Ethernet, активный низкий уровень, втекающий ток ≤ 8 мА при VOL < 0.4 В: анод светодиода через последовательный резистор на CM4_3.3V (выводы 84/86) — не на шину baseboard, которая остаётся под напряжением при выключенном CM4 (обратное питание через сигнальную линию). [DS Table 6]","На этой плате необязателен. [project]"],"20":["Оставьте неподключённым (внутренняя подтяжка к питанию (pull-up) 100 кОм на CM4_3.3V, VIL < 0.8 В) или заземлите, чтобы защитить EEPROM загрузчика от записи. [DS Table 6]","Для защиты от записи EEPROM_nWP должен быть в низком уровне ещё до подачи питания. [DS §5.1]","В серийном изделии притяните его к низкому уровню, чтобы конечный пользователь не мог изменить содержимое EEPROM. [DS §2.18]"],"21":["Светодиод активности, активный низкий уровень: не более 20 мА, допускает 5 В, VOL < 0.4 В. [DS Table 6]","При сбое загрузки этот светодиод мигает кодом ошибки; оставьте его видимым для сервисного обслуживания. [DS §2.16]"],"24":["Вход тахометра вентилятора: у вентилятора выход с открытым коллектором — добавьте подтяжку к питанию (pull-up) на baseboard; внутренних 47 кОм для длинного кабеля мало. [project]"],"26":["Разрешение ключа питания TX2: подтяжка к земле (pull-down) при загрузке держит модуль выключенным; на затворе ключа такая же подтяжка к земле, как у TX1 (вывод 50). [project]"],"49":["ШИМ вентилятора (PWM0, канал 0). При загрузке низкий уровень: если вентилятор должен работать до старта ПО, добавьте подтяжку к питанию (pull-up) на входе драйвера. [project]"],"50":["Разрешение ключа питания TX1 (12 В, ВЧ-мощность до 2 Вт): подтяжка к земле (pull-down) при загрузке держит модуль выключенным; поставьте подтяжку к земле и на затворе ключа. [project]"],"51":["Сервисная консоль RXD0, на том же 3-контактном штыревом разъёме, что и вывод 55. [project]"],"55":["Сервисная консоль TXD0: 3-контактный штыревой разъём (GND, TXD, RXD) вместе с выводом 51, 3.3 В. [project]"],"56":["SCL1, шина датчиков: подтяжка к питанию (pull-up) 1.8 кОм уже есть на CM4 — сильных внешних подтяжек не добавляйте. [project]"],"58":["SDA1, шина датчиков: подтяжка к питанию (pull-up) 1.8 кОм уже есть на CM4 — сильных внешних подтяжек не добавляйте. [project]"],"78":["Соедините GPIO_VREF с CM4_3.3V (выводы 84 и 86). Нельзя оставлять неподключённым и нельзя заземлять: без него CM4 не запускается. [DS Table 6]"],"80":["Разведите на FFC камеры CSI0 и на SCL ADV7280A-M (U1, вывод 31). [sdtv2csi]"],"82":["Разведите на FFC камеры CSI0 и на SDA ADV7280A-M (U1, вывод 30). [sdtv2csi]"],"89":["WL_nDisable: внутренняя подтяжка к питанию (pull-up) 1.8 кОм на CM4_3.3V; можно оставить неподключённым. [DS Table 6]","Замкните на землю или подайте низкий уровень, чтобы держать радиомодуль обесточенным; если вывод используется для контроля состояния, высокий уровень = модуль запитан. [DS §2.1.1]","Поставьте перемычку на GND, чтобы Wi-Fi можно было отключить, когда рядом установлен модуль ELRS 2.4 ГГц. [project]"],"91":["BT_nDisable: внутренняя подтяжка к питанию (pull-up) 1.8 кОм на CM4_3.3V; можно оставить неподключённым. [DS Table 6]","Замкните на землю или подайте низкий уровень, чтобы держать модуль Bluetooth обесточенным; если вывод используется для контроля состояния, высокий уровень = модуль запитан. [DS §2.1.2]","Поставьте перемычку на GND. [project]"],"92":["Вход сброса: притягивайте к GND через резистор 220 Ом (кнопка или драйвер с открытым стоком). Внутренняя подтяжка к питанию (pull-up) 10 кОм на +3.3V. [DS Table 6]","Как выход: высокий уровень = питание в норме и CPU работает. Светодиод «работа» подключайте через буфер, не напрямую. [project]","Сброс через RUN_PG не закрывает открытые файлы; применяйте с осторожностью. [DS §2.14]"],"93":["Низкий уровень принудительно включает загрузку с USB-хоста (rpiboot) вместо eMMC; для этого он должен стать низким не позднее 2 мс после нарастания +5V. [DS §5.1]","Внутренняя подтяжка к питанию (pull-up) 10 кОм на +3.3V; если не используется — оставьте неподключённым. [DS Table 6]","Поставьте перемычку или кнопку на GND: это путь для прошивки eMMC и восстановления. [DS §6.2]"],"95":["Необязательный светодиод питания: выход с активным низким уровнем, требует буфера (транзистор) — напрямую светодиодом управлять не может. [DS §2.17]"],"97":["Camera_GPIO: обычно используется для выключения камеры. Переназначать этот вывод не рекомендуется. Уровни сигнала CM4_3.3V. [DS Table 6]","Разведите на FFC камеры CSI0. [project]"],"99":["Низкий уровень выключает питание CM4; внутренняя подтяжка к питанию (pull-up) 100 кОм на +5V. [DS Table 6]","При низком GLOBAL_EN CM4 потребляет 15 мкА (состояние минимального потребления). [DS Table 5]","После программного выключения удерживайте его в низком уровне дольше 1 мс, чтобы перезапустить систему питания; притягивайте к низкому только после завершения работы ОС. [DS §2.13]","Управляется только открытым стоком, от схемы перезагрузки по Ethernet (независимой от CM4); пока низкий — выходы 3.3 В и 1.8 В пропадают, отпускание = холодный старт. [project]"],"100":["Только выход: низкий во время сброса, высокий (CM4_3.3V) после начала загрузки CPU. [DS Table 6]","Необязательно: используйте для сброса периферии, например USB-хаба. [project]"],"101":["Для фиксированной роли (только хост или только устройство) соедините USB_OTG_ID с GND; есть внутренняя подтяжка к питанию (pull-up); драйвер ОС должен соответствовать выбранной роли. [DS §2.4]","Для rpiboot нужен прямой путь USB CM4 ↔ ПК в режиме устройства: переключатель или перемычка между upstream-портом хаба и сервисным портом (на усмотрение схемотехника). [project]"],"102":["Вход 3.3 В, низкий уровень = запрос тактового сигнала; внутренняя подтяжка к питанию (pull-up). [DS Table 6]","Соедините с M.2 CLKREQ#. [project]"],"109":["Выход +3.3V, активный низкий уровень. [DS Table 6]","Соедините с M.2 PERST# (корректный сброс SSD). [project]"],"110":["Выход тактового сигнала PCIe, положительный, 100 МГц → M.2 REFCLK+ (в паре с выводом 112). [project]"],"112":["Выход тактового сигнала PCIe, отрицательный, 100 МГц → M.2 REFCLK− (в паре с выводом 110). [project]"],"115":["CSI1 D0− от ADV7280A-M D0N (U1, вывод 10), в паре с выводом 117. Однолинейный (single-lane) канал CSI-2. [sdtv2csi]"],"116":["Соедините с M.2 PERp0 (передатчик SSD; сигнал идёт от него к CM4), в паре с выводом 118. [project]"],"117":["CSI1 D0+ от ADV7280A-M D0P (U1, вывод 9), в паре с выводом 115. [sdtv2csi]"],"118":["Соедините с M.2 PERn0 (сигнал идёт от него к CM4), в паре с выводом 116. [project]"],"122":["Соедините с M.2 PETp0, в паре с выводом 124. [project]"],"124":["Соедините с M.2 PETn0, в паре с выводом 122. [project]"],"127":["CSI1, тактовый сигнал, отрицательный (clock−): от ADV7280A-M CLKN (U1, вывод 12), в паре с выводом 129. [sdtv2csi]"],"129":["CSI1, тактовый сигнал, положительный (clock+): от ADV7280A-M CLKP (U1, вывод 11), в паре с выводом 127. [sdtv2csi]"]},"general":[{"title":"Механика и разъёмы","items":["Модуль 55 × 40 мм, высота 4.7 мм; плата 1.2 мм ± 10 %. Четыре крепёжных отверстия M2.5 с отступом 3.5 мм от краёв модуля. [DS §3.1]","Две 100-контактные розетки (ответные части) Hirose DF40 на baseboard: DF40C-100DS-0.4V для высоты стека 1.5 мм (зазор под CM4 0 мм) или DF40HC(3.0)-100DS-0.4V для высоты стека 3.0 мм (зазор 1.5 мм). [DS §3.1]","Высота в собранном виде: 5.078 мм при стеке 1.5 мм, 6.578 мм при стеке 3.0 мм. Высота BCM2711 с шариками припоя — 2.378 ± 0.11 мм. [DS §3.1]","При стеке 1.5 мм зазор под CM4 равен 0 мм: не размещайте компоненты на baseboard внутри посадочного места модуля. При стеке 3.0 мм компоненты под модулем должны быть ниже 1.5 мм. [DS §3.1]","Чертёж платы (CM4 вид сверху, разъёмы на нижней стороне) одновременно является посадочным местом на baseboard в виде сверху — без зеркалирования. Вывод 1 — у правого конца обоих разъёмов; сверьте нумерацию выводов с чертежом розетки DF40. [DS Fig. 4]","Оси разъёмов в 3 мм от длинных краёв (J1 y = 3 мм, J2 y = 37 мм), центр по x = 25 мм от антенного края; корпус примерно 22 × 3 мм — геометрию контактных площадок и точное положение берите из посадочного места розетки DF40. [DS Fig. 4]","Расположение компонентов на CM4 может меняться от ревизии к ревизии; максимальные высоты компонентов и толщина платы сохраняются. STEP-файл из проектных данных CM4 используйте только как ориентир. [DS §3.1]"]},{"title":"Питание и последовательность включения","items":["Единственное питание +5V: оно должно нарастать монотонно до 4.75 В и во время работы оставаться выше 4.75 В. [DS §5.1]","Не подавайте напряжение ни на один вывод раньше, чем подана шина +5V. [DS §5.1]","При выключении и в выключенном состоянии ни на одном выводе не должно быть внешнего напряжения, иначе следующее включение может не произойти. [DS §4]","Последовательность включения: +5V → GLOBAL_EN (внутренняя RC-задержка) → 3.3 В → 1.8 В не ранее чем через 1 мс → RUN_PG не ранее чем через 10 мс → EXT_nRESET не ранее чем через 1 с. [DS §5.1]","Выключение: завершите работу ОС, затем снимите +5V или притяните GLOBAL_EN к низкому уровню. При выключении шина 1.8 В разряжается раньше шины 3.3 В. [DS §5.2]","Если CM4_3.3V питает что-либо кроме GPIO_VREF, при внезапной потере питания (+5V ниже 4.5 В) она никогда не должна опускаться ниже CM4_1.8V; иначе добавьте схему, отключающую нагрузку 3.3 В. [DS §4]","Проверка питания при низком GLOBAL_EN: +5V выше 4.75 В (лучше выше 4.9 В) при нагрузке 2 А с учётом шума; шины CM4 3.3 В и 1.8 В обе ниже 200 мВ (нет обратного питания). [DS §6.1]"]},{"title":"Загрузка, сброс и сервис","items":["nRPIBOOT (вывод 93) и EEPROM_nWP (вывод 20) на плате CM4IO заземляются перемычками (§6.2, §6.4): здесь поставьте перемычки или кнопки на GND. [DS §6.2]","EEPROM загрузчика обновляется только через usbboot или самообновление: путь rpiboot (перемычка nRPIBOOT плюс прямой USB-путь до ПК в режиме устройства) должен оставаться доступным в эксплуатации. [DS §6.3]","Сервисная консоль на этой плате: UART0 на 3-контактном штыревом разъёме (GND, TXD, RXD), 3.3 В; единственный UART, в который пишет загрузчик. [project]"]},{"title":"Высокоскоростные дифференциальные пары","items":["Дифференциальное волновое сопротивление: 90 Ом для PCIe (REFCLK, TX, RX) и USB 2.0; 100 Ом для Ethernet, CSI, HDMI и DSI. [DS §4.1]","На CM4 разбег длин внутри каждой пары — не более 0.05 мм; разбег длин между парами на стороне CM4 (таблицы 7–8) показаны в карточке выбранного вывода. [DS §4.1]"]},{"title":"GPIO и низкоскоростные интерфейсы","items":["UART на этой плате: UART0 консоль (55/51), UART2 GPS (36/35), UART3 CRSF TX1 (54/34, RTS 37), UART4 CRSF TX2 (39/40, RTS 38), UART5 шина сервоприводов (31/28); все 3.3 В. [project]","GPIO0/1 (выводы 36/35) — это UART2, а не I2C для HAT: добавьте force_eeprom_read=0 и disable_poe_fan=1 в config.txt, чтобы отключить опрос EEPROM при загрузке. [DS §2.10]","Однопроводным шинам нужна схема на baseboard: для CRSF TX1/TX2 — буфер направления плюс инвертор (направление от RTS3/RTS4), для шины сервоприводов ST3025 — буфер с автоматическим переключением направления. [project]","SPI6 к видеоприёмникам: MOSI на выводе 27, SCLK на выводе 25, по одному GPIO LE (выбор кристалла, chip-select) на приёмник — выводы 46, 47, 45, 41. [project]"]},{"title":"Wi-Fi и радиочасть","items":["Под антенной ни на одном слое baseboard не должно быть меди и другого металла: зона без меди минимум 6.5 × 11 мм, лучше не менее 8 × 15 мм (меньшая зона сильнее всего ухудшает 2.4 ГГц). [DS §3.1]","Область антенны — у короткого края модуля: x = 0–6.5 мм, y = 10.5–21.5 мм на чертеже платы (CM4 вид сверху); на странице заштрихована. [DS Fig. 4]","Оставьте не менее 10 мм свободного пространства вокруг печатной антенны; в любом металле поблизости сделайте вырезы; ориентируйте антенну к краю пластикового корпуса. Характеристики должен проверить разработчик. [DS §3.1]","По возможности используйте внешнюю антенну: на модуле есть стандартный разъём U.FL. [DS §3.1]","Разъём U.FL на модуле: x = 2.57 мм от антенного края, y = 9.0 мм от края J1 (верхнего) — те же оси, что и у зоны без меди под антенной. [DS Fig. 4]","Выбор антенны фиксируется при загрузке в config.txt: dtparam=ant1 = печатная антенна, dtparam=ant2 = внешняя антенна. [DS §2.1]"]},{"title":"Тепловой режим","items":["Рабочая температура −20…85 °C, без конденсации. [DS §3.2]","BCM2711 снижает частоту (троттлинг), чтобы удержать кристалл ниже 85 °C; если не удаётся, температура корпуса поднимается выше 85 °C. Держите температуру окружающей среды для остальных компонентов CM4 в рабочем диапазоне. [DS §3.2]","У CM4 меньше пассивного теплоотвода, чем у Raspberry Pi 4 Model B, и он может греться сильнее при меньшей рассеиваемой мощности, поэтому может потребоваться решение по охлаждению. [DS §3.2]","BCM2711 15 × 15 мм с центром в (31.99, 23.03) мм на чертеже платы: центрируйте там радиатор или вырез под вентилятор. [DS Fig. 4]","Вентилятор: PWM0 на GPIO18 (вывод 49), тахометр на GPIO26 (вывод 24) с внешней подтяжкой к питанию (pull-up). [project]","Оптимальные радиочастотные характеристики — от −20 °C до +75 °C; по возможности держите модуль Wi-Fi ниже 75 °C. [DS §3.2]"]},{"title":"Видеодекодер ADV7280A-M (проект)","items":["ADV7280A-M на CSI1, одна линия данных (lane): D0P/D0N (U1, выводы 9/10) → выводы CM4 117/115, CLKP/CLKN (U1, выводы 11/12) → выводы 129/127. [sdtv2csi]","I2C: SDA/SCL (U1, выводы 30/31) → CM4 SDA0/SCL0 (выводы 82/80). ALSB (вывод 29) через подтяжку к питанию (pull-up) 4.7 кОм (R20) с неустанавливаемой (DNP) подтяжкой к земле (R21): высокий = адрес 0x21, низкий = 0x20. [sdtv2csi]","Питание: LDO NJM12888F18, 3.3 В → 1.8 В для AVDD, DVDD, MVDD, PVDD, каждый через ферритовую бусину 600 Ом с 0.1 мкФ + 10 мкФ; DVDDIO = 3.3 В. Кварц Y1: ABM8G 28.63636 МГц, 2 × 20 пФ. [sdtv2csi]","Аналоговые входы AIN1–AIN8: каждый VINx → 24 Ом последовательно → разделительный конденсатор 0.1 мкФ → AINx, на входе 51 Ом на GND. Входы приходят на штыревой разъём 2×8 (VIDEO_IN). [sdtv2csi]","~RESET (вывод 28): подтяжка к питанию (pull-up) 4.7 кОм + 4.7 мкФ на GND (RC-сброс при включении); ~PWRDWN (вывод 32): подтяжка к питанию 4.7 кОм; ~INTRQ и GPO0–GPO2: только контрольные точки. GPIO CM4 не задействованы. [sdtv2csi]","ПО: dtoverlay=adv728x-m,adv7280m=1 (адрес по умолчанию 0x21; addr=0x20, если ALSB низкий); overlay (DT-оверлей) нацелен на CSI1 и I2C0 (выводы 82/80). [project]","I2C0 делится с камерой CSI0; камере CSI0 нужен собственный вариант overlay с i2c_csi_dsi (штатные варианты cam0 ожидают I2C на GPIO0/1, которые здесь заняты под UART2). [project]","Тракт «коммутатор CVBS 4→1 + энкодер K7» остаётся параллельно; GPIO6/GPIO10 (выводы 30/44) остаются CVBS_SEL0/1. [project]"]}]};
var DS_RU = {"(BCM2711 GPIO 0) GPIO: typically a 3.3V signal, but can be a 1.8V signal by connecting GPIO_VREF to CM4_1.8V":"(BCM2711 GPIO 0) GPIO: обычно сигнал 3.3 В; может быть 1.8 В, если GPIO_VREF подключён к CM4_1.8V","(BCM2711 GPIO 1) GPIO: typically a 3.3V signal, but can be a 1.8V signal by connecting GPIO_VREF to CM4_1.8V":"(BCM2711 GPIO 1) GPIO: обычно сигнал 3.3 В; может быть 1.8 В, если GPIO_VREF подключён к CM4_1.8V","1.8V ± 2.5%. Power Output max 300mA per pin for a total of 600mA. This will be powered down during power-off or GLOBAL_EN being set low":"1.8 В ± 2.5 %. Выход питания: не более 300 мА на вывод, 600 мА суммарно. Отключается при снятии питания или при низком уровне GLOBAL_EN","3.3V ± 2.5%. Power Output max 300mA per pin for a total of 600mA. This will be powered down during power-off or GLOBAL_EN being set low":"3.3 В ± 2.5 %. Выход питания: не более 300 мА на вывод, 600 мА суммарно. Отключается при снятии питания или при низком уровне GLOBAL_EN","4.75V-5.25V. Main power input":"4.75–5.25 В. Основной вход питания","A low on this pin forces booting from an RPI server (e.g. PC or a Raspberry Pi); if not used leave floating. Internally pulled up via 10kΩ to +3.3V":"Низкий уровень на этом выводе принудительно включает загрузку с хоста rpiboot (например, ПК или Raspberry Pi); если не используется — оставьте неподключённым. Внутренняя подтяжка к питанию (pull-up) 10 кОм на +3.3V","Active-low Ethernet activity indicator (CM4_3.3V signal): typically a green LED is connected to this pin. IOL = 8mA @ VOL< 0.4V":"Индикатор активности Ethernet, активный низкий уровень (сигнал CM4_3.3V): обычно к этому выводу подключён зелёный светодиод. IOL = 8 мА при VOL < 0.4 В","Active-low Ethernet speed indicator (CM4_3.3V signal): typically a yellow LED is connected to this pin. A low state indicates the 1Gbit or 100Mbit link: IOL = 8mA @ VOL < 0.4V":"Индикатор скорости Ethernet, активный низкий уровень (сигнал CM4_3.3V): обычно к этому выводу подключён жёлтый светодиод. Низкий уровень означает соединение 1 Гбит или 100 Мбит: IOL = 8 мА при VOL < 0.4 В","Active-low Ethernet speed indicator (CM4_3.3V signal): typically a yellow LED is connected to this pin. A low state indicates the 1Gbit or 10Mbit link: IOL = 8mA @ VOL < 0.4V":"Индикатор скорости Ethernet, активный низкий уровень (сигнал CM4_3.3V): обычно к этому выводу подключён жёлтый светодиод. Низкий уровень означает соединение 1 Гбит или 10 Мбит: IOL = 8 мА при VOL < 0.4 В","Active-low Pi activity LED. 20mA Max, 5V tolerant (VOL < 0.4V). (this is the signal that drives the green LED on the Raspberry Pi 4 Model B)":"Светодиод активности Pi, активный низкий уровень. Не более 20 мА, допускает 5 В (VOL < 0.4 В). (Этот же сигнал управляет зелёным светодиодом на Raspberry Pi 4 Model B)","Active-low output to drive Power On LED. This signal needs to be buffered.":"Выход с активным низким уровнем для светодиода «Питание». Сигнал требует буферизации.","Analogue input of the MXL7704: typically connected to CC pin of Type C power connector":"Аналоговый вход MXL7704: обычно подключается к выводу CC разъёма питания Type-C","Bidirectional HDMI0 SCL. Internally pulled up with a 1.8kΩ. 5V tolerant. (It can be connected directly to a HDMI connector; a small amount of ESD protection is provided on the CM4 by an on-board HDMI05-CL02F3)":"Двунаправленный HDMI0 SCL. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм. Допускает 5 В. (Можно подключать напрямую к разъёму HDMI; небольшая защита от ESD обеспечена на CM4 микросхемой HDMI05-CL02F3)","Bidirectional HDMI0 SDA. Internally pulled up with a 1.8kΩ. 5V tolerant. (It can be connected directly to a HDMI connector; a small amount of ESD protection is provided on the CM4 by an on-board HDMI05-CL02F3)":"Двунаправленный HDMI0 SDA. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм. Допускает 5 В. (Можно подключать напрямую к разъёму HDMI; небольшая защита от ESD обеспечена на CM4 микросхемой HDMI05-CL02F3)","Bidirectional HDMI1 SCL. Internally pulled up with a 1.8kΩ. 5V tolerant. (It can be connected directly to a HDMI connector; a small amount of ESD protection is provided on the CM4 by an on-board HDMI05-CL02F3)":"Двунаправленный HDMI1 SCL. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм. Допускает 5 В. (Можно подключать напрямую к разъёму HDMI; небольшая защита от ESD обеспечена на CM4 микросхемой HDMI05-CL02F3)","Bidirectional HDMI1 SDA. Internally pulled up with a 1.8kΩ. 5V tolerant. (It can be connected directly to a HDMI connector; a small amount of ESD protection is provided on the CM4 by an on-board HDMI05-CL02F3)":"Двунаправленный HDMI1 SDA. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм. Допускает 5 В. (Можно подключать напрямую к разъёму HDMI; небольшая защита от ESD обеспечена на CM4 микросхемой HDMI05-CL02F3)","Bidirectional pin. Can be driven low (via a 220Ω resistor) to reset the CM4 CPU. As an output, a high signals that power is good and CPU is running. Internally pulled up to +3.3V via 10kΩ":"Двунаправленный вывод. Низкий уровень (через резистор 220 Ом) сбрасывает CPU CM4. Как выход: высокий уровень означает, что питание в норме и CPU работает. Внутренняя подтяжка к питанию (pull-up) 10 кОм на +3.3V","Can be left floating; if driven low the Bluetooth interface will be disabled. Internally pulled up via 1.8kΩ to CM4_3.3V":"Можно оставить неподключённым; при низком уровне интерфейс Bluetooth отключается. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм на CM4_3.3V","Can be left floating; if driven low the wireless interface will be disabled. Internally pulled up via 1.8kΩ to CM4_3.3V":"Можно оставить неподключённым; при низком уровне беспроводной интерфейс (Wi-Fi) отключается. Внутренняя подтяжка к питанию (pull-up) 1.8 кОм на CM4_3.3V","Connect to CM4_3.3V to force SD card/eMMC interface to 1.8V signalling instead of 3.3V, otherwise leave unconnected. Typically only used if external eMMC is connected.":"Подключите к CM4_3.3V, чтобы перевести интерфейс SD-карты/eMMC на уровни 1.8 В вместо 3.3 acitor required":"Вход PCIe GEN 2 RX, положительный. Внимание: требуется внешний разделительный конденсатор","Input. Drive low to power off CM4. Internally pulled up with a 100kΩ to +5V":"Вход. Низкий уровень выключает питание CM4. Внутренняя подтяжка к питанию (pull-up) 100 кОм на +5V","Leave floating NB internally pulled up to CM4_3.3V via 100kΩ (V IL < 0.8V), but can be grounded to prevent writing to the on-board EEPROM which stores the bootcode":"Оставьте неподключённым. Внимание: внутренняя подтяжка к питанию (pull-up) 100 кОм на CM4_3.3V (VIL < 0.8 В); можно заземлить, чтобы запретить запись во встроенную EEPROM, хранящую код загрузчика","Must be connected to CM4_3.3V (pins 84 and 86) for 3.3V GPIO or CM4_1.8V (pins 88 and 90) for 1.8V GPIO. This pin cannot be floating or connected to ground.":"Должен быть подключён к CM4_3.3V (выводы 84 и 86) для GPIO 3.3 В или к CM4_1.8V (выводы 88 и 90) для GPIO 1.8 В. Этот вывод нельзя оставлять неподключённым или заземлять.","Output (+3.3V signal) PCIe reset active-low":"Выход (сигнал +3.3V) сброса PCIe, активный низкий уровень","Output Display0 D0 negative":"Выход Display0 D0, отрицательный","Output Display0 D0 positive":"Выход Display0 D0, положительный","Output Display0 D1 negative":"Выход Display0 D1, отрицательный","Output Display0 D1 positive":"Выход Display0 D1, положительный","Output Display0 clock negative":"Выход Display0, тактовый сигнал, отрицательный","Output Display0 clock positive":"Выход Display0, тактовый сигнал, положительный","Output Display1 D0 negative":"Выход Display1 D0, отрицательный","Output Display1 D0 positive":"Выход Display1 D0, положительный","Output Display1 D1 negative":"Выход Display1 D1, отрицательный","Output Display1 D1 positive":"Выход Display1 D1, положительный","Output Display1 D2 negative":"Выход Display1 D2, отрицательный","Output Display1 D2 positive":"Выход Display1 D2, положительный","Output Display1 D3 negative":"Выход Display1 D3, отрицательный","Output Display1 D3 positive":" var RATIONALE = {"overview":["У BCM2711 пять PL011 UART (0, 2, 3, 4, 5) — ровно под консоль, GPS, два CRSF и шину сервоприводов; mini-UART не используется: его скорость зависит от изменяемой системной тактовой частоты. [project]","CRSF на UART3/UART4: только у них RTS попадает на свободные выводы (RTS3 = GPIO7, RTS4 = GPIO11). RTS2 = GPIO3 занят I2C1, RTS5 = GPIO15 — консолью, а UART0 с его RTS0 (GPIO17) сам отдан консоли. [project]","При загрузке GPIO0–8 имеют подтяжку к питанию (pull-up), GPIO9–27 — к земле (pull-down). Ключи питания TX (GPIO17/19), LE приёмников (GPIO22–25) и инверсия (GPIO16/27) — с подтяжкой к земле (pull-down): до старта ПО TX-модули выключены, а приёмники остаются в состоянии по включению. [BCM2711 §5.3]","Все медленные датчики (ADS1115, INA228, RM3100, BMP390, компас BK-450) — на одной шине I2C1 с разными адресами: экономит GPIO; подтяжки к питанию (pull-up) 1.8 кОм уже стоят на CM4. [project]","Бюджет GPIO 28/28, свободных нет. Резервы: GPIO6/10 после отказа от коммутатора CVBS; UART2 — если GPS переедет в LTE-модем по USB. [project]","Два CSI: камера на CSI0 — 2 линии (lane), камерам Raspberry Pi этого достаточно; ADV7280A-M на CSI1 — штатный overlay adv728x-m нацелен на CSI1; оба на общем I2C0 (выводы 82/80), GPIO не расходуются. [project]","Сервис по ТЗ (прошивка, восстановление, аппаратный сброс, перезапуск по Ethernet без Linux): UART0 — единственный UART, в который пишет загрузчик; nRPIBOOT плюс прямой USB-путь к ПК — прошивка eMMC; RUN_PG — сброс; GLOBAL_EN — полный цикл питания. [project]"],"devices":{"CONSOLE":["ТЗ требует выводы и интерфейсы для прошивки, восстановления и аппаратного сброса CM4; сервисная консоль — один из них. [ТЗ]","UART0 (GPIO14/15) — единственный UART, в который пишет загрузчик. CRSF на UART0 потребовал бы отключить console=serial0 и получал бы вывод загрузчика, поэтому UART0 отдан консоли. [project]"],"GPS":["GPS BK-450 (GPS + компас): NMEA/UBX по UART, компас — на общей I2C1. [ТЗ]","UART2 (GPIO0/1): по DS §2.10 прошивка при загрузке ищет EEPROM HAT на ID_SD/ID_SC — несколько импульсов безвредны для GPS, но нежелательны для модуля CRSF, поэтому здесь GPS. [project]","Резерв: UART2 освобождается, если GPS переедет в LTE-модем по USB. [project]"],"CRSF1":["Два независимых CRSF TX-модуля (TBS Crossfire, ExpressLRS): два аппаратных UART и четыре GPIO на однопроводный полудуплекс с переключением направления и инверсией; модули ставятся прямо на baseboard. [ТЗ]","UART3 — потому что его RTS3 (GPIO7) свободен: в режиме RS-485 PL011 держит RTS на время передачи — направление полудуплекса аппаратное, без программного дрожания; вывод можно использовать и как обычный GPIO. [project]","Второй GPIO модуля — выбор инверсии (GPIO27): так закрываются два GPIO на модуль по ТЗ. [project]"],"CRSF2":["Второй CRSF TX (ExpressLRS) — независимый модуль с собственным UART, направлением, инверсией и ключом питания. [ТЗ]","UART4: RTS4 = GPIO11 — второй и последний RTS на свободном выводе; направление — та же схема, что у TX1 (режим RS-485 PL011 или обычный GPIO). Инверсия — GPIO16. [project]"],"SERVO":["Два сервопривода ST3025 (12 В) на одной UART-шине 1 Мбит/с; внешний адаптер Waveshare Bus Servo Adapter (A) убран — всё на плате. [ТЗ]","UART5 (GPIO12/13) — последний свободный PL011; его RTS5 = GPIO15 занят консолью, поэтому направление полудуплекса — автоматическое на плате (буфер от TX, как в Waveshare Bus Servo Adapter (A)), без GPIO. [project]"],"I2C":["Шина для АЦП, монитора батареи и компаса — все подключены одновременно: ADS1115 (RSSI), Matek INA-BM/INA228 (0x45/0x44/0x41), RM3100, BMP390, компас BK-450. [ТЗ]","I2C1 (GPIO2/3) — штатная шина HAT с подтяжками к питанию (pull-up) 1.8 кОм на CM4; все медленные датчики на одной шине с разными адресами — экономия GPIO. [project]","Сюда же EEPROM идентификации типа модуля приёмников — без расхода GPIO. [project]"],"VRX":["Сменный модуль приёмников одного диапазона: SPI с общими DATA/CLK и индивидуальными CS (LE); RSSI каждого приёмника — на АЦП (ADS1115 по I2C1). [ТЗ]","SPI6 (GPIO20 MOSI, GPIO21 SCLK, ALT3) вместо SPI0: GPIO11 (SPI0_SCLK) занят под RTS4. На модуле 4 приёмника одного диапазона — уточнение заказчика (в ТЗ — 3), отсюда четыре линии LE; приёмники RTC6705 только на запись (DATA/CLK/LE), MISO не нужен; идентификация типа модуля — EEPROM на I2C1, без GPIO. [project]","LE на GPIO22–25 при загрузке с подтяжкой к земле (pull-down): защёлка приёмника срабатывает по фронту LE, а первый фронт задаёт только ПО после полного слова по CLK/DATA — до старта ПО приёмники остаются в состоянии по включению. [project]"],"CVBS":["Простой вариант видео: CVBS с приёмников коммутируется на один вход энкодера Haiwei K7. [ТЗ]","Выбор коммутатора 4→1 — два бита на GPIO6/10: это CTS3/CTS4, отданы намеренно как наименее критичные сигналы UART3/UART4; освобождаются, когда тракт ADV7280A-M заменит коммутатор. [project]"],"FAN":["Вентилятор: ШИМ для регулировки скорости и один GPIO для данных о вращении. [ТЗ]","FAN_PWM на GPIO18 = аппаратный PWM0_0 (ALT5), потому что GPIO12/13 (PWM0 в ALT0) заняты UART5. Тахометр — GPIO26: подходит любой GPIO. [project]"],"PWRKEY":["Каждый TX-модуль включается и выключается независимо. [ТЗ]","Сигналы разрешения ключей — GPIO17/19: при загрузке подтяжка к земле (pull-down), модули выключены, пока ПО их не включит. [BCM2711 §5.3]"],"PCIE":["M.2 M-key NVMe 2280 по PCIe — основной локальный накопитель. [ТЗ]"],"CSI0":["Второй CSI CM4 выведен на FFC-разъём для обычной CSI-камеры. [ТЗ]","Камере отдан CSI0 — 2 линии (lane), камерам Raspberry Pi этого достаточно; четырёхлинейный CSI1 занял декодер. Camera_GPIO — штатное включение камеры. [project]"],"VDEC":["Перспектива по ТЗ — analog→MIPI на CSI. [ТЗ]","Сейчас это ADV7280A-M из sdtv2csi (параллельно с трактом «коммутатор + K7») на CSI1: штатный overlay adv728x-m нацелен на CSI1; однолинейному декодеру хватает D0 и тактовой пары. [project]","GPIO CM4 не расходуются: сброс RC-цепочкой, управление — по общему I2C0 (адрес 0x21/0x20). [sdtv2csi]"],"USB":["Два внешних USB-порта по ТЗ. [ТЗ]","У CM4 один порт USB 2.0, поэтому хаб: 2 внешних порта, LTE-модем, резерв; плюс прямой путь к ПК в режиме устройства — для rpiboot. [project]"],"ETH":["Ethernet-коммутатор объединяет CM4, K7, IP-камеру, внешний ПК и конвертер оптики. [ТЗ]","У CM4 один Ethernet PHY, поэтому сеть собирает коммутатор на плате (K7, IP-камера, ПК, конвертер оптики); CM4 — на один его порт, связь PHY–PHY. [project]"],"CTRL":["Выводы и интерфейсы для прошивки, восстановления и аппаратного сброса CM4; удалённый полный перезапуск по Ethernet независимо от CM4 и Linux. [ТЗ]","GLOBAL_EN ← схема Ethernet-reboot (полный цикл питания без Linux); RUN_PG ← кнопка сброса; nRPIBOOT ← перемычка для прошивки eMMC. [project]","Перемычки WL_nDisable/BT_nDisable: возможность отключить Wi-Fi/Bluetooth 2.4 ГГц, когда рядом работает модуль ELRS 2.4 ГГц. [project]"],"POWER":["Питание устройства — батарея 4S–6S. [ТЗ]","GPIO_VREF → CM4_3.3V: по DS §2.5 опора GPIO берётся только с шины CM4 (3.3 В или 1.8 В), а периферия платы — 3.3 В. Остальные нагрузки 3.3 В — от своего стабилизатора: по DS §4 нагруженная CM4_3.3V при внезапной потере +5V не должна падать ниже CM4_1.8V, иначе нужна схема отключения нагрузки. [project]"]},"pins":{"36":["ID_SD (GPIO0): по DS §2.10 без HAT и без обслуживания CSI0 прошивкой вывод свободен под GPIO; камеру ведёт libcamera с ARM по I2C0 (выводы 82/80). [project]","GPIO0 = TXD2 (ALT4): UART2 отдан GPS. [BCM2711 §5.3]"],"35":["ID_SC (GPIO1) — пара к выводу 36: в ALT4 это RXD2. [BCM2711 §5.3]"],"37":["GPIO7 = RTS3 (ALT4): единственный RTS на свободном выводе кроме GPIO11; его ALT0 (SPI0_CE1_N) не нужен — SPI0 не используется. [BCM2711 §5.3]"],"38":["GPIO11 = RTS4 (ALT4) — второй свободный RTS; цена — потеря SPI0_SCLK, поэтому приёмники переведены на SPI6. [project]"],"30":["GPIO6 = CTS3 (ALT4): однопроводному полудуплексу CRSF вход CTS не нужен, поэтому вывод отдан под CVBS_SEL0. [project]"],"44":["GPIO10 = CTS4 (ALT4): однопроводному полудуплексу CRSF вход CTS не нужен, поэтому вывод отдан под CVBS_SEL1. [project]"],"50":["GPIO17: его ALT-функция RTS0 (ALT3) не нужна — UART0 работает консолью без управления потоком; при загрузке подтяжка к земле (pull-down). [BCM2711 §5.3]"],"26":["GPIO19: его ALT-функции SPI6_MISO (ALT3) и PWM0_1 (ALT5) не нужны — приёмники только на запись, ШИМ вентилятора на GPIO18; при загрузке подтяжка к земле (pull-down). [BCM2711 §5.3]"],"49":["GPIO18 — один из двух оставшихся выводов PWM0 (ALT5: GPIO18 = PWM0_0, GPIO19 = PWM0_1); GPIO19 отдан под TX2_PWR_EN. [BCM2711 §5.3]"],"24":["GPIO26: ни одна из его ALT-функций (SD, DPI, JTAG, SPI5_CE1_N) на плате не нужна — отдан тахометру, которому подходит любой GPIO. [BCM2711 §5.3]"],"27":["GPIO20 = SPI6_MOSI (ALT3). Из SPI6 нужны только MOSI и SCLK: приёмники не отвечают (MISO не нужен), LE — обычные GPIO; поэтому GPIO18 (SPI6_CE0_N) и GPIO19 (SPI6_MISO) отданы под FAN_PWM и TX2_PWR_EN. [BCM2711 §5.3]"],"25":["GPIO21 = SPI6_SCLK (ALT3), пара к выводу 27. [project]"],"46":["GPIO22–25 — четыре смежных GPIO без нужных плате ALT-функций (SD, DPI, JTAG, I2C6, CE SPI3/SPI4), все с подтяжкой к земле (pull-down) при загрузке: до старта ПО приёмники остаются в состоянии по включению. [BCM2711 §5.3]"],"29":["GPIO16 — выбор инверсии TX2, второй GPIO модуля по ТЗ; при загрузке подтяжка к земле (pull-down): на входе INV низкий уровень до старта ПО, его смысл задаёт схема XOR/мультиплексора. [BCM2711 §5.3]"],"48":["GPIO27 — выбор инверсии TX1, второй GPIO модуля по ТЗ; при загрузке подтяжка к земле (pull-down): на входе INV низкий уровень до старта ПО, его смысл задаёт схема XOR/мультиплексора. [BCM2711 §5.3]"],"78":["GPIO_VREF соединён с CM4_3.3V — GPIO работают на 3.3 В; вариант 1.8 В на этой плате не нужен. [project]"],"80":["SCL0: по даташиту шина I2C0 свободна для ARM, если CSI1 не обслуживает прошивка (libcamera работает на ARM) — поэтому её делят камера CSI0 и ADV7280A-M (0x21/0x20), GPIO не расходуются. [DS §2.9]"],"82":["SDA0: пара к выводу 80; ведомые — камера CSI0 и ADV7280A-M (0x21/0x20). [project]"],"55":["GPIO14 = TXD0 (ALT0): TXD0/RXD0 есть только на GPIO14/15; их ALT5 (TXD1/RXD1, mini-UART) не используется. [BCM2711 §5.3]"],"51":["GPIO15 = RXD0 (ALT0); одновременно это RTS5 (ALT4) — поэтому у шины сервоприводов (UART5) направление не от UART, а автоматическое на плате (буфер от TX). [project]"],"115":["CSI1 D0−: единственная линия данных (lane) от ADV7280A-M, пара к выводу 117; D1–D3 не подключены. [sdtv2csi]"],"127":["CSI1 тактовый сигнал −: тактовая пара от ADV7280A-M, нужна и при одной линии данных (lane). [sdtv2csi]"],"121":["CSI1 D1 не нужна однолинейному ADV7280A-M; четырёхлинейный CSI1 отдан декодеру из-за штатного overlay, камере хватает двух линий CSI0. [project]"],"99":["GLOBAL_EN выбран для перезапуска по Ethernet: низкий уровень даёт полный цикл питания CM4 без участия Linux (RUN_PG лишь сбрасывает CPU, питание не снимает) — требование ТЗ о независимом перезапуске. [project]"],"92":["RUN_PG — кнопка аппаратного сброса CPU: требование ТЗ об аппаратном reset. [project]"],"93":["nRPIBOOT — перемычка: принудительная загрузка по USB для прошивки eMMC и восстановления, в паре с прямым USB-путём к ПК. [project]"],"58":["GPIO2 = SDA1 (ALT0): датчики на I2C1, а не на I2C0 — тот (выводы 82/80) занят камерой CSI0 и декодером. [project]"],"56":["GPIO3 = SCL1 (ALT0); одновременно это RTS2 (ALT4) — поэтому UART2 без RTS и отдан GPS, а не CRSF. [project]"]}};

  }
  function ov(p) { return LIB.merge(p, PROJECT); }
  function nPins(n) { var d = n % 10, m = n % 100; return n + ' ' + (m >= 11 && m <= 14 ? 'пинов' : d === 1 ? 'пин' : d >= 2 && d <= 4 ? 'пина' : 'пинов'); }
  function chipName(key) {
    if (state.layer === 'ds') return LIB.GROUPS[key] ? LIB.GROUPS[key].n : key;
    return PROJECT.devices[key] ? PROJECT.devices[key].name : key;
  }
  function chipColor(key) {
    if (state.layer === 'ds') return LIB.GROUPS[key] ? LIB.GROUPS[key].c : '#8C8C8C';
    return PROJECT.devices[key] ? PROJECT.devices[key].c : '#9A9A9A';
  }
  function visible(p) {
    if (!state.filter) return true;
    return LIB.chipKey(p, ov(p), state.layer) === state.filter;
  }

  /* ---------- board ---------- */
  function buildBoard() {
    var defs = svg('defs', {}), pat = svg('pattern', {id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)'});
    pat.appendChild(svg('line', {x1: 0, y1: 0, x2: 0, y2: 6, stroke: '#8A8A8A', 'stroke-width': 1.2}));
    defs.appendChild(pat); board.appendChild(defs);

    var o = LIB.mm(0, 0), s = LIB.MM;
    var cL = LIB.mm(14, 0).x, cR = LIB.mm(36, 0).x;
    var j1 = LIB.mm(0, 3).y, j2 = LIB.mm(0, 37).y;
    // outline 55×40 mm, corner radius 2 mm
    board.appendChild(svg('rect', {id: 'outline', x: o.x, y: o.y, width: 55 * s, height: 40 * s, rx: 2 * s}));
    [[3.5, 3.5], [51.5, 3.5], [3.5, 36.5], [51.5, 36.5]].forEach(function (c) {
      var p = LIB.mm(c[0], c[1]); board.appendChild(svg('circle', {class: 'hole', cx: p.x, cy: p.y, r: 1.25 * s}));
    });
    // connector bodies (22×3 mm, centred x = 25 mm) with pin-1 marks at the right end
    [['J1', 3], ['J2', 37]].forEach(function (c) {
      var y = LIB.mm(0, c[1]).y;
      board.appendChild(svg('rect', {class: 'conn', 'data-conn': c[0], x: cL, y: y - 1.5 * s, width: 22 * s, height: 3 * s, rx: 2}));
      board.appendChild(svg('circle', {class: 'pin1', cx: cR - 1.2 * s, cy: y, r: 2.2}));
      board.appendChild(svg('text', {class: 'lbl s', x: cL + 4, y: y + 3.5}, c[0]));
    });
    // BCM2711 15×15 mm centred at (31.99, 23.03)
    var soc = LIB.mm(31.9875 - 7.5, 23.025 - 7.5);
    board.appendChild(svg('rect', {class: 'soc', x: soc.x, y: soc.y, width: 15 * s, height: 15 * s, rx: 4}));
    board.appendChild(svg('text', {class: 'lbl b', x: soc.x + 7.5 * s, y: soc.y + 7.5 * s + 4, 'text-anchor': 'middle'}, 'BCM2711'));
    // antenna keep-out 6.5×11 mm at the left edge, U.FL at (2.567, 9)
    var a = LIB.mm(0, 10.5);
    board.appendChild(svg('rect', {class: 'ant', x: a.x, y: a.y, width: 6.5 * s, height: 11 * s}));
    var u = LIB.mm(2.567, 9);
    board.appendChild(svg('circle', {class: 'ufl', cx: u.x, cy: u.y, r: 1.2 * s}));
    board.appendChild(svg('text', {class: 'lbl s', x: a.x + 6.5 * s + 6, y: a.y + 11}, 'Зона без меди 6.5 × 11 мм:'));
    board.appendChild(svg('text', {class: 'lbl s', x: a.x + 6.5 * s + 6, y: a.y + 23}, 'под этой областью ни на одном'));
    board.appendChild(svg('text', {class: 'lbl s', x: a.x + 6.5 * s + 6, y: a.y + 35}, 'слое baseboard нет меди; U.FL выше.'));
    // strip labels and caption
    [[500, 24, 'middle', 'J1 · пины 1–100 · нечётные номера в верхнем ряду', true],
     [958, 24, 'end', '1 / 2', false], [60, 24, 'start', '99 / 100', false],
     [500, 534, 'middle', 'J2 · пины 101–200 · нечётные номера в верхнем ряду', true],
     [958, 534, 'end', '101 / 102', false], [60, 534, 'start', '199 / 200', false],
     [500, 552, 'middle', 'CM4, вид сверху, в масштабе (Fig. 4 даташита). Разъёмы на нижней стороне; пин 1 — у правого края каждого разъёма.', false]
    ].forEach(function (l) {
      board.appendChild(svg('text', {class: 'lbl' + (l[4] ? ' b' : ''), x: l[0], y: l[1], 'text-anchor': l[2]}, l[3]));
    });
    pins.forEach(function (p) {
      var xy = LIB.padXY(p.n);
      var g = svg('g', {class: 'pad', 'data-n': p.n});
      g.appendChild(svg('title', {}));
      g.appendChild(svg('rect', {x: xy.x, y: xy.y, width: LIB.PAD, height: LIB.PAD, rx: 3}));
      g.appendChild(svg('text', {x: xy.x + LIB.PAD / 2, y: xy.y + LIB.PAD / 2 + 2.5}, String(p.n)));
      g.addEventListener('click', function () { select(p.n); });
      board.appendChild(g);
      pads[p.n] = g;
    });
  }

  /* ---------- legend ---------- */
  function buildLegend() {
    leg.replaceChildren();
    var src = state.layer === 'ds' ? LIB.GROUPS : PROJECT.devices;
    Object.keys(src).forEach(function (key) {
      var b = h('button', 'lg'); b.type = 'button'; b.dataset.k = key; b.setAttribute('aria-pressed', 'false');
      var d = h('span', 'd'); d.style.background = chipColor(key); d.setAttribute('aria-hidden', 'true');
      b.appendChild(d); b.appendChild(document.createTextNode(chipName(key)));
      b.addEventListener('click', function () { setFilter(state.filter === key ? null : key); });
      leg.appendChild(b);
    });
  }

  /* ---------- general layout notes ---------- */
  function buildGeneral() {
    var cols = $('#general-cols');
    (ROUTING.general || []).forEach(function (sec) {
      var d = h('div'); d.appendChild(h('h3', null, sec.title));
      var ul = h('ul'); (sec.items || []).forEach(function (t) { ul.appendChild(noteLi(t)); }); d.appendChild(ul);
      cols.appendChild(d);
    });
  }
  function noteLi(text) {
    var li = h('li'), m = /^(.*?)\s*(\[[^\]]+\])\s*$/.exec(text);
    if (m) { li.appendChild(document.createTextNode(m[1] + ' ')); li.appendChild(h('span', 'src', m[2])); }
    else li.textContent = text;
    return li;
  }

  /* ---------- table ---------- */
  function buildTable() {
    var thead = $('#tbl thead'), tbody = $('#tbl tbody'), tr = h('tr');
    [['#', ''], ['Conn.', ''], ['Signal', ''], ['Group', ''], ['Dir.', ''],
     ['Net', 'prj'], ['Device', 'prj'], ['Mode', 'prj'], ['Status', 'prj'], ['Note', 'prj'],
     ['Pair', ''], ['Datasheet', '']].forEach(function (c) { tr.appendChild(h('th', c[1] || null, c[0])); });
    thead.appendChild(tr);
    pins.forEach(function (p) {
      var o = ov(p), r = h('tr', 'row'); r.dataset.n = p.n;
      var num = h('td', 'mono'); num.appendChild(h('span', 'sw')); num.appendChild(document.createTextNode(String(p.n))); r.appendChild(num);
      r.appendChild(h('td', null, p.conn));
      r.appendChild(h('td', 'mono', p.sig));
      r.appendChild(h('td', null, LIB.GROUPS[p.grp] ? LIB.GROUPS[p.grp].n : p.grp));
      r.appendChild(h('td', null, LIB.DIRS[p.dir] || p.dir));
      r.appendChild(h('td', 'mono prj c-net', o.net));
      r.appendChild(h('td', 'prj c-dev', o.devName || o.dev));
      r.appendChild(h('td', 'mono prj c-mode', o.mode));
      r.appendChild(h('td', 'prj c-status', LIB.STATUS[o.status] || o.status));
      r.appendChild(h('td', 'txt prj c-note', o.note));
      r.appendChild(h('td', 'mono', p.pair ? p.pair.partner + ' · ' + p.pair.z + ' Ом' : ''));
      r.appendChild(h('td', 'txt', DS_RU[p.ds] || p.ds));
      r.addEventListener('click', function () { select(p.n); });
      tbody.appendChild(r);
      rows[p.n] = r;
    });
  }

  /* ---------- CSV ---------- */
  function bindCsv() {
    var btn = $('#csv'), dlg = $('#csvdlg');
    btn.addEventListener('click', function () {
      var text = LIB.csv(pins, PROJECT);
      function ok() { btn.textContent = 'Copied ✓'; setTimeout(function () { btn.textContent = 'Copy CSV'; }, 1500); }
      function fallback() { dlg.querySelector('textarea').value = text; dlg.showModal(); dlg.querySelector('textarea').select(); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
      else fallback();
    });
  }

  /* ---------- cards ---------- */
  function kv(dl, k, v) {
    dl.appendChild(h('dt', null, k));
    var dd = h('dd');
    if (typeof v === 'string') dd.textContent = v; else dd.appendChild(v);
    dl.appendChild(dd);
  }
  function chip(text, color) { var s = h('span', 'chip', text); s.style.background = color; return s; }
  function code(text) { return h('code', null, text); }
  function pinBtn(n) {
    var b = h('button', 'linkbtn pinbtn', 'pin ' + n); b.type = 'button';
    b.addEventListener('click', function () { select(n); });
    return b;
  }
  function closeBtn(fn) {
    var c = h('button', 'close linkbtn', '✕'); c.type = 'button'; c.setAttribute('aria-label', 'Закрыть');
    c.addEventListener('click', fn); return c;
  }
  function altTable(gpio, mode) {
    var a = ALT[String(gpio)], t = h('table', 'alt'), tr1 = h('tr'), tr2 = h('tr');
    var used = /^ALT(\d)/.exec(mode || '');
    a.alt.forEach(function (name, i) {
      tr1.appendChild(h('th', null, 'ALT' + i));
      tr2.appendChild(h('td', used && +used[1] === i ? 'on' : null, name || '—'));
    });
    t.appendChild(tr1); t.appendChild(tr2);
    return t;
  }
  function renderNotes(el, items, title, empty) {
    var frag = document.createDocumentFragment();
    frag.appendChild(h('h3', null, title));
    if (!items || !items.length) {
      frag.appendChild(h('div', 'ph', empty));
    } else {
      var ul = h('ul'); items.forEach(function (t) { ul.appendChild(noteLi(t)); }); frag.appendChild(ul);
    }
    el.replaceChildren(frag);
  }
  function renderRouting(items, title, empty) {
    renderNotes(routing, items, title || 'Routing notes', empty || 'Особых требований к трассировке для этого пина нет — см. Layout notes под схемой.');
  }
  function renderDesign(items, title, empty) {
    renderNotes(design, items, title || 'Design notes', empty || 'Для этого вывода отдельного обоснования нет — см. обоснование устройства.');
  }
  function designEmpty(dev) {
    if (dev === 'GND') return 'Земля — обоснование не требуется.';
    if (dev === 'NC') return 'Вывод не используется — обоснование не требуется.';
    return '';
  }
  function renderPanel() {
    var frag = document.createDocumentFragment();
    if (state.sel == null) {
      if (state.filter) {
        var list = pins.filter(function (p) { return LIB.chipKey(p, ov(p), state.layer) === state.filter; });
        var h2f = h('h2', null, chipName(state.filter) + ' · ' + nPins(list.length));
        h2f.appendChild(closeBtn(function () { setFilter(null); }));
        frag.appendChild(h2f);
        var ul = h('ul', 'plain');
        list.forEach(function (p) {
          var li = h('li'), o = ov(p);
          li.appendChild(pinBtn(p.n));
          li.appendChild(document.createTextNode(' ' + p.sig + (state.layer === 'prj' && o.net ? ' — ' + o.net : '')));
          ul.appendChild(li);
        });
        frag.appendChild(ul);
        panel.replaceChildren(frag);
        var grpItems = [], seen = {};
        list.forEach(function (p) {
          (ROUTING.groups[p.grp] || []).forEach(function (t) { if (!seen[t]) { seen[t] = true; grpItems.push(t); } });
        });
        renderRouting(grpItems, 'Routing notes · ' + chipName(state.filter));
        if (state.layer === 'prj') renderDesign(RATIONALE.devices[state.filter] || [], 'Design notes · ' + chipName(state.filter), designEmpty(state.filter));
      } else {
        frag.appendChild(h('div', 'ph', 'Нажмите на пин.'));
        panel.replaceChildren(frag);
        renderRouting([], 'Routing notes', 'Выберите пин или элемент легенды.');
        renderDesign(RATIONALE.overview || [], 'Design notes', 'Выберите пин или элемент легенды.');
      }
      return;
    }
    var p = byN[state.sel], o = ov(p), col = LIB.colorOf(p, o, state.layer, PROJECT);
    var h2 = h('h2');
    var pn = h('span', 'pn', String(p.n)); pn.style.background = col; h2.appendChild(pn);
    h2.appendChild(document.createTextNode(p.sig + ' '));
    h2.appendChild(h('span', 'muted', p.conn + ' · ' + (p.row === 'odd' ? 'нечётный (верхний) ряд' : 'чётный (нижний) ряд')));
    h2.appendChild(closeBtn(function () { select(null); }));
    frag.appendChild(h2);
    if (state.layer === 'prj') {
      var dl = h('dl', 'kv');
      kv(dl, 'Net', o.net ? code(o.net) : '—');
      kv(dl, 'Device', chip(o.devName || o.dev, col));
      if (o.mode) kv(dl, 'Mode', code(o.mode));
      kv(dl, 'Status', LIB.STATUS[o.status] || o.status);
      if (o.note) kv(dl, 'Note', o.note);
      frag.appendChild(dl);
    }
    var dl2 = h('dl', 'kv');
    kv(dl2, 'Group', chip(LIB.GROUPS[p.grp].n, LIB.GROUPS[p.grp].c));
    kv(dl2, 'Direction', LIB.DIRS[p.dir] || p.dir);
    if (p.gpio != null) {
      var a = ALT[String(p.gpio)];
      kv(dl2, 'BCM2711', 'GPIO' + p.gpio + (a ? ' · при загрузке pull-' + (a.pull === 'High' ? 'up' : 'down') : ''));
    }
    if (p.pair) {
      var q = byN[p.pair.partner], span = h('span');
      span.appendChild(pinBtn(q.n));
      span.appendChild(document.createTextNode(' ' + q.sig + ' · ' + p.pair.z + ' Ом · разбег длин на CM4 ' + p.pair.skew + ' / ' + q.pair.skew + ' мм'));
      kv(dl2, 'Differential pair', span);
    }
    frag.appendChild(dl2);
    var dq = h('div', 'dsq'), ru = DS_RU[p.ds];
    dq.appendChild(h('b', null, 'Datasheet: ')); dq.appendChild(document.createTextNode(ru || p.ds));
    if (ru) dq.appendChild(h('div', 'dsq-en', p.ds));
    frag.appendChild(dq);
    if (p.gpio != null && ALT[String(p.gpio)]) frag.appendChild(altTable(p.gpio, state.layer === 'prj' ? o.mode : ''));
    panel.replaceChildren(frag);
    renderRouting(LIB.routingFor(p, ROUTING), 'Routing notes · pin ' + p.n);
    renderDesign((RATIONALE.devices[o.dev] || []).concat(RATIONALE.pins[String(p.n)] || []), 'Design notes · pin ' + p.n, designEmpty(o.dev));
  }

  /* ---------- state ---------- */
  function apply() {
    document.body.classList.toggle('layer-ds', state.layer === 'ds');
    document.body.classList.toggle('layer-prj', state.layer === 'prj');
    document.body.classList.toggle('has-sel', state.sel != null || state.filter != null);
    var selP = state.sel != null ? byN[state.sel] : null;
    var mate = selP && selP.pair ? selP.pair.partner : null, shown = 0;
    pins.forEach(function (p) {
      var o = ov(p), v = visible(p);
      if (v) shown++;
      var g = pads[p.n], cls = 'pad';
      if (!v) cls += ' dim';
      if (p.n === state.sel) cls += ' sel';
      if (p.n === mate) cls += ' mate';
      if (state.layer === 'prj' && o.status === 'dnc') cls += ' dnc';
      if (state.layer === 'prj' && o.status === 'opt') cls += ' opt';
      g.setAttribute('class', cls);
      g.querySelector('rect').setAttribute('fill', LIB.colorOf(p, o, state.layer, PROJECT));
      var label = p.n + ' · ' + p.sig + (state.layer === 'prj' && o.net ? ' · ' + o.net : '');
      g.querySelector('title').textContent = label;
      g.setAttribute('aria-label', 'Пин ' + label);
      var r = rows[p.n];
      if (r) {
        r.hidden = !v;
        r.classList.toggle('sel', p.n === state.sel);
        r.querySelector('.sw').style.background = LIB.colorOf(p, o, state.layer, PROJECT);
      }
    });
    var cnt = $('#cnt'); if (cnt) cnt.textContent = 'Показано ' + shown + ' из 200 пинов';
    leg.querySelectorAll('.lg').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === state.filter)); });
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.layer === state.layer)); });
    renderPanel();
  }
  function select(n) {
    if (n == null) state.sel = null;
    else if (state.sel === +n) state.sel = null;
    else { state.sel = +n; state.filter = null; }
    apply();
  }
  function setLayer(layer) { state.layer = layer; state.filter = null; buildLegend(); apply(); }
  function setFilter(key) { state.filter = key; state.sel = null; apply(); }

  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { setLayer(b.dataset.layer); });
  });

  window.PINOUT = {select: select, setLayer: setLayer, setFilter: setFilter, state: state, apply: apply, ov: ov, byN: byN};
  $('#sub').textContent = (PROJECT.meta.cm4 || '') + (PROJECT.meta.date ? ' · rev. ' + PROJECT.meta.rev + ', ' + PROJECT.meta.date : '');
  buildBoard();
  buildLegend();
  buildGeneral();
  buildTable();
  bindCsv();
  apply();
})();
/*UI-END*/
</script>
</body>
</html>
