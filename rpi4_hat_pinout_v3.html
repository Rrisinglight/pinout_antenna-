<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raspberry Pi 4 — распиновка HAT</title>
  <style>
    :root {
      --font-sans: system-ui, "Segoe UI", Roboto, Ubuntu, "Noto Sans", sans-serif;
      --color-text-primary: #1a1d21;
      --color-text-secondary: #4a5568;
      --color-background-primary: #f0f4f8;
      --color-background-secondary: #e8eef5;
      --color-background-tertiary: #dce4ee;
      --color-border-primary: #2d3748;
      --color-border-secondary: #a0aec0;
      --color-border-tertiary: #cbd5e0;
      --border-radius-lg: 10px;
      --focus-ring: 0 0 0 2px #fff, 0 0 0 4px #3182ce;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-text-primary: #e8ecf1;
        --color-text-secondary: #a0aec0;
        --color-background-primary: #1a202c;
        --color-background-secondary: #2d3748;
        --color-background-tertiary: #374151;
        --color-border-primary: #e2e8f0;
        --color-border-secondary: #718096;
        --color-border-tertiary: #4a5568;
        --focus-ring: 0 0 0 2px #1a202c, 0 0 0 4px #63b3ed;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem clamp(12px, 4vw, 24px) 2rem;
      font-family: var(--font-sans);
      color: var(--color-text-primary);
      background: var(--color-background-primary);
      line-height: 1.5;
    }

    .page {
      max-width: 680px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--color-border-tertiary);
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(1.15rem, 3vw, 1.35rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .page-header p {
      margin: 0.35rem 0 0;
      font-size: 0.875rem;
      color: var(--color-text-secondary);
    }

    .legend-section h2 {
      margin: 0 0 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-secondary);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 8px;
      margin-bottom: 1rem;
      justify-content: center;
      padding: 0;
    }

    .lg {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font: inherit;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      border: 1.5px solid transparent;
      color: var(--color-text-secondary);
      background: var(--color-background-secondary);
    }

    .lg:hover {
      border-color: var(--color-border-secondary);
    }

    .lg:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .lg[aria-pressed="true"] {
      border-color: var(--color-border-primary);
      background: var(--color-background-tertiary);
      color: var(--color-text-primary);
    }

    .lg .d {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pinout {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: center;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
    }

    .side {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
      padding: 3px 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      font: inherit;
      color: inherit;
      text-align: inherit;
      border: none;
      background: transparent;
    }

    .side:hover {
      background: var(--color-background-secondary);
    }

    .side:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .side.hl {
      background: var(--color-background-secondary);
      outline: 1.5px solid var(--color-border-primary);
    }

    .side.dim {
      opacity: 0.18;
    }

    .left { flex-direction: row-reverse; }
    .right { flex-direction: row; }

    .circ {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 500;
      color: #fff;
      flex-shrink: 0;
      line-height: 1;
    }

    .gap {
      width: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gap-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-border-tertiary);
    }

    .badges {
      display: flex;
      gap: 2px;
      align-items: center;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .left .badges { flex-direction: row-reverse; }

    .b {
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 9.5px;
      font-weight: 500;
      white-space: nowrap;
      line-height: 1.5;
    }

    .b-gpio {
      background: var(--color-background-tertiary);
      color: var(--color-text-secondary);
    }

    .b-dev { color: #fff; opacity: 0.9; }
    .b-fn { color: #fff; }
    .b-bus { color: #fff; opacity: 0.75; font-size: 8.5px; }

    .info-panel {
      margin-top: 0.75rem;
      padding: 10px 14px;
      border-radius: var(--border-radius-lg);
      background: var(--color-background-secondary);
      font-size: 13px;
      line-height: 1.6;
      color: var(--color-text-secondary);
      min-height: 3rem;
    }

    .info-panel strong {
      color: var(--color-text-primary);
      font-weight: 600;
    }

    .info-panel .pin-title { font-weight: 600; }
  </style>
</head>
<body>
  <main class="page">
    <article aria-labelledby="pinout-title">
      <header class="page-header">
        <h1 id="pinout-title">Raspberry Pi 4 — 40-pin HAT</h1>
        <p>Интерактивная распиновка: фильтр по легенде, клик по пину — описание.</p>
      </header>

      <section class="legend-section" aria-labelledby="legend-heading">
        <h2 id="legend-heading">Легенда</h2>
        <div class="legend" id="leg" role="toolbar" aria-label="Фильтр по типу сигнала"></div>
      </section>

      <section class="pinout-section" aria-label="Схема контактов">
        <div class="pinout" id="grid" role="group" aria-label="Контакты 40-pin, пара в ряд"></div>
      </section>

      <aside class="info-panel" id="info" role="status" aria-live="polite">
        Нажмите на пин для подробностей
      </aside>
    </article>
  </main>

  <script>
    const C = {
      pwr5v: { n: '5V', c: '#D85A30' },
      pwr33: { n: '3.3V', c: '#E8963C' },
      gnd: { n: 'GND', c: '#333' },
      i2c: { n: 'I2C', c: '#5B8AC2' },
      crsf: { n: 'CRSF', c: '#D4537E' },
      gps: { n: 'GPS', c: '#1D9E75' },
      rx5808: { n: 'RX5808', c: '#7F77DD' },
      servo: { n: 'Servo', c: '#639922' },
      pwrkey: { n: 'Ключи', c: '#BA7517' },
      free: { n: 'Свободный', c: '#999' },
      rsv: { n: 'Зарезерв.', c: '#4A6FA5' }
    };

    const P = [
      { n: 1, g: '3.3V', d: 'pwr33', fn: '', dev: '', bus: '', note: 'Питание 3.3В для логики' },
      { n: 2, g: '5V', d: 'pwr5v', fn: '', dev: '', bus: '', note: 'Питание 5В — основное' },
      { n: 3, g: 'GPIO 2', d: 'i2c', fn: 'SDA', dev: 'I2C', bus: 'I2C1', note: 'I2C1 SDA — ADC + GPS + Matek INA-BM' },
      { n: 4, g: '5V', d: 'pwr5v', fn: '', dev: '', bus: '', note: 'Питание 5В — основное' },
      { n: 5, g: 'GPIO 3', d: 'i2c', fn: 'SCL', dev: 'I2C', bus: 'I2C1', note: 'I2C1 SCL — ADC + GPS + Matek INA-BM' },
      { n: 6, g: 'GND', d: 'gnd', fn: '', dev: '', bus: '', note: 'Общая земля' },
      { n: 7, g: 'GPIO 4', d: 'gps', fn: 'TX', dev: 'GPS', bus: 'UART3', note: 'UART3 TX → GPS RX' },
      { n: 8, g: 'GPIO 14', d: 'crsf', fn: 'TXD', dev: 'CRSF', bus: 'UART0', note: 'UART0 TX → CRSF RX' },
      { n: 9, g: 'GND', d: 'gnd', fn: '', dev: '', bus: '', note: 'Общая земля' },
      { n: 10, g: 'GPIO 15', d: 'crsf', fn: 'RXD', dev: 'CRSF', bus: 'UART0', note: 'UART0 RX ← CRSF TX' },
      { n: 11, g: 'GPIO 17', d: 'crsf', fn: 'GPIO', dev: 'CRSF', bus: '', note: 'Доп. GPIO для CRSF (bind/LED)' },
      { n: 12, g: 'GPIO 18', d: 'free', fn: 'PWM0', dev: '', bus: '', note: 'Свободен — аппаратный PWM0' },
      { n: 13, g: 'GPIO 27', d: 'crsf', fn: 'GPIO', dev: 'CRSF', bus: '', note: 'Доп. GPIO для CRSF (bind/LED)' },
      { n: 14, g: 'GND', d: 'gnd', fn: '', dev: '', bus: '', note: 'Общая земля' },
      { n: 15, g: 'GPIO 22', d: 'pwrkey', fn: '5V SW', dev: 'Ключ', bus: '', note: 'Управление ключом питания 5В' },
      { n: 16, g: 'GPIO 23', d: 'pwrkey', fn: '12V SW', dev: 'Ключ', bus: '', note: 'Управление ключом питания 12В' },
      { n: 17, g: '3.3V', d: 'pwr33', fn: '', dev: '', bus: '', note: 'Питание 3.3В для логики' },
      { n: 18, g: 'GPIO 24', d: 'rx5808', fn: 'MUX_A', dev: 'RX5808', bus: '', note: 'Бит A мультиплексора (1 из 4 RX)' },
      { n: 19, g: 'GPIO 10', d: 'rx5808', fn: 'DATA', dev: 'RX5808', bus: '', note: 'Данные (MOSI) для RX5808' },
      { n: 20, g: 'GND', d: 'gnd', fn: '', dev: '', bus: '', note: 'Общая земля' },
      { n: 21, g: 'GPIO 9', d: 'rx5808', fn: 'MUX_B', dev: 'RX5808', bus: '', note: 'Бит B мультиплексора (1 из 4 RX)' },
      { n: 22, g: 'GPIO 25', d: 'rx5808', fn: 'SIG', dev: 'RX5808', bus: '', note: 'Сигнал/RSSI от выбранного RX' },
      { n: 23, g: 'GPIO 11', d: 'rx5808', fn: 'CLK', dev: 'RX5808', bus: '', note: 'Тактовая линия для RX5808' },
      { n: 24, g: 'GPIO 8', d: 'free', fn: 'CE0', dev: '', bus: '', note: 'Свободен — SPI0 CE0' },
      { n: 25, g: 'GND', d: 'gnd', fn: '', dev: '', bus: '', note: 'Общая земля' },
      { n: 26, g: 'GPIO 7', d: 'free', fn: 'CE1', dev: '', bus: '', note: 'Свободен — SPI0 CE1' },
      { n: 27, g: 'GPIO 0', d: 'rsv', fn: 'ID_SD', dev: 'EEPROM', bus: 'I2C0', note: 'Зарезерв. для HAT EEPROM' },
      { n: 28, g: 'GPIO 1', d: 'rsv', fn: 'ID_SC', dev: 'EEPROM', bus: 'I2C0', note: 'Зарезерв. для HAT EEPROM' },
      { n: 29, g: 'GPIO 5', d: 'gps', fn: 'RX', dev: 'GPS', bus: 'UART3', note: 'UART3 RX ← GPS TX' },
      { n: 30, g: 'GND', d: 'gnd', fn: '', dev: '', bus: '', note: 'Общая земля' },
      { n: 31, g: 'GPIO 6', d: 'free', fn: '', dev: '', bus: '', note: 'Свободен' },
      { n: 32, g: 'GPIO 12', d: 'servo', fn: 'TX', dev: 'Servo', bus: 'UART5', note: 'UART5 TX → ServoDriver RX' },
      { n: 33, g: 'GPIO 13', d: 'servo', fn: 'RX', dev: 'Servo', bus: 'UART5', note: 'UART5 RX ← ServoDriver TX' },
      { n: 34, g: 'GND', d: 'gnd', fn: '', dev: '', bus: '', note: 'Общая земля' },
      { n: 35, g: 'GPIO 19', d: 'free', fn: 'MISO', dev: '', bus: '', note: 'Свободен — SPI1 MISO' },
      { n: 36, g: 'GPIO 16', d: 'free', fn: '', dev: '', bus: '', note: 'Свободен' },
      { n: 37, g: 'GPIO 26', d: 'free', fn: '', dev: '', bus: '', note: 'Свободен' },
      { n: 38, g: 'GPIO 20', d: 'free', fn: 'MOSI', dev: '', bus: '', note: 'Свободен — SPI1 MOSI' },
      { n: 39, g: 'GND', d: 'gnd', fn: '', dev: '', bus: '', note: 'Общая земля' },
      { n: 40, g: 'GPIO 21', d: 'free', fn: 'SCLK', dev: '', bus: '', note: 'Свободен — SPI1 SCLK' }
    ];

    let filt = null;
    const leg = document.getElementById('leg');
    const grid = document.getElementById('grid');
    const info = document.getElementById('info');

    Object.entries(C).forEach(([k, v]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lg';
      btn.dataset.filterKey = k;
      btn.setAttribute('aria-pressed', 'false');
      const dot = document.createElement('span');
      dot.className = 'd';
      dot.style.background = v.c;
      dot.setAttribute('aria-hidden', 'true');
      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(v.n));
      btn.addEventListener('click', () => {
        const on = filt === k;
        leg.querySelectorAll('.lg').forEach((b) => b.setAttribute('aria-pressed', 'false'));
        if (on) {
          filt = null;
        } else {
          filt = k;
          btn.setAttribute('aria-pressed', 'true');
        }
        upHL();
      });
      leg.appendChild(btn);
    });

    function upHL() {
      document.querySelectorAll('.side').forEach((s) => {
        s.classList.remove('hl', 'dim');
        if (filt) {
          if (s.dataset.d === filt) s.classList.add('hl');
          else s.classList.add('dim');
        }
      });
    }

    function mkB(p, isL) {
      const col = C[p.d].c;
      const parts = [];
      const gpio = `<span class="b b-gpio">${p.g}</span>`;
      const dev = p.dev ? `<span class="b b-dev" style="background:${col}">${p.dev}</span>` : '';
      const fn = p.fn ? `<span class="b b-fn" style="background:${col}">${p.fn}</span>` : '';
      const bus = p.bus ? `<span class="b b-bus" style="background:${col}">${p.bus}</span>` : '';
      if (isL) {
        if (bus) parts.push(bus);
        if (dev) parts.push(dev);
        if (fn) parts.push(fn);
        parts.push(gpio);
      } else {
        parts.push(gpio);
        if (fn) parts.push(fn);
        if (dev) parts.push(dev);
        if (bus) parts.push(bus);
      }
      return parts.join('');
    }

    function show(i) {
      const p = P[i];
      const d = C[p.d];
      const frag = document.createDocumentFragment();
      const title = document.createElement('span');
      title.className = 'pin-title';
      title.style.color = d.c;
      title.textContent = `Pin ${p.n}`;
      frag.appendChild(title);
      frag.appendChild(document.createTextNode(` · ${p.g}`));
      if (p.fn) frag.appendChild(document.createTextNode(` · ${p.fn}`));
      if (p.dev) {
        frag.appendChild(document.createTextNode(' · '));
        const devSpan = document.createElement('span');
        devSpan.style.color = d.c;
        devSpan.textContent = p.dev;
        frag.appendChild(devSpan);
      }
      if (p.bus) frag.appendChild(document.createTextNode(` · ${p.bus}`));
      const br = document.createElement('br');
      frag.appendChild(br);
      frag.appendChild(document.createTextNode(p.note));
      info.replaceChildren(frag);
    }

    for (let r = 0; r < 20; r++) {
      const L = P[r * 2];
      const R = P[r * 2 + 1];
      const row = document.createElement('div');
      row.className = 'row';

      const left = document.createElement('button');
      left.type = 'button';
      left.className = 'side left';
      left.dataset.d = L.d;
      left.setAttribute('aria-label', `Пин ${L.n}, ${L.g}`);
      left.innerHTML = `<div class="badges">${mkB(L, true)}</div><span class="circ" style="background:${C[L.d].c}">${L.n}</span>`;
      left.addEventListener('click', () => show(r * 2));

      const gap = document.createElement('div');
      gap.className = 'gap';
      gap.setAttribute('aria-hidden', 'true');
      gap.innerHTML = '<span class="gap-dot"></span>';

      const right = document.createElement('button');
      right.type = 'button';
      right.className = 'side right';
      right.dataset.d = R.d;
      right.setAttribute('aria-label', `Пин ${R.n}, ${R.g}`);
      right.innerHTML = `<span class="circ" style="background:${C[R.d].c}">${R.n}</span><div class="badges">${mkB(R, false)}</div>`;
      right.addEventListener('click', () => show(r * 2 + 1));

      row.append(left, gap, right);
      grid.appendChild(row);
    }
  </script>
</body>
</html>
