server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /home/r/pinout;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	location = /analysis.pdf {
		alias /home/r/kandid/analysis.pdf;
		default_type application/pdf;
		add_header Content-Disposition 'inline; filename="analysis.pdf"';
	}

	location /voila/latest/ {
		proxy_pass http://127.0.0.1:8867/voila/latest/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Port $server_port;

		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_read_timeout 86400s;
		proxy_connect_timeout 86400s;
		proxy_send_timeout 86400s;
		proxy_buffering off;
	}

	location /voila/ {
		proxy_pass http://127.0.0.1:8866/voila/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Port $server_port;

		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_read_timeout 86400s;
		proxy_connect_timeout 86400s;
		proxy_send_timeout 86400s;
		proxy_buffering off;
	}
}

