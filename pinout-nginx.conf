# Default vhost for this server's public IP (195.133.238.45).
# Host/SNI kchrpeak.ru and dev.kchrpeak.ru stay on their own sites.
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /var/www/pinout;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;

	ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
	ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

	root /var/www/pinout;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}
}
